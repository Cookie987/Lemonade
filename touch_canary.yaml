# ESP32S3 触摸（Canary）

esphome:
  project:
    name: "cookie987.lemonade"
    version: "1.12.0"
  name_add_mac_suffix: false

substitutions:
  # 机型信息（公共默认值见 packages/touch-firmware.yaml）
  lemonade_device_name: "lemonade-tc"
  lemonade_device_model: "智能时钟_T"
  lemonade_version: "1.12.0 Canary"
  lemonade_update_info_url: !secret update_info_url_t_canary
  lemonade_app_store_index_url: !secret app_store_index_url
  lemonade_app_platform: "s3_t"
  log_level: DEBUG
  battery_warning_temp: 55.0
  battery_low_temp: 50.0

external_components:
  - source: components

api:
  reboot_timeout: 0s

esp32_ble_beacon: !remove

packages:
  - !include packages/touch-firmware.yaml
  # 板级硬件：T / T_3.2 只有这一行不同
  - !include packages/s3_touch/hardware.yaml
