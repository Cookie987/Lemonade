# ESP32S3 无触摸

esphome:
  name: "lemonade"
  friendly_name: "lemonade"
  on_boot:
    then:
      - light.turn_on:
          id: backlight
          transition_length: 1s
      - lambda: |-
          float b = id(backlight).current_values.get_brightness();
          lv_slider_set_value(id(backlight_slider), b * 50.0, LV_ANIM_ON);
          
esp32:
  board: um_pros3
  framework:
    type: esp-idf
    advanced:
      execute_from_psram: true

psram:
  mode: octal
  speed: 80MHz

captive_portal:

globals:
  - id: firmware_version
    type: std::string
    initial_value: '"0.3.0"'
  - id: sleeping
    type: bool
    restore_value: no
    initial_value: 'false'
  - id: slider_changing
    type: bool
    restore_value: no
    initial_value: "false"
  - id: timer_running
    type: bool
    # restore_value: yes
    initial_value: 'false'
  - id: stopwatch_start_time
    type: unsigned long
    restore_value: yes
    initial_value: '0'
  - id: stopwatch_paused_time
    type: unsigned long
    restore_value: yes
    initial_value: '0'
  - id: countdown_running
    type: bool
    restore_value: yes
    initial_value: 'false'
  - id: countdown_end_time
    type: unsigned long
    restore_value: yes
    initial_value: '0'
  - id: countdown_hours
    type: int
    restore_value: yes
    initial_value: '0'
  - id: countdown_minutes
    type: int
    restore_value: yes
    initial_value: '0'
  - id: countdown_seconds
    type: int
    restore_value: yes
    initial_value: '0'

# Enable logging
logger:

# Enable Home Assistant API
api:
