spi:
  clk_pin: GPIO18
  mosi_pin: GPIO17

sensor: !include sensor.yaml

binary_sensor: !include binary_sensor.yaml

interval: !include interval.yaml

time:
  - platform: sntp
    id: ntp_time
    timezone: "Asia/Shanghai"   # 可改为你所在时区
    servers:
      - 39.101.78.82
      - cn.pool.ntp.org
    on_time_sync: 
      then:
        - lambda: |-
            // 初始化秒表状态（仅在没有保存的状态时）
            static bool initialized = false;
            if (!initialized) {
              initialized = true;
              // 如果没有有效的保存状态，则初始化为默认值
              if (id(stopwatch_start_time) == 0 && id(stopwatch_paused_time) == 0) {
                id(stopwatch_start_time) = millis();
                id(stopwatch_paused_time) = 0;
              }
              unsigned long elapsed = millis() - id(stopwatch_start_time);
              int hours = (elapsed / 1000) / 3600;
              int minutes = ((elapsed / 1000) / 60) % 60;
              int seconds = (elapsed / 1000) % 60;
              int hundredths = (elapsed % 1000) / 10;  // 精确到0.01秒
              char buf[16];
              sprintf(buf, "%02d:%02d:%02d.%02d", hours, minutes, seconds, hundredths);
              // lv_label_set_text(id(stopwatch_label), buf);
              // 初始化倒计时状态
              if (id(countdown_end_time) > 0 && id(countdown_running)) {
                // 如果倒计时正在运行且未结束，则继续倒计时
                unsigned long current_time = millis();
                lv_label_set_text(id(countdown_button_text), "暂停");
                if (current_time >= id(countdown_end_time)) {
                  // 如果倒计时已经结束，重置状态
                  id(countdown_running) = false;
                  id(countdown_end_time) = 0;
                }
              }
              unsigned long current_time = millis();
              if (current_time < id(countdown_end_time)) {
                // 计算剩余时间
                unsigned long remaining = (id(countdown_end_time) - current_time) / 1000;
                
                // 计算小时、分钟、秒
                int hours = remaining / 3600;
                int minutes = (remaining % 3600) / 60;
                int seconds = remaining % 60;
                
                // 更新roller显示
                lv_roller_set_selected(id(countdown_hours_tens).obj, hours / 10, LV_ANIM_ON);
                lv_roller_set_selected(id(countdown_hours_ones).obj, hours % 10, LV_ANIM_ON);
                lv_roller_set_selected(id(countdown_minutes_tens).obj, minutes / 10, LV_ANIM_ON);
                lv_roller_set_selected(id(countdown_minutes_ones).obj, minutes % 10, LV_ANIM_ON);
                lv_roller_set_selected(id(countdown_seconds_tens).obj, seconds / 10, LV_ANIM_ON);
                lv_roller_set_selected(id(countdown_seconds_ones).obj, seconds % 10, LV_ANIM_ON);
                
              }
            }
        

switch:
  - platform: gpio
    pin: GPIO48
    id: acc
    restore_mode: ALWAYS_ON


output:
  - platform: ledc
    pin: GPIO13
    id: backlight_pin

light:
  - platform: monochromatic
    output: backlight_pin
    name: "Screen Brightness"
    id: backlight
    restore_mode: RESTORE_DEFAULT_ON
    default_transition_length: 0.1s
    on_state:
      then:
        - if:
            condition:
              lambda: 'return !id(slider_changing);'   # 防止循环更新
            then:
              - lambda: |-
                    id(slider_changing) = true;
              - delay: 100ms   
              - lvgl.slider.update:
                  id: backlight_slider
                  value: !lambda 'return id(backlight).current_values.get_brightness() * 50.0;'
                  animated: false  
              - lambda: |-
                    id(slider_changing) = false;  // 恢复标志

