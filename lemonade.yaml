    - id: system_setting_page
      on_load:
        - lvgl.widget.enable: [backlight_slider, roller_image, update_system]
      on_unload:
        - lvgl.widget.disable: [backlight_slider, roller_image, update_system]
      widgets:
        - label:
            text: "系统设置"
            text_font: chinese_font14
            state:
              disabled: true
            align: TOP_MID
        - label:
            text: "屏幕亮度"
            text_font: chinese_font14
            state:
              disabled: true
            x: 19
            y: 53
        - slider:
            id: backlight_slider
            min_value: 1
            max_value: 50
            value: 50
            width: 200
            x: 93
            y: 59
            state:
              disabled: true
            on_value:
              then:
                - if:
                    condition:
                      lambda: 'return !id(slider_changing);'   # 防止循环更新
                    then:
                      - lambda: |-
                          id(slider_changing) = true;   // 标记滑块正在调整
                      - light.turn_on:
                          id: backlight
                          brightness: !lambda 'return lv_slider_get_value(id(backlight_slider)) / 50.0;'
                      - delay: 100ms                   # 给动画一点时间
                      - lambda: |-
                          id(slider_changing) = false;  // 恢复标志
        - roller:
            id: roller_image
            x: 130
            y: 93
            width: 163
            height: 45
            anim_time: 0.5s
            mode: INFINITE
            state:
              disabled: true
            options:
              - 系统默认
              - 网络图片1
              - 网络图片2
              - 网络图片3
              - 无
            text_font: chinese_font14
            on_value:
              then:
                - lvgl.widget.show: bg_image
                - if:
                    condition:
                      lambda: 'return id(roller_image).get_selected_text() == "系统默认";'
                    then:
                      - lvgl.image.update:
                          id: bg_image
                          src: defaultbg
                - if:
                    condition:
                      lambda: 'return id(roller_image).get_selected_text() == "网络图片1";'
                    then:
                      - lvgl.image.update:
                          id: bg_image
                          src: online_image1
                - if:
                    condition:
                      lambda: 'return id(roller_image).get_selected_text() == "网络图片2";'
                    then:
                      - lvgl.image.update:
                          id: bg_image
                          src: online_image2
                - if:
                    condition:
                      lambda: 'return id(roller_image).get_selected_text() == "网络图片3";'
                    then:
                      - lvgl.image.update:
                          id: bg_image
                          src: online_image3
                - if:
                    condition:
                      lambda: 'return id(roller_image).get_selected_text() == "无";'
                    then:
                      - lvgl.widget.hide: bg_image

        - label:
            id: label_2
            x: 19
            y: 103
            text: "背景图片"
            text_font: chinese_font14
            state:
              disabled: true
        
        - button:
            id: update_system
            x: 19
            y: 150
            width: 274
            height: 32
            widgets:
              - label:
                  align: CENTER
                  text_font: chinese_font14
                  text: "执行系统更新"
            on_click:
              then: 
                - lvgl.widget.show: update_message_box
                - lvgl.widget.disable: [backlight_slider, roller_image, update_system, page_next, page_next]
                - lvgl.widget.enable: update_message_box
                - lvgl.widget.focus:
                    id: msgbox_close
                    editing: true
