  encryption:
    key: "GZV94t0Ynjcna4aoilVTHjhliknuxp8cK9elyuShrKs="

ota:
  - platform: esphome
    password: "bd5d6555da5018ba504773dfe83992d1"
    on_begin:
      - output.set_level:
          id: backlight_pin
