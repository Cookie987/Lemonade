lvgl:
  on_boot:
    then:
      - lambda: |-
          // ime
          // lv_obj_t * pinyin_ime = lv_ime_pinyin_create(tab_message_channel);
          // lv_ime_pinyin_set_keyboard(pinyin_ime, id(keyboard_message_channel_input)->obj);
          // lv_ime_pinyin_set_mode(pinyin_ime,
          //                       LV_IME_PINYIN_MODE_K9);  // Set to 9-key input mode. Default: 26-key input(k26) mode.
          // lv_obj_t * cand_panel = lv_ime_pinyin_get_cand_panel(pinyin_ime);
          // lv_obj_set_size(cand_panel, LV_PCT(100), LV_PCT(10));
          // lv_obj_align_to(cand_panel, id(keyboard_message_channel_input)->obj, LV_ALIGN_OUT_TOP_MID, 0, 0);
  pages:
    - id: !extend page_main
      widgets:
        - tileview:
            id: !extend tileview_main
            tiles:
              - id: !extend tile_appcenter
                widgets:
                  - image:
                      src: message_icon
                      id: img_message_app
                      width: 96
                      height: 96
                      x: -96
                      y: 45
                      align: CENTER
                      on_click:
                        then:
                          - lvgl.page.show:
                              id: page_message
                              animation: FADE_IN
                              time: 200ms
    - id: page_message
      on_load:
        - lvgl.label.update:
            id: lbl_topbar_title
            text: "消息"
        - lambda: |-
            // 测试用
            lv_list_add_text(id(list_message_channel), "2023-01-01 12:00:00");
            lv_list_add_btn(list_message_channel, NULL, "aa：你好");
            lv_list_add_btn(list_message_channel, NULL, "bb：你好");
            lv_list_add_btn(list_message_channel, NULL, "cc：你好");
            lv_list_add_btn(list_message_channel, NULL, "dd：你好");
            lv_list_add_btn(list_message_channel, NULL, "ee：你好");
            lv_list_add_btn(list_message_channel, NULL, "ff：你好");
            lv_list_add_btn(list_message_channel, NULL, "gg：你好");
            lv_list_add_text(id(list_message_channel), "2023-01-01 12:05:00");
            lv_list_add_btn(list_message_channel, NULL, "hh：你好");
            lv_list_add_btn(list_message_channel, NULL, "ii：你好");
            lv_list_add_btn(list_message_channel, NULL, "jj：extra long message to test line wrapping functionality");
      widgets:
        - tabview:
            id: tabview_message
            anim_time: 0.5s
            x: 0
            y: 18
            width: 320
            height: 222
            size: 15%
            tabs:
              - name: 好友
                id: tab_message_friend
                widgets:
                  - label:
                      id: lbl_message_placeholder
                      align: CENTER
                      text: "还在做，不过已经有思路了\n¯\\_(ツ)_/¯"
              - name: 私聊
                id: tab_message_private
                widgets:
                  - label:
                      id: lbl_message_placeholder2
                      align: CENTER
                      text: "还在做，不过已经有思路了\n¯\\_(ツ)_/¯"
              - name: 频道
                id: tab_message_channel
                widgets:
                  - label:
                      id: lbl_message_channel_id_prompt
                      x: -80
                      y: 5
                      align: TOP_MID
                      text: "频道号："
                  - container:
                      id: container_message_channel_input
                      x: 40
                      y: -10
                      width: 160
                      height: 50
                      align: TOP_MID
                      widgets:
                        - button:
                            id: btn_message_channel_increase
                            align: RIGHT_MID
                            width: 40
                            height: 40
                            widgets:
                              - label:
                                  align: CENTER
                                  text: "+"
                            on_click:
                              then:
                                - lvgl.spinbox.increment: spinbox_message_channel_number
                        - button:
                            id: btn_message_channel_decrease
                            align: LEFT_MID
                            width: 40
                            height: 40
                            widgets:
                              - label:
                                  align: CENTER
                                  text: "-"
                            on_click:
                              then:
                                - lvgl.spinbox.decrement: spinbox_message_channel_number
                        - spinbox:
                            id: spinbox_message_channel_number
                            x: 0
                            y: 0
                            align: CENTER
                            width: 60
                            height: 40
                            digits: 4
                            range_from: 10.00
                            range_to: 99.99
                            value: 10.00
                            decimal_places: 2
                  - list:
                      id: list_message_channel
                      align: CENTER
                      y: 70
                      width: 280
                      height: 170
                      items:
                        # 按钮类型项目
                        - text: "2023-01-01 12:00:00"
                          list_text: {}
                        - text: "[系统] 欢迎来到频道！" 
                          list_button: {}
                  - textarea:
                      id: textarea_message_channel_input
                      x: 0
                      y: 140
                      align: BOTTOM_MID
                      width: 280
                      height: 40
                      placeholder_text: "输入消息..."
                  - keyboard:
                      x: 0
                      y: 240
                      align: BOTTOM_MID
                      id: keyboard_message_channel_input
                      textarea: textarea_message_channel_input
