i2s_audio:
  - id: i2s_output
    i2s_lrclk_pin: GPIO12
    i2s_bclk_pin: GPIO5
    i2s_mclk_pin: GPIO4

audio_dac:
  - platform: es8311
    sample_rate: 48000
    bits_per_sample: 24bit

speaker:
  - platform: i2s_audio
    id: speaker32
    sample_rate: 48000
    bits_per_sample: 24bit
    mclk_multiple: 384
    dac_type: external
    i2s_dout_pin: GPIO45

media_player:
  - platform: speaker
    codec_support_enabled: ALL
    id: media_player32
    announcement_pipeline:
      speaker: speaker32
