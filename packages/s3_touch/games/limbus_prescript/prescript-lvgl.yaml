                  auto pick = [](const std::vector<std::string>& v) -> std::string {
                      return v.empty() ? "" : v[esp_random() % v.size()];
                  };
                  std::string target_text;
                  if (esp_random() % 100 < 20) {
                      target_text = pick(egg);
                  } else {
                      uint32_t type = esp_random() % 3;
                      if (type == 0) target_text = pick(scn) + pick(act);
                      if (type == 1) target_text = pick(scn) + pick(act) + pick(sup);
                      if (type == 2) target_text = (esp_random() % 2 == 0) ? pick(act) : pick(act) + pick(sup);
                  }
                  AnimState* state = new AnimState{lbl_limbus_prescript_content, target_text, 0};
                  // 4. 创建定时器并使用 Lambda 表达式作为回调
                  lv_timer_create([](lv_timer_t * t) {
                      auto* s = static_cast<AnimState*>(t->user_data);
                      // 如果 Label 已被销毁，清理并退出
                      if(!lv_obj_is_valid(s->label)) {
                          delete s;
                          lv_timer_del(t);
                          return;
                      }

                      std::string display_str = "";
                      // A. 已解密部分：加上目标颜色 #15dcff
                      if (s->current_idx > 0) {
                          display_str += "#15dcff " + s->text.substr(0, s->current_idx) + "#";
                      }

                      // B. 乱码部分：保持默认颜色（或你可以指定另一种颜色）
                      if (s->current_idx < s->text.length()) {
                          display_str += " "; // 间隔
                          for (size_t i = s->current_idx; i < s->text.length(); ++i) {
                              if (s->text[i] == ' ') {
                                  display_str += " ";
                              } else {
                                  display_str += mask_chars[esp_random() % (sizeof(mask_chars) - 1)];
                              }
                          }
                      }

                      lv_label_set_text(s->label, display_str.c_str());

                      // 更新逻辑
                      if (s->current_idx < s->text.length()) {
                          s->current_idx++;
                      } else {
                          // 动画结束后的最终显示（确保没有残留的乱码标签）
                          lv_label_set_text(s->label, ("#15dcff " + s->text + "#").c_str());
                          delete s;
                          lv_timer_del(t);
                      }
                  }, speed_ms, state);
