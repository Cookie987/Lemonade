# 鳊鱼八十 prescript
lvgl:
  pages:
    - id: !extend page_main
      widgets:
        - tileview:
            id: !extend tileview_main
            tiles:
              - id: !extend tile_appcenter
                widgets:
                  - image:
                      src: limbus_prescript_icon
                      id: img_limbus_prescript_app
                      width: 96
                      height: 96
                      x: 0
                      y: 45
                      align: CENTER
                      on_click:
                        then:
                          - lvgl.page.show:
                              id: page_limbus_prescript
                              animation: FADE_IN
                              time: 200ms

    - id: page_limbus_prescript
      on_load:
        - lvgl.label.update:
            id: lbl_topbar_title
            text: "Prescript"
        - lvgl.widget.hide: [lbl_topbar_title, lbl_topbar_date, lbl_topbar_time]
        - lvgl.canvas.fill:
            id: canvas_limbus_prescript_bg
            color: !lambda return lv_color_hex(0x000000);
      on_unload:
        - lvgl.label.update:
            id: lbl_limbus_prescript_content
            text: "#15dcff - Click to receive -#"
      widgets:
        - canvas:
            id: canvas_limbus_prescript_bg
            width: 320
            height: 240
            x: 0
            y: 0
        - image:
            id: img_prescript_logo
            src: prescript_logo
            width: 85
            height: 100
            x: 0
            y: 5
            align: TOP_MID
        - label:
            id: lbl_limbus_prescript_content
