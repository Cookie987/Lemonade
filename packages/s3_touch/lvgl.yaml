lvgl:
  id: lvgl_1
  log_level: WARN
  double_buffer: true
  use_dma: true
  use_psram: true
  touchscreens:
    touchscreen_id: touch_panel
  buffer_size: 100%
  on_idle:
    - timeout: 30s
      then:
        - switch.turn_off: switch_powermanage_lock_apb
  color_depth: 16
  resume_on_input: false
  top_layer:
    widgets:
      - label:
          id: lbl_topbar_title
          align: TOP_MID
          height: 14
          text: "系统设置"
          recolor: true
          text_font: chinese_font14
      - label:
          id: lbl_topbar_date
          x: 8
          align: TOP_LEFT
          height: 14
          text: "01.01 Thu"
          recolor: true
          text_font: chinese_font14
      - label:
          id: lbl_topbar_time
          align: TOP_RIGHT
          x: -8
          height: 14
          text: "00:00"
          recolor: true
          text_font: chinese_font14

      - obj:
          id: boot_screen
          x: 0
          y: 0
          width: 100%
          height: 100%
          bg_color: 0x000000  # #000000
          bg_opa: COVER
          radius: 0
          pad_all: 0
          border_width: 0
          widgets:
            - label:
                align: CENTER
                text_font: cookielogo
                recolor: true
                text: "#ffffff \uF564#"
                y: -40
            - spinner:
                align: CENTER
                y: 55
                height: 50
                width: 50
                spin_time: 1s
                arc_length: 60deg
                arc_width: 8
                indicator:
                  arc_color: 0x18bcf2  # #18bcf2
                  arc_width: 8
          on_press:
            - lvgl.widget.hide: boot_screen
  msgboxes:
    - id: msgbox_battery_low
      close_button: false
      title: 警告
      text_font: chinese_font14
      body:
        text: "电池电量过低，请连接电源充电"
        text_font: chinese_font14
      buttons:
        - id: btn_battery_low_close
          text: "好"
          on_click:
            then:
              - lvgl.widget.hide: msgbox_battery_low

  default_font: chinese_font14
  pages:
    - id: page_main
      on_load:
        - lvgl.widget.hide: [lbl_topbar_title, lbl_topbar_date, lbl_topbar_time]
      on_unload:
        - lvgl.widget.show: [lbl_topbar_title, lbl_topbar_date, lbl_topbar_time]
      widgets:
        - image:
            id: background_image
            src: default_bg
        - tileview:
            id: tileview_main
            x: 0
            y: 0
            width: 100%
            height: 100%
            scrollbar_mode: "OFF"
            bg_opa: TRANSP
            tiles:
              - id: tile_clock
                column: 0
                row: 0
                widgets:
                  - obj:
                      align: BOTTOM_MID
                      id: obj_bottom_bar
                      width: 320
                      height: 25
                      scrollbar_mode: "OFF"
                      opa: 45%
                  - label:
                      id: time_label
                      align: CENTER
                      recolor: true
                      y: -10
                      text: "00:00:00"
                      # #f4f4f4ff
                      text_color: !lambda return lv_color_hex(0xffffff);
                      text_font: clock24
                  - label:
                      id: date_label
                      align: CENTER
                      y: -50
                      text: "1970-01-01 星期四"
                      text_color: !lambda return lv_color_hex(0xffffff);
                      text_font: chinese_font18
                  - label:
                      id: lbl_battery_status
                      align: BOTTOM_RIGHT
                      y: -3
                      x: -10
                      recolor: true
                      text: "\U000F0091 --%"  # start with mdi-battery-unknown
                  - label:
                      id: lbl_wifi_status
                      align: BOTTOM_LEFT
                      y: -2
                      x: 10
                      recolor: true
                      text: "\U000F092E --dBm"  # start with mdi-battery-unknown
              - id: tile_appcenter
                column: 0
                row: 1
                widgets:
                  - image:
                      src: settings_icon
                      id: img_settings_app
                      width: 96
                      height: 96
                      x: -96
                      y: -45
                      align: CENTER
                      on_click:
                        then:
                          - lvgl.page.show:
                              id: page_setting_menu
                              animation: FADE_IN
                              time: 200ms
                  - image:
                      src: timer_icon
                      id: img_timer_app
                      width: 96
                      height: 96
                      x: 0
                      y: -45
                      align: CENTER
                      on_click:
                        then:
                          - lvgl.page.show:
                              id: page_timer
                              animation: FADE_IN
                              time: 200ms
