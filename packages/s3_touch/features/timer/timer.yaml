packages:
  - !include timer-lvgl.yaml

esphome:
  on_boot:
    - priority: 600
      then:
        - script.execute: countdown_init
        - script.execute: stopwatch_init

globals:
  - id: stopwatch_start_time
    type: unsigned long
    restore_value: false
    initial_value: '0'
  - id: stopwatch_paused_time
    type: unsigned long
    restore_value: false
    initial_value: '0'
  - id: stopwatch_timer
    type: lv_timer_t *
    restore_value: no
    initial_value: 'nullptr'
  - id: is_timer_running
    type: bool
    # restore_value: false
    initial_value: 'false'
  - id: is_countdown_running
    type: bool
    restore_value: false
    initial_value: 'false'
  - id: countdown_end_time
    type: unsigned long
    restore_value: false
    initial_value: '0'
  - id: countdown_hours
    type: int
    restore_value: false
    initial_value: '0'
  - id: countdown_minutes
    type: int
    restore_value: false
    initial_value: '0'
  - id: countdown_seconds
    type: int
    restore_value: false
    initial_value: '0'
  - id: countdown_timer
    type: lv_timer_t *
    restore_value: no
    initial_value: 'nullptr'

script:
  - id: countdown_init
    then:
      - lambda: |
          // 创建每 1s 执行一次的定时器
          id(countdown_timer) = lv_timer_create([](lv_timer_t * t) {
              unsigned long current_time = millis();
              unsigned long end_time = id(countdown_end_time);
              if (current_time < end_time && !id(is_sleeping)) {
                // 计算剩余时间
                unsigned long remaining = (end_time - current_time + 500) / 1000;

                int hours = remaining / 3600;
                int minutes = (remaining % 3600) / 60;
                int seconds = remaining % 60;

                // 更新 Roller 界面
                lv_roller_set_selected(id(roller_countdown_hours_tens).obj, hours / 10, LV_ANIM_ON);
                lv_roller_set_selected(id(roller_countdown_hours_ones).obj, hours % 10, LV_ANIM_ON);
                lv_roller_set_selected(id(roller_countdown_minutes_tens).obj, minutes / 10, LV_ANIM_ON);
                lv_roller_set_selected(id(roller_countdown_minutes_ones).obj, minutes % 10, LV_ANIM_ON);
                lv_roller_set_selected(id(roller_countdown_seconds_tens).obj, seconds / 10, LV_ANIM_ON);
                lv_roller_set_selected(id(roller_countdown_seconds_ones).obj, seconds % 10, LV_ANIM_ON);
              } else {
                // 时间到
                id(is_countdown_running) = false;
                lv_label_set_text(id(lbl_countdown_button), "开始");
                // 只有当 end_time 不为 0 时才发送通知，防止定时器空转时反复弹窗
                if (end_time != 0) {
                  id(show_notification)->execute("倒计时已结束", "", 0);
                  lv_roller_set_selected(id(roller_countdown_seconds_ones).obj, 0, LV_ANIM_ON);
                  id(countdown_end_time) = 0; // 清除结束时间防止重复触发
                }
              }
          }, 1000, nullptr);
          lv_timer_pause(id(countdown_timer));

  - id: stopwatch_init
    then:
      - lambda: |
          id(stopwatch_timer) = lv_timer_create([](lv_timer_t * t) {
            if (page_timer->is_showing() && !id(is_sleeping)) {
              // 始终保持0.01s精度计算，但UI刷新降低到100ms
              unsigned long elapsed = millis() - id(stopwatch_start_time);
              // 内部保存完整的厘秒值
              static unsigned long internal_centiseconds = static_cast<unsigned long>(-1);
              unsigned long new_centiseconds = elapsed / 10;
              if (new_centiseconds == internal_centiseconds) {
                return;
              }
              internal_centiseconds = new_centiseconds;
              int hours = (elapsed / 1000) / 3600;
              int minutes = ((elapsed / 1000) / 60) % 60;
              int seconds = (elapsed / 1000) % 60;
              int centiseconds = (elapsed % 1000) / 10;
              static char buf[16];
              snprintf(buf, sizeof(buf), "%02d:%02d:%02d.%02d", hours, minutes, seconds, centiseconds);
              lv_label_set_text_static(id(lbl_stopwatch), buf);
            }
          }, 100, nullptr);
          lv_timer_pause(id(stopwatch_timer));

  - id: !extend sleep_button
    then:
      - lambda: |
          if (id(is_sleeping)) {
            lv_timer_pause(id(stopwatch_timer));
            lv_timer_pause(id(countdown_timer));
          }
          else {
            if (id(is_timer_running)) {
              lv_timer_resume(id(stopwatch_timer));
            }
            if (id(is_countdown_running)) {
              lv_timer_resume(id(countdown_timer));
            }
          }

  - id: !extend wakeup_button
    then:
      - lambda: |
          if (id(is_sleeping)) {
            lv_timer_pause(id(stopwatch_timer));
            lv_timer_pause(id(countdown_timer));
          }
          else {
            if (id(is_timer_running)) {
              lv_timer_resume(id(stopwatch_timer));
            }
            if (id(is_countdown_running)) {
              lv_timer_resume(id(countdown_timer));
            }
          }

image:
  rgb565:
    - file: "imgs/icon/app/timer-96x.png"
      transparency: alpha_channel
      id: timer_icon
      resize: 96x96
