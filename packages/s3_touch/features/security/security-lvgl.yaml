    - id: page_security_pattern
      skip: true
      on_load:
        - lvgl.widget.hide: [lbl_topbar_title, lbl_topbar_date, lbl_topbar_time, btn_back_setting]
        - lambda: |
            if (!id(security_pattern_handler_bound)) {
              auto *canvas = id(canvas_security_pattern);
              lv_obj_add_flag(canvas, LV_OBJ_FLAG_CLICKABLE);
              lv_obj_add_event_cb(
                  canvas,
                  [](lv_event_t *e) {
                    auto redraw = [&](const std::string &sequence, const lv_point_t *cursor) {
                      lv_obj_t *canvas_obj = id(canvas_security_pattern);
                      static const lv_point_t points[9] = {
                          {26, 26}, {80, 26}, {134, 26},
                          {26, 80}, {80, 80}, {134, 80},
                          {26, 134}, {80, 134}, {134, 134},
                      };

                      lv_canvas_fill_bg(canvas_obj, lv_color_hex(0x101820), LV_OPA_COVER);
                      lv_layer_t layer;
                      lv_canvas_init_layer(canvas_obj, &layer);

                      lv_draw_line_dsc_t line_dsc;
                      lv_draw_line_dsc_init(&line_dsc);
                      line_dsc.color = lv_color_hex(0x4FC3F7);
                      line_dsc.width = 5;
                      line_dsc.round_start = 1;
                      line_dsc.round_end = 1;

                      bool have_prev = false;
                      lv_point_t prev{};
                      for (char c : sequence) {
                        if (c < '1' || c > '9') {
                          continue;
                        }
                        lv_point_t current = points[c - '1'];
                        if (have_prev) {
                          line_dsc.p1.x = prev.x;
                          line_dsc.p1.y = prev.y;
                          line_dsc.p2.x = current.x;
                          line_dsc.p2.y = current.y;
                          lv_draw_line(&layer, &line_dsc);
                        }
                        prev = current;
                        have_prev = true;
                      }

                      if (cursor != nullptr && have_prev) {
                        line_dsc.p1.x = prev.x;
                        line_dsc.p1.y = prev.y;
                        line_dsc.p2.x = cursor->x;
                        line_dsc.p2.y = cursor->y;
                        lv_draw_line(&layer, &line_dsc);
                      }

                      for (int i = 0; i < 9; i++) {
                        bool selected =
                            sequence.find(static_cast<char>('1' + i)) != std::string::npos;

                        lv_draw_rect_dsc_t outer_dsc;
                        lv_draw_rect_dsc_init(&outer_dsc);
                        outer_dsc.bg_opa = LV_OPA_TRANSP;
                        outer_dsc.border_opa = LV_OPA_COVER;
                        outer_dsc.border_width = 3;
                        outer_dsc.border_color =
                            selected ? lv_color_hex(0x4FC3F7) : lv_color_hex(0x8AA4B8);
                        outer_dsc.radius = LV_RADIUS_CIRCLE;
                        lv_area_t outer_area = {
                            static_cast<lv_coord_t>(points[i].x - 14),
                            static_cast<lv_coord_t>(points[i].y - 14),
                            static_cast<lv_coord_t>(points[i].x + 13),
                            static_cast<lv_coord_t>(points[i].y + 13),
                        };
                        lv_draw_rect(&layer, &outer_dsc, &outer_area);

                        lv_draw_rect_dsc_t inner_dsc;
                        lv_draw_rect_dsc_init(&inner_dsc);
                        inner_dsc.bg_opa = selected ? LV_OPA_COVER : LV_OPA_40;
                        inner_dsc.bg_color =
                            selected ? lv_color_hex(0x4FC3F7) : lv_color_hex(0x29404F);
                        inner_dsc.border_opa = LV_OPA_TRANSP;
                        inner_dsc.radius = LV_RADIUS_CIRCLE;
                        lv_area_t inner_area = {
                            static_cast<lv_coord_t>(points[i].x - 5),
                            static_cast<lv_coord_t>(points[i].y - 5),
                            static_cast<lv_coord_t>(points[i].x + 4),
                            static_cast<lv_coord_t>(points[i].y + 4),
                        };
                        lv_draw_rect(&layer, &inner_dsc, &inner_area);
                      }

                      lv_canvas_finish_layer(canvas_obj, &layer);
                      lv_obj_invalidate(canvas_obj);
                    };

                    auto locate_point = [&](int local_x, int local_y) -> int {
                      static const lv_point_t points[9] = {
                          {26, 26}, {80, 26}, {134, 26},
                          {26, 80}, {80, 80}, {134, 80},
                          {26, 134}, {80, 134}, {134, 134},
                      };
                      const int threshold_sq = 25 * 25;
                      int found = 0;
                      int best_dist = threshold_sq + 1;
                      for (int i = 0; i < 9; i++) {
                        const int dx = local_x - points[i].x;
                        const int dy = local_y - points[i].y;
                        const int dist = dx * dx + dy * dy;
                        if (dist <= threshold_sq && dist < best_dist) {
                          best_dist = dist;
                          found = i + 1;
                        }
                      }
                      return found;
                    };

                    auto append_point = [&](int point_id) {
                      if (point_id < 1 || point_id > 9) {
                        return;
                      }
                      std::string &sequence = id(security_pattern_entry);
                      char current = static_cast<char>('0' + point_id);
                      if (sequence.find(current) != std::string::npos) {
                        return;
                      }
                      if (!sequence.empty()) {
                        int last = sequence.back() - '0';
                        int lr = (last - 1) / 3;
                        int lc = (last - 1) % 3;
                        int nr = (point_id - 1) / 3;
                        int nc = (point_id - 1) % 3;
                        if (((lr + nr) % 2 == 0) && ((lc + nc) % 2 == 0)) {
                          int mr = (lr + nr) / 2;
                          int mc = (lc + nc) / 2;
                          int mid = mr * 3 + mc + 1;
                          char mid_char = static_cast<char>('0' + mid);
                          if (mid != last && mid != point_id &&
                              sequence.find(mid_char) == std::string::npos) {
                            sequence.push_back(mid_char);
                          }
                        }
                      }
                      sequence.push_back(current);
                    };

                    if (id(security_flow_mode) != 4 &&
                        id(security_flow_mode) != 5 &&
                        id(security_flow_mode) != 6) {
                      return;
                    }

                    lv_obj_t *obj = static_cast<lv_obj_t *>(lv_event_get_target(e));
                    lv_event_code_t code = lv_event_get_code(e);
                    lv_indev_t *indev = lv_indev_get_act();
                    if (indev == nullptr || obj == nullptr) {
                      return;
                    }

                    lv_point_t screen_point;
                    lv_indev_get_point(indev, &screen_point);
                    lv_area_t area;
                    lv_obj_get_coords(obj, &area);
                    lv_point_t local_point = {
                        static_cast<lv_coord_t>(screen_point.x - area.x1),
                        static_cast<lv_coord_t>(screen_point.y - area.y1)};

                    if (code == LV_EVENT_PRESSED) {
                      id(security_pattern_entry).clear();
                      id(security_status_text).clear();
                      append_point(locate_point(local_point.x, local_point.y));
                      redraw(id(security_pattern_entry), &local_point);
                      id(security_render_pattern_page)->execute();
                      return;
                    }

                    if (code == LV_EVENT_PRESSING) {
                      append_point(locate_point(local_point.x, local_point.y));
                      redraw(id(security_pattern_entry), &local_point);
                      id(security_render_pattern_page)->execute();
                      return;
                    }

                    if (code == LV_EVENT_RELEASED) {
                      redraw(id(security_pattern_entry), nullptr);
                      id(security_submit_pattern)->execute();
                    }
                  },
                  LV_EVENT_ALL,
                  nullptr);
              id(security_pattern_handler_bound) = true;
            }
        - script.execute: security_render_pattern_page
      on_unload:
        - lvgl.widget.show: [lbl_topbar_title, lbl_topbar_date, lbl_topbar_time]
      widgets:
        - obj:
            x: 0
            y: 0
            width: 320
            height: 240
            bg_color: !lambda return lv_color_hex(0x101820);
            border_width: 0
            radius: 0
        - label:
            id: lbl_security_pattern_title
            align: TOP_MID
            y: 14
            text_font: chinese_font18
            text_color: !lambda return lv_color_hex(0xffffff);
            text: "九点连线"
        - label:
            id: lbl_security_pattern_prompt
            align: TOP_MID
            y: 40
            width: 260
            text_align: CENTER
            text_font: chinese_font14
            text_color: !lambda return lv_color_hex(0xd9e4ec);
            text: "请按住并滑动连接 9 个点"
        - canvas:
            id: canvas_security_pattern
            align: TOP_MID
            y: 64
            width: 160
            height: 160
        - button:
            x: 12
            y: 14
            width: 58
            height: 26
            bg_color: !lambda return lv_color_hex(0x2f343a);
            border_width: 0
            on_click:
              then:
                - script.execute: security_back_from_pattern
            widgets:
              - label:
                  align: CENTER
                  text_font: chinese_font14
                  text_color: !lambda return lv_color_hex(0xffffff);
                  text: "返回"
