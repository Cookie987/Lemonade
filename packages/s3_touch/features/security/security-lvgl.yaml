lvgl:
  pages:
    - id: page_lock_screen
      skip: true
      on_load:
        - lvgl.widget.hide: [lbl_topbar_title, lbl_topbar_date, lbl_topbar_time, btn_back_setting]
        - script.execute: security_render_lock_screen
      on_unload:
        - lvgl.widget.show: [lbl_topbar_title, lbl_topbar_date, lbl_topbar_time]
      widgets:
        - image:
            id: img_lock_screen_bg
            src: default_bg
            x: 0
            y: 0
        - obj:
            x: 0
            y: 0
            width: 320
            height: 240
            bg_color: !lambda return lv_color_hex(0x000000);
            bg_opa: 55%
            border_width: 0
            radius: 0
        - label:
            id: lbl_lock_indicator
            align: TOP_MID
            y: 24
            text_font: chinese_font18
            text_color: !lambda return lv_color_hex(0xffffff);
            text: "\uF023"
        - label:
            id: lbl_lock_date
            align: CENTER
            y: -54
            text_font: chinese_font18
            text_color: !lambda return lv_color_hex(0xffffff);
            text: "1970-01-01 星期四"
        - label:
            id: lbl_lock_time
            align: CENTER
            y: -6
            text_font: clock24
            text_color: !lambda return lv_color_hex(0xffffff);
            text: "00:00:00"
        - label:
            id: lbl_lock_weather
            align: CENTER
            y: 48
            text_font: chinese_font18
            text_color: !lambda return lv_color_hex(0xffffff);
            text: "N/A"
        - button:
            id: btn_lock_screen_unlock
            align: CENTER
            y: 92
            width: 148
            height: 34
            bg_color: !lambda return lv_color_hex(0x2f343a);
            border_width: 0
            on_click:
              then:
                - script.execute: security_show_unlock_entry
            widgets:
              - label:
                  align: CENTER
                  text_font: chinese_font14
                  text_color: !lambda return lv_color_hex(0xffffff);
                  text: "开始解锁"
        - label:
            id: lbl_lock_wifi_status
            align: BOTTOM_LEFT
            x: 10
            y: -6
            recolor: true
            text: "\U000F092E OFF"
        - label:
            id: lbl_lock_battery_status
            align: BOTTOM_RIGHT
            x: -10
            y: -6
            recolor: true
            text: "\U000F0091 --%"

