                            - lambda: |
                                std::string name = id(pending_action_contact);
                                id(pending_delete_contact) = name;
                                lv_obj_t * msgbox_content = lv_msgbox_get_content(msgbox_delete_contact);
                                lv_obj_t * msgbox_text =
                                    (msgbox_content != nullptr && lv_obj_get_child_count(msgbox_content) > 0)
                                        ? lv_obj_get_child(msgbox_content, 0)
                                        : nullptr;
                                if (msgbox_text != nullptr) {
                                  lv_label_set_text(msgbox_text, (std::string("确定删除 ") + name + " 吗？").c_str());
                                }
                                if (msgbox_text != nullptr &&
                                    (name == "cookie987" && id(uid) == "srr321" || name == "srr321" && id(uid) == "cookie987")) {
                                  lv_label_set_text(msgbox_text, (std::string("不要删掉我 QAQ\n") + std::string("确定删除 ") + name + " 吗？").c_str());
