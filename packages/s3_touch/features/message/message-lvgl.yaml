                                lv_obj_clear_flag(msgbox_delete_contact_outer, LV_OBJ_FLAG_HIDDEN);
                                lv_obj_move_foreground(msgbox_delete_contact_outer);
                            - lvgl.widget.hide: obj_contact_action_overlay
                    - button:
                        id: btn_contact_action_cancel
                        width: 200
                        height: 32
                        align: TOP_MID
