lvgl:
  msgboxes:
    - id: msgbox_delete_contact
      close_button: false
      title: 删除联系人
      text_font: chinese_font14
      body:
        text: "确定删除该联系人吗？"
        text_font: chinese_font14
      buttons:
        - id: btn_delete_contact_cancel
          text: "不"
          on_click:
            then:
              - lvgl.widget.hide: msgbox_delete_contact
        - id: btn_delete_contact_ok
          text: "好"
          on_click:
            then:
              - script.execute:
                  id: contacts_delete
                  contact: !lambda 'return id(pending_delete_contact);'
              - lvgl.widget.hide: msgbox_delete_contact
    - id: msgbox_clear_public_history
      close_button: false
      title: 清空频道记录
      text_font: chinese_font14
      body:
        text: "确定清空本地频道聊天记录吗？"
        text_font: chinese_font14
      buttons:
        - id: btn_clear_public_history_cancel
          text: "不"
          on_click:
            then:
              - lvgl.widget.hide: msgbox_clear_public_history
        - id: btn_clear_public_history_ok
          text: "好"
          on_click:
            then:
              - script.execute: chat_public_clear_local
              - lvgl.widget.hide: msgbox_clear_public_history
    - id: msgbox_clear_private_history
      close_button: false
      title: 清空私聊记录
      text_font: chinese_font14
      body:
        text: "确定清空本地私聊聊天记录吗？"
        text_font: chinese_font14
      buttons:
        - id: btn_clear_private_history_cancel
          text: "不"
          on_click:
            then:
              - lvgl.widget.hide: msgbox_clear_private_history
        - id: btn_clear_private_history_ok
          text: "好"
          on_click:
            then:
              - script.execute: chat_private_clear_local
              - lvgl.widget.hide: msgbox_clear_private_history

  pages:
    - id: !extend page_main
      scrollable: false
      widgets:
        - tileview:
            id: !extend tileview_main
            tiles:
              - id: !extend tile_appcenter
                widgets:
                  - image:
                      src: message_icon
                      id: img_message_app
                      width: 96
                      height: 96
                      x: -96
                      y: 45
                      align: CENTER
                      on_click:
                        then:
                          - if:
                              condition:
                                lambda: 'return !id(app_edit_mode);'
                              then:
                                - lvgl.page.show:
                                    id: page_message
                                    animation: FADE_IN
                                    time: 200ms
                  - obj:
                      id: message_unread_messages_amount_indicator
                      width: 14
                      height: 14
                      x: -60
                      y: 12
                      border_width: 0
                      align: CENTER
                      scrollbar_mode: "OFF"
                      hidden: true
                      bg_color: 0xFF0000   # #ff0000
                      opa: 100%

    - id: page_message
      skip: true
      scrollable: false
      on_load:
        - script.execute:
            id: statusbar_enter
            title: "消息"
            back: false
            action: 2
        - lambda: id(unread_messages_amount_private) = 0;
        - lambda: id(unread_messages_amount_private_favorite) = 0;
        - lambda: id(unread_messages_amount_public) = 0;
        - lambda: lv_obj_add_flag(id(message_unread_messages_amount_indicator), LV_OBJ_FLAG_HIDDEN);
        - lambda: |
            bool chat_open = !lv_obj_has_flag(id(obj_message_private_container), LV_OBJ_FLAG_HIDDEN);
            if (chat_open) {
              id(statusbar_enter)->execute(id(current_contact_uid), true, 0);
            }
        - lambda: |
            std::string active_contact = id(current_contact_uid);
            bool chat_open = !lv_obj_has_flag(id(obj_message_private_container), LV_OBJ_FLAG_HIDDEN);
            bool is_active_contact = chat_open && !active_contact.empty();
            if(is_active_contact) id(contacts_clear_unread)->execute(active_contact);
        - script.execute:
            id: close_notification
            notification_message: "消息"
        - script.execute:
            id: close_notification
            notification_message: "条新消息"
        - script.execute:
            id: close_notification
            notification_message: "条私聊消息"
        - script.execute:
            id: close_notification
            notification_message: "条私聊消息（特别关心）"
        - script.execute: message_init_chat_scroll_loaders
        - script.execute: message_resume_visible_content
        - script.execute: message_init_unread_dots
        - script.execute: message_update_unread_indicators
      on_unload:
        - script.execute: message_refresh_alert_indicator
        # - script.execute: chat_public_load
        # - script.execute: contacts_close_chat
      widgets:
        - tabview:
            id: tabview_message
            anim_duration: 0.5s
            x: 0
            y: 22
            width: 320
            height: 218
            tab_style:
              bg_color: 0xffffff
              border_width: 0
              pad_all: 0
              items:
                bg_opa: TRANSP
                text_color: 0x8a9099
                text_font: chinese_font14
                checked:
                  text_color: 0x1f95f6
            content_style:
              bg_color: 0xf2f3f5
              pad_all: 0
            on_value:
              then:
                - script.execute: keyboard_message_hide
                - lambda: |
                    lv_keyboard_reset_ime(keyboard_message_input->obj);
                    uint16_t tab_act = lv_tabview_get_tab_act(tabview_message);
                    if (tab_act == 0) {
                      id(statusbar_enter)->execute(std::string("消息"), false, 2);
                    } else if (tab_act == 1) {
                      id(statusbar_enter)->execute(std::string("广场"), false, 0);
                    } else {
                      id(statusbar_enter)->execute(std::string("消息"), false, 0);
                    }
                    lv_obj_t *tab_btns = lv_tabview_get_tab_btns(tabview_message);
                    if (tab_btns != nullptr) {
                      lv_coord_t tab_w = lv_obj_get_width(tab_btns) / 3;
                      lv_obj_align(id(obj_message_tab_indicator), LV_ALIGN_TOP_LEFT,
                                   tab_w * tab_act + tab_w / 2 - 16, 30);
                    }
                    if (tab_act == 1) {
                      id(unread_messages_public_badge) = 0;
                      id(chat_public_load)->execute();
                    } else if (tab_act == 0) {
                      id(contacts_refresh_list)->execute();
                    }
                    id(message_update_unread_indicators)->execute();
            size: 15%
            tabs:
              - name: 联系人
                scrollable: false
                scroll_dir: "VER"
                pad_all: 0
                widgets:
                  - list:
                      id: list_message_contacts
                      align: TOP_MID
                      y: 0
                      width: 320
                      height: 185
                      scroll_dir: "VER"
              - name: 广场
                scrollable: false
                scroll_dir: "VER"
                pad_all: 0
                widgets:
                  - list:
                      id: list_message_public
                      align: TOP_MID
                      y: 0
                      width: 320
                      height: 145
                      pad_all: 0
                      scroll_dir: "VER"
                      items:
                  - obj:
                      id: obj_message_public_input_bg
                      align: BOTTOM_MID
                      y: 0
                      width: 320
                      height: 40
                      bg_color: 0xffffff
                      bg_opa: COVER
                      border_width: 1
                      border_side: TOP
                      border_color: 0xe7e9ec
                      radius: 0
                      pad_all: 0
                      scrollable: false
                  - textarea:
                      id: textarea_message_public_input
                      align: BOTTOM_LEFT
                      x: 8
                      y: -5
                      width: 304
                      height: 30
                      bg_color: 0xf5f6f8
                      border_width: 1
                      border_color: 0xe3e7ec
                      radius: 15
                      pad_all: 0
                      pad_left: 12
                      pad_right: 12
                      pad_top: 5
                      text_font: chinese_font14
                      text_color: 0x1f1f1f
                      placeholder_text: "发送消息…"
                      on_long_press:
                        then:
                          - lambda: |
                              lv_obj_set_size(id(textarea_message_public_input), 304, 100);
                              lv_textarea_set_placeholder_text(textarea_message_public_input, "收起键盘退出全屏输入");
                          - script.execute: keyboard_message_show
                          - lambda: |
                              auto kb = id(keyboard_message_input)->obj;
                              auto ta = id(textarea_message_public_input);
                              lv_keyboard_reset_ime(kb);
                              lv_keyboard_set_textarea(kb, ta);
                      on_click:
                        then:
                          - script.execute: keyboard_message_show
                          - lambda: |
                              auto kb = id(keyboard_message_input)->obj;
                              auto ta = id(textarea_message_public_input);
                              lv_keyboard_reset_ime(kb);
                              lv_keyboard_set_textarea(kb, ta);
