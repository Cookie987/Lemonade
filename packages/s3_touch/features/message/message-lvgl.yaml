                            - lvgl.widget.hide: obj_message_action_overlay

        - obj:
            id: obj_message_candidate_list
            scrollable: true
            scroll_dir: HOR
            x: 0
            y: 60
            align: TOP_MID
            width: 320
            height: 30
            border_width: 0
            pad_all: 0
        - keyboard:
            x: 0
            y: -2
            width: 320
            height: 100
            hidden: true
            align: BOTTOM_MID
            id: keyboard_message_input
            on_cancel:
              then:
                - script.execute: keyboard_message_hide
            on_ready:
              then:
                - script.execute: keyboard_message_hide
                - script.execute: send_message

script:
  - id: keyboard_message_show
    then:
      - lambda: |
          if (id(keyboard_showing)) return;
          lv_obj_move_foreground(id(obj_message_candidate_list));
          auto kb = id(keyboard_message_input)->obj;
          auto pub_input = id(textarea_message_public_input);
          auto pub_list = id(list_message_public);
          auto pub_bg = id(obj_message_public_input_bg);
          auto fri_input = id(textarea_message_friend_input);
          auto fri_list = id(list_message_friend);
          auto fri_bg = id(obj_message_friend_input_bg);

          // 1. 预处理：强制清理这些对象上所有正在运行的动画，确保状态可控
          lv_anim_del(kb, nullptr);
          lv_anim_del(pub_input, nullptr);
          lv_anim_del(pub_list, nullptr);
          lv_anim_del(fri_input, nullptr);
          lv_anim_del(fri_list, nullptr);

          // 2. 确保对象可见
          lv_obj_clear_flag(kb, LV_OBJ_FLAG_HIDDEN);
          // ensure keyboard is above overlays
          lv_obj_move_foreground(kb);

          lv_anim_t a;
          lv_anim_init(&a);
          lv_anim_set_time(&a, 300);
          lv_anim_set_path_cb(&a, lv_anim_path_ease_out);

          // --- 键盘：强制从当前位置滑动到确定的 -2 ---
          lv_anim_set_var(&a, kb);
          lv_anim_set_values(&a, lv_obj_get_y(kb), -2);
          lv_anim_set_exec_cb(&a, (lv_anim_exec_xcb_t)lv_obj_set_y);
          lv_anim_start(&a);

          // 直接调整消息列表和输入框，避免布局动画把滚动位置冲回顶部
          lv_obj_set_y(pub_input, -105);
          lv_obj_set_height(pub_list, 50);
          lv_obj_add_flag(pub_bg, LV_OBJ_FLAG_HIDDEN);
          lv_obj_set_y(fri_input, -105);
          lv_obj_set_height(fri_list, 83);
          lv_obj_add_flag(fri_bg, LV_OBJ_FLAG_HIDDEN);
          lv_obj_update_layout(pub_list);
          lv_obj_update_layout(fri_list);
          id(keyboard_showing) = true;

  - id: keyboard_message_hide
    then:
      - lambda: |
          if (!id(keyboard_showing)) return;
          auto kb = id(keyboard_message_input)->obj;
          auto pub_input = id(textarea_message_public_input);
          auto pub_list = id(list_message_public);
          auto pub_bg = id(obj_message_public_input_bg);
          auto fri_input = id(textarea_message_friend_input);
          auto fri_list = id(list_message_friend);
          auto fri_bg = id(obj_message_friend_input_bg);
          auto contact_input = id(textarea_contact_add_input);

          // 1. 立即停止所有动画，回归静止状态
          lv_anim_del(kb, nullptr);
          lv_anim_del(pub_input, nullptr);
          lv_anim_del(pub_list, nullptr);
          lv_anim_del(fri_input, nullptr);
          lv_anim_del(fri_list, nullptr);

          // 2. 【核心改动】键盘依然保持滑出动画，因为它在 Page 层级，不受 Tab 切换影响
          lv_anim_t a;
          lv_anim_init(&a);
          lv_anim_set_time(&a, 300);
          lv_anim_set_path_cb(&a, lv_anim_path_ease_in);
          lv_anim_set_var(&a, kb);
          lv_anim_set_values(&a, lv_obj_get_y(kb), 100); // 滑向隐藏位
          lv_anim_set_exec_cb(&a, (lv_anim_exec_xcb_t)lv_obj_set_y);
          lv_anim_set_ready_cb(&a, [](lv_anim_t * anim) {
              lv_obj_add_flag((lv_obj_t *)anim->var, LV_OBJ_FLAG_HIDDEN);
          });
          lv_anim_start(&a);

          // 3. 【回归原始】输入框和列表直接设置位置，不走动画
          // 这部分代码完全照搬你以前“没问题”的版本
          lv_obj_set_y(pub_input, -5);
          lv_obj_set_size(pub_input, 304, 30);
          lv_obj_set_height(pub_list, 145);
          lv_obj_clear_flag(pub_bg, LV_OBJ_FLAG_HIDDEN);

          lv_obj_set_y(fri_input, -5);
          lv_obj_set_size(fri_input, 304, 30);
          lv_obj_set_height(fri_list, 178);
          lv_obj_clear_flag(fri_bg, LV_OBJ_FLAG_HIDDEN);

          // 4. 重置其他属性
          lv_keyboard_reset_ime(kb);
          lv_keyboard_set_textarea(kb, nullptr);
          lv_textarea_set_placeholder_text(pub_input, "发送消息…");
          lv_textarea_set_placeholder_text(fri_input, "发送消息…");
          lv_obj_clear_state(pub_input, LV_STATE_FOCUSED);
          lv_obj_clear_state(fri_input, LV_STATE_FOCUSED);
          lv_obj_clear_state(contact_input, LV_STATE_FOCUSED);
          id(keyboard_showing) = false;
