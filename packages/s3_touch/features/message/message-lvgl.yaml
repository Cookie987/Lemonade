lvgl:
  pages:
    - id: !extend page_main
      scrollable: false
      widgets:
        - tileview:
            id: !extend tileview_main
            tiles:
              - id: !extend tile_appcenter
                widgets:
                  - image:
                      src: message_icon
                      id: img_message_app
                      width: 96
                      height: 96
                      x: -96
                      y: 45
                      align: CENTER
                      on_click:
                        then:
                          - lvgl.page.show:
                              id: page_message
                              animation: FADE_IN
                              time: 200ms
    - id: page_message
      on_load:
        - lvgl.label.update:
            id: lbl_topbar_title
            text: "消息"
      widgets:
        - tabview:
            id: tabview_message
            anim_time: 0.5s
            x: 0
            y: 18
            width: 320
            height: 222
            on_value:
              then:
                - script.execute: keyboard_message_hide
            size: 15%
            tabs:
              - name: 聊天设置
                widgets:
                  - label:
                      id: lbl_message_friend_id_prompt
                      x: -80
                      y: 5
                      align: TOP_MID
                      text: "私聊UID："
                  - container:
                      id: container_message_friend_input
                      x: 40
                      y: -5
                      width: 160
                      height: 50
                      align: TOP_MID
                      widgets:
                        - button:
                            id: btn_message_friend_increase
                            align: RIGHT_MID
                            width: 40
                            height: 40
                            widgets:
                              - label:
                                  align: CENTER
                                  text: "+"
                            on_click:
                              then:
                                - lvgl.spinbox.increment: spinbox_message_friend_number
                        - button:
                            id: btn_message_friend_decrease
                            align: LEFT_MID
                            width: 40
                            height: 40
                            widgets:
                              - label:
                                  align: CENTER
                                  text: "-"
                            on_click:
                              then:
                                - lvgl.spinbox.decrement: spinbox_message_friend_number
                        - spinbox:
                            id: spinbox_message_friend_number
                            x: 0
                            y: 0
                            align: CENTER
                            width: 60
                            height: 40
                            digits: 4
                            range_from: 100
                            range_to: 9999
                            value: 100
                            decimal_places: 0
              - name: 私聊
                scrollable: false
                widgets:
                  - list:
                      id: list_message_friend
                      align: TOP_MID
                      y: -15
                      width: 320
                      height: 155
                      items:
                        # 按钮类型项目
                        - text: "系统消息"
                          list_text: {}
                        - text: "[系统] 暂不支持聊天记录保存！" 
                          list_button: {}
                  - textarea:
                      id: textarea_message_friend_input
                      x: 0
                      y: 15
                      align: BOTTOM_MID
                      width: 320
                      height: 40
                      placeholder_text: "输入消息..."
                      on_click:
                        then:
                          - script.execute: keyboard_message_show
                          - lvgl.keyboard.update:
                              id: keyboard_message_input
                              textarea: textarea_message_friend_input
              - name: 公聊
                scrollable: false
                widgets:
                  - list:
                      id: list_message_public
                      align: TOP_MID
                      y: -15
                      width: 320
                      height: 155
                      items:
                        # 按钮类型项目
                        - text: "系统消息"
                          list_text: {}
                        - text: "[系统] 暂不支持聊天记录保存！" 
                          list_button: {}
                  - textarea:
                      id: textarea_message_public_input
                      x: 0
                      y: 15
                      align: BOTTOM_MID
                      width: 320
                      height: 40
                      placeholder_text: "输入消息..."
                      on_click:
                        then:
                          - script.execute: keyboard_message_show
                          - lvgl.keyboard.update:
                              id: keyboard_message_input
                              textarea: textarea_message_public_input
        - keyboard:
            x: 0
            y: -2
            width: 320
            height: 100
            hidden: true
            align: BOTTOM_MID
            id: keyboard_message_input
            on_cancel:
              then:
                - script.execute: keyboard_message_hide
            on_ready:
              then:
                - script.execute: keyboard_message_hide
                - script.execute: send_message
script:
  - id: keyboard_message_show
    then:
      - lvgl.widget.show: keyboard_message_input
      - lambda: |-
          lv_obj_set_y(id(textarea_message_public_input), -80);
          lv_obj_set_height(id(list_message_public), 60);
          lv_obj_set_y(id(textarea_message_friend_input), -80);
          lv_obj_set_height(id(list_message_friend), 60);

  - id: keyboard_message_hide
    then:
      - lvgl.widget.hide: keyboard_message_input
      - lambda: |-
          lv_obj_set_y(id(textarea_message_public_input), 15);
          lv_obj_set_height(id(list_message_public), 155);
          lv_obj_set_y(id(textarea_message_friend_input), 15);
          lv_obj_set_height(id(list_message_friend), 155);