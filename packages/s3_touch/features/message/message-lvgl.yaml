lvgl:
  pages:
    - id: !extend page_main
      scrollable: false
      widgets:
        - tileview:
            id: !extend tileview_main
            tiles:
              - id: !extend tile_appcenter
                widgets:
                  - image:
                      src: message_icon
                      id: img_message_app
                      width: 96
                      height: 96
                      x: -96
                      y: 45
                      align: CENTER
                      on_click:
                        then:
                          - lambda: id(unread_messages_amount_private) = 0;
                          - lambda: id(unread_messages_amount_public) = 0;
                          - lambda: lv_obj_add_flag(id(message_unread_messages_amount_indicator), LV_OBJ_FLAG_HIDDEN);
                          - script.execute:
                              id: close_notification
                              notification_message: "消息"
                          - lvgl.page.show:
                              id: page_message
                              animation: FADE_IN
                              time: 200ms
                  - obj:
                      id: message_unread_messages_amount_indicator
                      width: 14
                      height: 14
                      x: -60
                      y: 12
                      border_width: 0
                      align: CENTER
                      scrollbar_mode: "OFF"
                      hidden: true
                      bg_color: 0xFF0000 #ff0000
                      opa: 100%
    - id: page_message
      on_load:
        - lvgl.label.update:
            id: lbl_topbar_title
            text: "消息"
        - script.execute:
            id: close_notification
            notification_message: "条新消息"
      widgets:
        - tabview:
            id: tabview_message
            anim_time: 0.5s
            x: 0
            y: 18
            width: 320
            height: 222
            on_value:
              then:
                - script.execute: keyboard_message_hide
            size: 15%
            tabs:
              - name: 聊天设置
                widgets:
                  - label:
                      id: lbl_message_username_id_prompt
                      x: -80
                      y: 5
                      align: TOP_MID
                      text: "私聊用户名："
                  - textarea:
                      id: textarea_message_username_input
                      x: 0
                      y: -25
                      align: CENTER
                      width: 200
                      height: 40
                      placeholder_text: "输入私聊的用户名"
                      on_click:
                        then:
                          - script.execute: keyboard_message_show
                          - lvgl.keyboard.update:
                              id: keyboard_message_input
                              textarea: textarea_message_username_input
              - name: 私聊
                scrollable: false
                widgets:
                  - list:
                      id: list_message_friend
                      align: TOP_MID
                      y: -15
                      width: 320
                      height: 155
                      items:
                        # 按钮类型项目
                        - text: "系统消息"
                          list_text: {}
                        - text: "[系统] 聊天记录将保存至云端。" 
                          list_button: {}
                  - textarea:
                      id: textarea_message_friend_input
                      x: 0
                      y: 15
                      align: BOTTOM_MID
                      width: 320
                      height: 40
                      placeholder_text: "单击输入消息，长按进入全屏输入"
                      on_long_press:
                        then:
                          - lambda: |-
                              lv_obj_set_size(id(textarea_message_friend_input), 320, 95);
                              lv_textarea_set_placeholder_text(textarea_message_friend_input, "收起键盘退出全屏输入");
                          - script.execute: keyboard_message_show
                          - lvgl.keyboard.update:
                              id: keyboard_message_input
                              textarea: textarea_message_friend_input
                      on_short_click:
                        then:
                          - script.execute: keyboard_message_show
                          - lvgl.keyboard.update:
                              id: keyboard_message_input
                              textarea: textarea_message_friend_input
              - name: 公聊
                scrollable: false
                widgets:
                  - list:
                      id: list_message_public
                      align: TOP_MID
                      y: -15
                      width: 320
                      height: 155
                      items:
                        # 按钮类型项目
                        - text: "系统消息"
                          list_text: {}
                        - text: "[系统] 聊天记录将保存至云端。" 
                          list_button: {}
                  - textarea:
                      id: textarea_message_public_input
                      x: 0
                      y: 15
                      align: BOTTOM_MID
                      width: 320
                      height: 40
                      placeholder_text: "单击输入消息，长按进入全屏输入"
                      on_long_press:
                        then:
                          - lambda: |-
                              lv_obj_set_size(id(textarea_message_public_input), 320, 95);
                              lv_textarea_set_placeholder_text(textarea_message_public_input, "收起键盘退出全屏输入");
                          - script.execute: keyboard_message_show
                          - lvgl.keyboard.update:
                              id: keyboard_message_input
                              textarea: textarea_message_public_input
                      on_short_click:
                        then:
                          - script.execute: keyboard_message_show
                          - lvgl.keyboard.update:
                              id: keyboard_message_input
                              textarea: textarea_message_public_input
        - keyboard:
            x: 0
            y: -2
            width: 320
            height: 100
            hidden: true
            align: BOTTOM_MID
            id: keyboard_message_input
            on_cancel:
              then:
                - script.execute: keyboard_message_hide
            on_ready:
              then:
                - script.execute: keyboard_message_hide
                - script.execute: send_message
script:
  - id: keyboard_message_show
    then:
      - lvgl.widget.show: keyboard_message_input
      - lambda: |-
          lv_obj_set_y(id(textarea_message_public_input), -80);
          lv_obj_set_height(id(list_message_public), 60);
          lv_obj_set_y(id(textarea_message_friend_input), -80);
          lv_obj_set_height(id(list_message_friend), 60);

  - id: keyboard_message_hide
    then:
      - lvgl.widget.hide: keyboard_message_input
      - lambda: |-
          lv_obj_align(id(textarea_message_public_input), LV_ALIGN_BOTTOM_MID, 0, 15);
          lv_obj_set_size(id(textarea_message_public_input), 320, 40);
          lv_obj_align(id(textarea_message_friend_input), LV_ALIGN_BOTTOM_MID, 0, 15);
          lv_obj_set_size(id(textarea_message_friend_input), 320, 40);
          lv_textarea_set_placeholder_text(textarea_message_public_input, "单击输入消息，长按进入全屏输入");
          lv_textarea_set_placeholder_text(textarea_message_friend_input, "单击输入消息，长按进入全屏输入");
          //
          lv_obj_set_y(id(textarea_message_public_input), 15);
          lv_obj_set_height(id(list_message_public), 155);
          lv_obj_set_y(id(textarea_message_friend_input), 15);
          lv_obj_set_height(id(list_message_friend), 155);