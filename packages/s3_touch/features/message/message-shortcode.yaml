# 定义常用的中文短语，进行关键词替换
# 比如 马上来、没问题、稍等
mapping:
  - id: message_shortcode
    from: string
    to: string
    entries:
      "/hd/": "好的"
      "/h/": "好"
      "/bq/": "抱歉"
      "/mwt/": "没问题"
      "/dd/": "等等"
      "/msl/": "马上来"
      "/zzh/": "郑志浩"
      "/wsy/": "王舒羽"
      "/dnr/": "Dinner"
      "/tbc/": "Trubiacy_"
      "/wyq/": "魏宇淇"
      "/987/": "Cookie_987"
      "/los/": "Lemonade OS"
      "/lua/": "LuatOS_NG"
      "/zxr/": "张歆然"
      "/s/": "是"
      "/f/": "否"
      "/y/": "有"
      "/w/": "无"
      "/my/": "没有"
      "/1/": "True"
      "/0/": "False"
      "/sha/": "啥"
      "/sb/": "傻逼"
      "/sme/": "什么"
      "/smi/": "神秘"
      "/sr/": "神人"
      "/xzrx/": "仙之人兮列如麻"
      "/nt/": "逆天"
      "/nb/": "难绷"
