packages:
  - !include message-lvgl.yaml
  - !include message-resource.yaml
  - !include message-mqtt_handler.yaml

esphome:
  on_boot:
    - priority: 250
      then:
        - script.execute: chat_storage_init
        - script.execute: contacts_init_file
        - script.execute: contacts_refresh_list
        - script.execute: chat_public_load
    - priority: 100
      then:
        - script.execute: message_public_listen
        - script.execute: message_mqtt_handler

globals:
  - id: unread_messages_amount_private
    type: uint8_t
    restore_value: no
    initial_value: '0'
  - id: unread_messages_amount_public
    type: uint8_t
    restore_value: no
    initial_value: '0'
  - id: current_contact_uid
    type: std::string
    restore_value: no
    initial_value: '""'
  - id: pending_delete_contact
    type: std::string
    restore_value: no
    initial_value: '""'
  - id: keyboard_showing
    type: bool
    restore_value: no
    initial_value: 'false'

script:
  - id: contacts_init_file
    then:
      - lambda: |
          struct stat st;
          if (stat("/data/contacts.json", &st) == 0) {
            ESP_LOGI("Chat", "/data/contacts.json exists");
            return;
          }
          std::ofstream file("/data/contacts.json", std::ios::trunc);
          file << "{\"contacts\":{}}";
          file.close();
          ESP_LOGI("Chat", "Created /data/contacts.json");

  - id: contacts_refresh_list
    mode: queued
    then:
      - lambda: |
          lv_obj_t * list = id(list_message_contacts);
          if (list == nullptr) return;

          // Clear and rebuild list
          lv_obj_clean(list);

          static lv_obj_t * float_btn = nullptr;
          float_btn = nullptr;

          // Load contacts JSON
          std::ifstream file("/data/contacts.json");
          std::string config_json;
          if (file.is_open()) {
            std::string line;
            while (std::getline(file, line)) {
              config_json += line + "";
            }
            file.close();
          }
          else {
            ESP_LOGW("Chat", "contacts.json not found");
          }
          ESP_LOGD("Chat", "contacts.json: %s", config_json.c_str());
          JsonDocument doc;
          bool parsed_ok = true;
          if (!config_json.empty()) {
            DeserializationError error = deserializeJson(doc, config_json);
            if (error) {
              ESP_LOGW("Chat", "Failed to parse contacts.json: %s", error.c_str());
              parsed_ok = false;
            }
          }
          else {
            parsed_ok = false;
          }

          if (!parsed_ok) {
            // recover with empty object
            doc.clear();
            doc["contacts"].to<JsonObject>();
            std::ofstream file_fix("/data/contacts.json", std::ios::trunc);
            serializeJson(doc, file_fix);
            file_fix.close();
          }

          JsonObject contacts = doc["contacts"].as<JsonObject>();
          if (contacts.isNull()) {
            contacts = doc["contacts"].to<JsonObject>();
          }

          ESP_LOGD("Chat", "contacts.size(): %u", (unsigned)contacts.size());
          if (contacts.size() == 0) {
            lv_list_add_btn(list, NULL, "暂无联系人");
          }
          else {
            for (JsonPair kv : contacts) {
              std::string contact = kv.key().c_str();
              if (contact.empty()) continue;
              bool favorite = kv.value()["favorite"] | false;
              std::string label = contact;
              if (favorite) {
                label = std::string("* ") + contact;
              }
              lv_obj_t * btn = lv_list_add_btn(list, NULL, label.c_str());

              // Click to open chat
              lv_obj_add_event_cb(btn, [](lv_event_t * e) {
                lv_obj_t * target_btn = lv_event_get_target(e);
                lv_obj_t * list_obj = (lv_obj_t *) lv_event_get_user_data(e);
                if (list_obj == nullptr) return;
                const char * txt = lv_list_get_btn_text(list_obj, target_btn);
                if (!txt) return;
                // remove favorite prefix if present
                std::string name = txt;
                if (name.rfind("* ", 0) == 0) name = name.substr(2);
                id(contacts_open_chat)->execute(name);
              }, LV_EVENT_SHORT_CLICKED, list);

              // Long press to delete
              lv_obj_add_event_cb(btn, [](lv_event_t * e) {
                lv_obj_t * target_btn = lv_event_get_target(e);
                lv_obj_t * list_obj = (lv_obj_t *) lv_event_get_user_data(e);
                if (list_obj == nullptr) return;
                const char * txt = lv_list_get_btn_text(list_obj, target_btn);
                if (!txt) return;
                std::string name = txt;
                if (name.rfind("* ", 0) == 0) name = name.substr(2);
                id(pending_delete_contact) = name;
                lv_obj_t * msgbox_text = lv_msgbox_get_text(msgbox_delete_contact);
                lv_label_set_text(msgbox_text, (std::string("确定删除 ") + name + " 吗？").c_str());
                lv_obj_clear_flag(msgbox_delete_contact_outer, LV_OBJ_FLAG_HIDDEN);
                lv_obj_move_foreground(msgbox_delete_contact_outer);
              }, LV_EVENT_LONG_PRESSED, list);
            }
          }

          // Floating add button
          if (float_btn == nullptr) {
            float_btn = lv_btn_create(list);
            lv_obj_set_size(float_btn, 46, 46);
            lv_obj_add_flag(float_btn, LV_OBJ_FLAG_FLOATING);
            lv_obj_align(float_btn, LV_ALIGN_BOTTOM_RIGHT, 0, -lv_obj_get_style_pad_right(list, LV_PART_MAIN));
            lv_obj_set_style_radius(float_btn, LV_RADIUS_CIRCLE, 0);
            lv_obj_set_style_bg_color(float_btn, lv_color_hex(0x1f95f6), 0);
            lv_obj_t * label = lv_label_create(float_btn);
            lv_label_set_text(label, "+");
            lv_obj_set_style_text_font(label, chinese_font18, LV_PART_MAIN);
            lv_obj_align(label, LV_ALIGN_CENTER, 0, 2);
            lv_obj_add_event_cb(float_btn, [](lv_event_t * e) {
              lv_obj_clear_flag(id(obj_contact_add_overlay), LV_OBJ_FLAG_HIDDEN);
              lv_obj_move_foreground(id(obj_contact_add_overlay));
              lv_textarea_set_text(id(textarea_contact_add_input), "");
            }, LV_EVENT_CLICKED, NULL);
          }
          lv_obj_move_foreground(float_btn);
          lv_obj_update_layout(list);
          ESP_LOGD("Chat", "contacts list children: %u", (unsigned)lv_obj_get_child_cnt(list));

  - id: contacts_add
    mode: queued
    parameters:
      contact: string
    then:
      - lambda: |
          std::string name = contact;
          auto is_space = [](char c) {
            return c == ' ' || c == '\t' || c == '\n' || c == '\r';
          };
          while (!name.empty() && is_space(name.front())) name.erase(name.begin());
          while (!name.empty() && is_space(name.back())) name.pop_back();

          if (name.empty()) {
            id(show_notification)->execute("联系人不能为空", "", 2000);
            return;
          }

          std::ifstream file("/data/contacts.json");
          std::string config_json;
          if (file.is_open()) {
            std::string line;
            while (std::getline(file, line)) {
              config_json += line + "";
            }
            file.close();
          }

          JsonDocument doc;
          if (!config_json.empty()) {
            DeserializationError error = deserializeJson(doc, config_json);
            if (error) {
              ESP_LOGW("Chat", "Failed to parse contacts.json: %s", error.c_str());
              doc.clear();
            }
          }

          // Migrate old array format to object format
          if (doc["contacts"].is<JsonArray>()) {
            std::vector<std::string> names;
            for (JsonVariant item : doc["contacts"].as<JsonArray>()) {
              std::string n = item.as<std::string>();
              if (!n.empty()) names.push_back(n);
            }
            doc.clear();
            JsonObject contacts_obj = doc["contacts"].to<JsonObject>();
            for (auto &n : names) {
              contacts_obj[n.c_str()]["favorite"] = false;
            }
          }

          JsonObject contacts = doc["contacts"].as<JsonObject>();
          if (contacts.isNull()) {
            contacts = doc["contacts"].to<JsonObject>();
          }
          if (!contacts[name.c_str()].isNull()) {
            id(show_notification)->execute("联系人已存在", "", 2000);
            return;
          }
          contacts[name.c_str()]["favorite"] = false;

          std::ofstream file1("/data/contacts.json", std::ios::trunc);
          serializeJson(doc, file1);
          file1.close();

          id(contacts_refresh_list)->execute();

  - id: contacts_delete
    mode: queued
    parameters:
      contact: string
    then:
      - lambda: |
          std::string target = contact;
          if (target.empty()) return;

          std::ifstream file("/data/contacts.json");
          std::string config_json;
          if (file.is_open()) {
            std::string line;
            while (std::getline(file, line)) {
              config_json += line + "";
            }
            file.close();
          }

          JsonDocument doc;
          if (!config_json.empty()) {
            DeserializationError error = deserializeJson(doc, config_json);
            if (error) {
              ESP_LOGW("Chat", "Failed to parse contacts.json: %s", error.c_str());
              return;
            }
          }

          bool removed = false;
          if (doc["contacts"].is<JsonObject>()) {
            JsonObject contacts = doc["contacts"].as<JsonObject>();
            if (!contacts[target.c_str()].isNull()) {
              contacts.remove(target.c_str());
              removed = true;
            }
          }
          else if (doc["contacts"].is<JsonArray>()) {
            JsonArray contacts = doc["contacts"].as<JsonArray>();
            for (JsonArray::iterator it = contacts.begin(); it != contacts.end(); ++it) {
              if ((*it).as<std::string>() == target) {
                contacts.remove(it);
                removed = true;
                break;
              }
            }
          }

          if (!removed) return;

          std::ofstream file1("/data/contacts.json", std::ios::trunc);
          serializeJson(doc, file1);
          file1.close();

          if (id(current_contact_uid) == target) {
            id(contacts_close_chat)->execute();
          }
          id(contacts_refresh_list)->execute();

  - id: contacts_open_chat
    mode: queued
    parameters:
      contact: string
    then:
      - lambda: |
          std::string name = contact;
          if (name.empty()) return;
          id(current_contact_uid) = name;
          lv_label_set_text(lbl_topbar_title, name.c_str());

          lv_obj_add_flag(id(tabview_message), LV_OBJ_FLAG_HIDDEN);
          lv_obj_clear_flag(id(obj_message_private_container), LV_OBJ_FLAG_HIDDEN);
          lv_obj_move_foreground(id(obj_message_private_container));

          // Reset private chat list for the selected contact
          lv_obj_clean(id(list_message_friend));
          lv_list_add_text(id(list_message_friend), "系统消息");
          lv_list_add_btn(id(list_message_friend), NULL, "[系统] 聊天记录将保存至云端。");
          lv_textarea_set_text(id(textarea_message_friend_input), "");
          lv_textarea_set_placeholder_text(id(textarea_message_friend_input),
                              "单击输入消息，长按进入全屏输入");
          id(chat_private_load)->execute(name);

  - id: contacts_close_chat
    mode: queued
    then:
      - lambda: |
          lv_label_set_text(lbl_topbar_title, "消息");
          lv_obj_add_flag(id(obj_message_private_container), LV_OBJ_FLAG_HIDDEN);
          lv_obj_clear_flag(id(tabview_message), LV_OBJ_FLAG_HIDDEN);
          lv_obj_move_foreground(id(tabview_message));
          id(current_contact_uid).clear();
          id(keyboard_message_hide)->execute();

  - id: chat_storage_init
    then:
      - lambda: |
          struct stat st;
          if (stat("/data/chat_private.json", &st) != 0) {
            std::ofstream f1("/data/chat_private.json");
            f1 << "{\"contacts\":{}}";
            f1.close();
          }
          if (stat("/data/chat_public.json", &st) != 0) {
            std::ofstream f2("/data/chat_public.json");
            f2 << "{\"messages\":[]}";
            f2.close();
          }

  - id: chat_private_append
    mode: queued
    parameters:
      contact: string
      from: string
      content: string
      time: string
    then:
      - lambda: |
          std::string name = contact;
          if (name.empty()) return;

          std::ifstream file("/data/chat_private.json");
          std::string json_str;
          ESP_LOGD("Chat", "Loadaded chat_private.json: %s", json_str.c_str());
          if (file.is_open()) {
            std::string line;
            while (std::getline(file, line)) json_str += line + "";
            file.close();
          }

          JsonDocument doc;
          if (!json_str.empty()) {
            DeserializationError error = deserializeJson(doc, json_str);
            if (error) {
              ESP_LOGW("Chat", "Failed to parse chat_private.json: %s", error.c_str());
              doc.clear();
            }
          }

          JsonObject contacts = doc["contacts"].as<JsonObject>();
          if (contacts.isNull()) {
            contacts = doc["contacts"].to<JsonObject>();
          }

          JsonArray arr = contacts[name.c_str()].as<JsonArray>();
          if (arr.isNull()) {
            arr = contacts[name.c_str()].to<JsonArray>();
          }
          JsonObject item = arr.add<JsonObject>();
          item["time"] = time;
          item["from"] = from;
          item["content"] = content;

          // keep last 100
          while (arr.size() > 100) arr.remove(0);
          ESP_LOGD("Chat", "Array size: %u", (unsigned)arr.size());
          std::ofstream file1("/data/chat_private.json", std::ios::trunc);
          serializeJson(doc, file1);
          file1.close();

  - id: chat_public_append
    mode: queued
    parameters:
      from: string
      content: string
      time: string
    then:
      - lambda: |
          std::ifstream file("/data/chat_public.json");
          std::string json_str;
          if (file.is_open()) {
            std::string line;
            while (std::getline(file, line)) json_str += line + "";
            file.close();
          }

          JsonDocument doc;
          if (!json_str.empty()) {
            DeserializationError error = deserializeJson(doc, json_str);
            if (error) {
              ESP_LOGW("Chat", "Failed to parse chat_public.json: %s", error.c_str());
              doc.clear();
            }
          }

          JsonArray arr = doc["messages"].as<JsonArray>();
          if (arr.isNull()) {
            arr = doc["messages"].to<JsonArray>();
          }

          JsonObject item = arr.add<JsonObject>();
          item["time"] = time;
          item["from"] = from;
          item["content"] = content;

          while (arr.size() > 100) arr.remove(0);

          std::ofstream file1("/data/chat_public.json", std::ios::trunc);
          serializeJson(doc, file1);
          file1.close();

  - id: chat_private_load
    mode: queued
    parameters:
      contact: string
    then:
      - lambda: |
          std::string name = contact;
          if (name.empty()) return;
          lv_obj_t * list = id(list_message_friend);
          if (list == nullptr) return;

          std::ifstream file("/data/chat_private.json");
          std::string json_str;
          if (file.is_open()) {
            std::string line;
            while (std::getline(file, line)) json_str += line + "";
            file.close();
          }
          ESP_LOGD("Chat", "Loadaded chat_private.json: %s", json_str.c_str());

          if (json_str.empty()) return;
          JsonDocument doc;
          DeserializationError error = deserializeJson(doc, json_str);
          if (error) {
            ESP_LOGW("Chat", "Failed to parse chat_private.json: %s", error.c_str());
            return;
          }

          JsonObject contacts = doc["contacts"].as<JsonObject>();
          if (contacts.isNull()) return;
          JsonArray arr = contacts[name.c_str()].as<JsonArray>();
          if (arr.isNull()) return;

          bool modified = false;
          while (arr.size() > 100) {
            arr.remove(0);
            modified = true;
          }
          if (modified) {
            ESP_LOGD("Chat", "Array size: %u", (unsigned)arr.size());
            std::ofstream file1("/data/chat_private.json", std::ios::trunc);
            serializeJson(doc, file1);
            file1.close();
          }

          lv_obj_t * last_btn = nullptr;
          for (JsonVariant item : arr) {
            std::string time_s = item["time"] | "";
            std::string from_s = item["from"] | "";
            std::string content_s = item["content"] | "";
            if (time_s.empty() && from_s.empty() && content_s.empty()) continue;
            lv_list_add_text(list, (time_s + " - " + from_s).c_str());
            last_btn = lv_list_add_btn(list, NULL, content_s.c_str());
          }
          if (last_btn) lv_obj_scroll_to_view(last_btn, LV_ANIM_ON);

  - id: chat_public_load
    mode: queued
    then:
      - lambda: |
          lv_obj_t * list = id(list_message_public);
          if (list == nullptr) return;
          lv_obj_clean(list);

          std::ifstream file("/data/chat_public.json");
          std::string json_str;
          if (file.is_open()) {
            std::string line;
            while (std::getline(file, line)) json_str += line + "";
            file.close();
          }

          if (json_str.empty()) return;
          JsonDocument doc;
          DeserializationError error = deserializeJson(doc, json_str);
          if (error) {
            ESP_LOGW("Chat", "Failed to parse chat_public.json: %s", error.c_str());
            return;
          }

          JsonArray arr = doc["messages"].as<JsonArray>();
          if (arr.isNull()) return;

          lv_obj_t * last_btn = nullptr;
          for (JsonVariant item : arr) {
            std::string time_s = item["time"] | "";
            std::string from_s = item["from"] | "";
            std::string content_s = item["content"] | "";
            if (time_s.empty() && from_s.empty() && content_s.empty()) continue;
            lv_list_add_text(list, (time_s + " - " + from_s).c_str());
            last_btn = lv_list_add_btn(list, NULL, content_s.c_str());
          }
          if (last_btn) lv_obj_scroll_to_view(last_btn, LV_ANIM_ON);

  - id: send_message
    then:
      - lambda: |
          bool private_chat_open = !lv_obj_has_flag(id(obj_message_private_container), LV_OBJ_FLAG_HIDDEN);
          std::string mac = id(text_sensor_mac_address).state;
          auto t = id(ntp_time).now();

          if (private_chat_open) {
            std::string targetuid = id(current_contact_uid);
            if (targetuid.empty()) {
              id(show_notification)->execute("请选择联系人", "", 2000);
              return;
            }
            std::string message_content = lv_textarea_get_text(textarea_message_friend_input);
            if (message_content.empty()) return;
            std::string time_str = t.strftime("%Y-%m-%d %H:%M:%S");
            ESP_LOGD("Chat", "Target UID: %s", targetuid.c_str());

            id(mqtt_client).publish_json((std::string("chat/") +
                                          mac +
                                          std::string("/up")).c_str(),
                                          [=](JsonObject root) {
              root["type"] = "p2p";
              root["to"] = targetuid;
              root["content"] = message_content;
              root["msg_id"] = esp_random();
            });

            // lv_list_add_text(id(list_message_friend), (time_str + " - 我").c_str());
            // lv_obj_t * list_btn = lv_list_add_btn(id(list_message_friend), NULL, message_content.c_str());
            uint32_t children_count = lv_obj_get_child_cnt(id(list_message_friend));
            if (children_count > 100) {
              for (uint32_t i = 0; i < children_count - 100; i++) {
                lv_obj_del(lv_obj_get_child(id(list_message_friend), 0));
              }
            }
            // lv_obj_scroll_to_view(list_btn, LV_ANIM_ON);

            id(chat_private_append)->execute(targetuid, id(uid), message_content, time_str);

            lv_textarea_set_text(textarea_message_friend_input, "");
            lv_textarea_set_placeholder_text(textarea_message_friend_input,
                            (time_str + std::string(" 发送中……")).c_str()
                          );
            ESP_LOGD("Chat", "Sent message to %s", targetuid.c_str());
            return;
          }

          uint16_t tab_act = lv_tabview_get_tab_act(tabview_message);
          if (tab_act != 1) return;

          std::string message_content = lv_textarea_get_text(textarea_message_public_input);
          if (message_content.empty()) return;
          id(mqtt_client).publish("smck/glousr",(
                                    id(uid) +
                                    std::string(":") +
                                    message_content
                                  ).c_str()
                    );
          std::string time_str = t.strftime("%Y-%m-%d %H:%M:%S");
          std::string sender = id(uid);
          // lv_list_add_text(id(list_message_public), (time_str + " - " + sender).c_str());
          // lv_obj_t * list_btn = lv_list_add_btn(id(list_message_public), NULL, message_content.c_str());
          uint32_t children_count = lv_obj_get_child_cnt(id(list_message_public));
          if (children_count > 100) {
            for (uint32_t i = 0; i < children_count - 100; i++) {
              lv_obj_del(lv_obj_get_child(id(list_message_public), 0));
            }
          }
          // lv_obj_scroll_to_view(list_btn, LV_ANIM_ON);
          id(chat_public_append)->execute(sender, message_content, time_str);
          lv_textarea_set_text(textarea_message_public_input, "");
          ESP_LOGD("Chat", "Sent message to the topic");

  - id: message_public_listen
    then:
      - lambda: |
          id(mqtt_client).subscribe("smck/glousr", [=](const std::string &topic, const std::string &payload) {
              ESP_LOGD("Chat", "Got raw public chat message.");
              // 获取发送者
              size_t pos = payload.find(':');
              std::string sender, content;
              if (pos != std::string::npos) {
                  sender  = payload.substr(0, pos);
                  content = payload.substr(pos + 1);
              } else {
                  sender  = payload;
                  content = "";
              }
              // 获取当前时间
              auto t = id(ntp_time).now();
              std::string time_str = t.strftime("%Y-%m-%d %H:%M:%S");
              lv_list_add_text(id(list_message_public),
                                (
                                  time_str +
                                  std::string(" - ") +
                                  sender
                                ).c_str()
                              );
              id(chat_public_append)->execute(sender, content, time_str);
              lv_obj_t * list_btn = lv_list_add_btn(list_message_public, NULL, content.c_str());
              if(!id(page_message).is_showing()) {
                lv_obj_clear_flag(id(message_unread_messages_amount_indicator), LV_OBJ_FLAG_HIDDEN);
                if (id(unread_messages_amount_public) < 255) {
                  id(unread_messages_amount_public)++;
                  id(show_notification)->execute(
                    std::string("收到 ") +
                    std::to_string(id(unread_messages_amount_public)) +
                    std::string(" 条频道消息"), std::string("条频道消息"), 0);
                }
                else{
                  id(show_notification)->execute(
                    std::string("收到 255+ 条频道消息"), std::string("条频道消息"), 0);
                }
              }
              // 只保留最近的100条
              uint32_t children_count = lv_obj_get_child_cnt(list_message_public);
              if (children_count > 100) {
                for (uint32_t i = 0; i < children_count - 100; i++) {
                  lv_obj_del(lv_obj_get_child(list_message_public, 0));
                }
              }
              lv_obj_scroll_to_view(list_btn, LV_ANIM_ON);
          });
