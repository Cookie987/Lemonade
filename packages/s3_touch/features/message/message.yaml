packages:
  - !include message-lvgl.yaml
  - !include message-resource.yaml
  - !include message-mqtt_handler.yaml

esphome:
  on_boot:
    - priority: 250
      then:
        - script.execute: chat_storage_init
        - script.execute: contacts_init_file
        - script.execute: contacts_refresh_list
        - script.execute: chat_public_load
    - priority: 100
      then:
        - script.execute: message_public_listen
        - script.execute: message_mqtt_handler

globals:
  - id: unread_messages_amount_private
    type: uint8_t
    restore_value: no
    initial_value: '0'
  - id: unread_messages_amount_private_favorite
    type: uint8_t
    restore_value: no
    initial_value: '0'
  - id: unread_messages_amount_public
    type: uint8_t
    restore_value: no
    initial_value: '0'
  - id: unread_messages_public_badge
    type: uint8_t
    restore_value: no
    initial_value: '0'
  - id: current_contact_uid
    type: std::string
    restore_value: no
    initial_value: '""'
  - id: pending_delete_contact
    type: std::string
    restore_value: no
    initial_value: '""'
  - id: pending_action_contact
    type: std::string
    restore_value: no
    initial_value: '""'
  - id: pending_message_sender
    type: std::string
    restore_value: no
    initial_value: '""'
  - id: pending_message_content
    type: std::string
    restore_value: no
    initial_value: '""'
  - id: keyboard_showing
    type: bool
    restore_value: no
    initial_value: 'false'
  - id: chat_private_render_limit
    type: uint16_t
    restore_value: no
    initial_value: '25'
  - id: chat_public_render_limit
    type: uint16_t
    restore_value: no
    initial_value: '25'
  - id: chat_private_total_messages
    type: uint16_t
    restore_value: no
    initial_value: '0'
  - id: chat_public_total_messages
    type: uint16_t
    restore_value: no
    initial_value: '0'
  - id: chat_private_loading_more
    type: bool
    restore_value: no
    initial_value: 'false'
  - id: chat_public_loading_more
    type: bool
    restore_value: no
    initial_value: 'false'
  - id: chat_private_prepend_mode
    type: bool
    restore_value: no
    initial_value: 'false'
  - id: chat_public_prepend_mode
    type: bool
    restore_value: no
    initial_value: 'false'
  - id: chat_private_prev_scroll_top
    type: int
    restore_value: no
    initial_value: '0'
  - id: chat_public_prev_scroll_top
    type: int
    restore_value: no
    initial_value: '0'
  - id: chat_private_prev_content_height
    type: int
    restore_value: no
    initial_value: '0'
  - id: chat_public_prev_content_height
    type: int
    restore_value: no
    initial_value: '0'

switch:
  - platform: lvgl
    id: message_dnd_switch
    widget: switch_message_dnd
    restore_mode: RESTORE_DEFAULT_OFF

  - platform: lvgl
    id: message_channel_dnd_switch
    widget: switch_message_channel_dnd
    restore_mode: RESTORE_DEFAULT_OFF

  - platform: lvgl
    id: message_only_favorite_switch
    widget: switch_message_only_favorite
    restore_mode: RESTORE_DEFAULT_OFF

  - platform: lvgl
    id: message_favorite_global_switch
    widget: switch_message_favorite_global
    restore_mode: RESTORE_DEFAULT_OFF

script:
  - id: message_settings_refresh
    mode: restart
    then:
      - lambda: global_preferences->sync();
      - script.execute:
          id: close_notification
          notification_message: "消息"
      - script.execute: contacts_refresh_list
      - script.execute: message_update_unread_indicators
      - script.execute: message_refresh_alert_indicator

  - id: message_resume_visible_content
    mode: restart
    then:
      - lambda: |
          bool chat_open = !lv_obj_has_flag(id(obj_message_private_container), LV_OBJ_FLAG_HIDDEN);
          if (chat_open) {
            std::string active_contact = id(current_contact_uid);
            if (!active_contact.empty()) {
              lv_label_set_text(lbl_topbar_title, active_contact.c_str());
            }
            return;
          }

          uint16_t tab_act = lv_tabview_get_tab_act(tabview_message);
          if (tab_act == 0) {
            id(contacts_refresh_list)->execute();
          } else if (tab_act == 1) {
            id(chat_public_load)->execute();
          }

  - id: message_refresh_alert_indicator
    mode: restart
    then:
      - lambda: |
          bool show_private = false;
          bool show_public = false;
          bool global_dnd = id(message_dnd_switch).state;
          bool channel_dnd = id(message_channel_dnd_switch).state;
          bool only_favorite = id(message_only_favorite_switch).state;

          if (!global_dnd) {
            std::ifstream file("/data/contacts.json");
            std::string config_json;
            if (file.is_open()) {
              std::string line;
              while (std::getline(file, line)) config_json += line + "";
              file.close();
            }

            if (!config_json.empty()) {
              JsonDocument doc;
              DeserializationError error = deserializeJson(doc, config_json);
              if (!error) {
                JsonObject contacts = doc["contacts"].as<JsonObject>();
                if (!contacts.isNull()) {
                  for (JsonPair kv : contacts) {
                    bool favorite = kv.value()["favorite"] | false;
                    uint8_t unread = kv.value()["unread"] | 0;
                    if (unread > 0 && (!only_favorite || favorite)) {
                      show_private = true;
                      break;
                    }
                  }
                }
              }
            }
          }

          if (!global_dnd && !channel_dnd && !only_favorite && id(unread_messages_public_badge) > 0) {
            show_public = true;
          }

          if (show_private || show_public) {
            lv_obj_clear_flag(id(message_unread_messages_amount_indicator), LV_OBJ_FLAG_HIDDEN);
          } else {
            lv_obj_add_flag(id(message_unread_messages_amount_indicator), LV_OBJ_FLAG_HIDDEN);
          }

  - id: contacts_init_file
    then:
      - lambda: |
          struct stat st;
          if (stat("/data/contacts.json", &st) == 0) {
            ESP_LOGI("Chat", "/data/contacts.json exists");
            return;
          }
          std::ofstream file("/data/contacts.json", std::ios::trunc);
          file << "{\"contacts\":{}}";
          file.close();
          ESP_LOGI("Chat", "Created /data/contacts.json");

  - id: contacts_refresh_list
    mode: queued
    then:
      - lambda: |
          lv_obj_t * list = id(list_message_contacts);
          if (list == nullptr) return;

          // Clear and rebuild list
          lv_obj_clean(list);

          static lv_obj_t * float_btn = nullptr;
          float_btn = nullptr;

          // Load contacts JSON
          std::ifstream file("/data/contacts.json");
          std::string config_json;
          if (file.is_open()) {
            std::string line;
            while (std::getline(file, line)) {
              config_json += line + "";
            }
            file.close();
          }
          else {
            ESP_LOGW("Chat", "contacts.json not found");
          }
          ESP_LOGD("Chat", "contacts.json: %s", config_json.c_str());
          JsonDocument doc;
          bool parsed_ok = true;
          if (!config_json.empty()) {
            DeserializationError error = deserializeJson(doc, config_json);
            if (error) {
              ESP_LOGW("Chat", "Failed to parse contacts.json: %s", error.c_str());
              parsed_ok = false;
            }
          }
          else {
            parsed_ok = false;
          }

          if (!parsed_ok) {
            // recover with empty object
            doc.clear();
            doc["contacts"].to<JsonObject>();
            std::ofstream file_fix("/data/contacts.json", std::ios::trunc);
            serializeJson(doc, file_fix);
            file_fix.close();
          }

          JsonObject contacts = doc["contacts"].as<JsonObject>();
          if (contacts.isNull()) {
            contacts = doc["contacts"].to<JsonObject>();
          }
          bool global_dnd = id(message_dnd_switch).state;
          bool only_favorite = id(message_only_favorite_switch).state;

          ESP_LOGD("Chat", "contacts.size(): %u", (unsigned)contacts.size());
          if (contacts.size() == 0) {
            lv_list_add_btn(list, NULL, "暂无联系人");
          }
          else {
            for (JsonPair kv : contacts) {
              std::string contact = kv.key().c_str();
              if (contact.empty()) continue;
              bool favorite = kv.value()["favorite"] | false;
              uint8_t unread = kv.value()["unread"] | 0;
              std::string label = contact;
              if (favorite) {
                label = contact + std::string(" \uF005");  // Fontawesome star
              }
              lv_obj_t * btn = lv_list_add_btn(list, NULL, label.c_str());
              if (favorite) {
                lv_obj_set_style_bg_color(btn, lv_color_hex(0x664cbe), 0);
                lv_obj_set_style_bg_opa(btn, LV_OPA_50, 0);
                lv_obj_set_style_text_color(btn, lv_color_hex(0xffffff), 0);
              }
              bool show_unread_dot = unread > 0 && !global_dnd && (!only_favorite || favorite);
              if (show_unread_dot) {
                lv_obj_t * dot = lv_obj_create(btn);
                lv_obj_set_size(dot, 8, 8);
                lv_obj_set_style_radius(dot, LV_RADIUS_CIRCLE, 0);
                lv_obj_set_style_bg_color(dot, lv_color_hex(0xFF0000), 0);
                lv_obj_set_style_border_width(dot, 0, 0);
                lv_obj_align(dot, LV_ALIGN_RIGHT_MID, -6, 0);
              }

              // Click to open chat
              lv_obj_add_event_cb(btn, [](lv_event_t * e) {
                lv_obj_t * target_btn = static_cast<lv_obj_t *>(lv_event_get_target(e));
                lv_obj_t * list_obj = (lv_obj_t *) lv_event_get_user_data(e);
                if (list_obj == nullptr) return;
                const char * txt = lv_list_get_btn_text(list_obj, target_btn);
                if (!txt) return;
                // remove favorite prefix if present
                std::string name = txt;
                std::string fav_suffix = std::string(" \uF005");
                if (name.size() >= fav_suffix.size() && name.rfind(fav_suffix) == name.size() - fav_suffix.size()) {
                  name = name.substr(0, name.size() - fav_suffix.size());
                }
                id(contacts_open_chat)->execute(name);
              }, LV_EVENT_SHORT_CLICKED, list);

              // Long press to open actions
              lv_obj_add_event_cb(btn, [](lv_event_t * e) {
                lv_obj_t * target_btn = static_cast<lv_obj_t *>(lv_event_get_target(e));
                lv_obj_t * list_obj = (lv_obj_t *) lv_event_get_user_data(e);
                if (list_obj == nullptr) return;
                const char * txt = lv_list_get_btn_text(list_obj, target_btn);
                if (!txt) return;
                std::string name = txt;
                bool favorite = false;
                std::string fav_suffix = std::string(" \uF005");
                if (name.size() >= fav_suffix.size() && name.rfind(fav_suffix) == name.size() - fav_suffix.size()) {
                  favorite = true;
                  name = name.substr(0, name.size() - fav_suffix.size());
                }
                id(pending_action_contact) = name;
                lv_label_set_text(id(lbl_contact_action_favorite), favorite ? "取消关心" : "特别关心");
                lv_obj_set_style_bg_color(id(btn_contact_action_favorite),
                                          favorite ? lv_color_hex(0x1f95f6) : lv_color_hex(0xFFCA26),
                                          0);
                lv_obj_clear_flag(id(obj_contact_action_overlay), LV_OBJ_FLAG_HIDDEN);
                lv_obj_move_foreground(id(obj_contact_action_overlay));
              }, LV_EVENT_LONG_PRESSED, list);
            }
          }

          // Floating add button
          if (float_btn == nullptr) {
            float_btn = lv_btn_create(list);
            lv_obj_set_size(float_btn, 46, 46);
            lv_obj_add_flag(float_btn, LV_OBJ_FLAG_FLOATING);
            lv_obj_align(float_btn, LV_ALIGN_BOTTOM_RIGHT, 0, -lv_obj_get_style_pad_right(list, LV_PART_MAIN));
            lv_obj_set_style_radius(float_btn, LV_RADIUS_CIRCLE, 0);
            lv_obj_set_style_bg_color(float_btn, lv_color_hex(0x1f95f6), 0);
            lv_obj_t * label = lv_label_create(float_btn);
            lv_label_set_text(label, "+");
            lv_obj_set_style_text_font(label, chinese_font18, LV_PART_MAIN);
            lv_obj_align(label, LV_ALIGN_CENTER, 0, 2);
            lv_obj_add_event_cb(float_btn, [](lv_event_t * e) {
              lv_obj_clear_flag(id(obj_contact_add_overlay), LV_OBJ_FLAG_HIDDEN);
              lv_obj_move_foreground(id(obj_contact_add_overlay));
              lv_textarea_set_text(id(textarea_contact_add_input), "");
            }, LV_EVENT_CLICKED, NULL);
          }
          lv_obj_move_foreground(float_btn);
          lv_obj_update_layout(list);
          ESP_LOGD("Chat", "contacts list children: %u", (unsigned)lv_obj_get_child_cnt(list));
          id(message_update_unread_indicators)->execute();

  - id: contacts_add
    mode: queued
    parameters:
      contact: string
    then:
      - lambda: |
          std::string name = contact;
          auto is_space = [](char c) {
            return c == ' ' || c == '\t' || c == '\n' || c == '\r';
          };
          while (!name.empty() && is_space(name.front())) name.erase(name.begin());
          while (!name.empty() && is_space(name.back())) name.pop_back();

          if (name.empty()) {
            id(show_notification)->execute("联系人不能为空", "", 2000);
            return;
          }

          std::ifstream file("/data/contacts.json");
          std::string config_json;
          if (file.is_open()) {
            std::string line;
            while (std::getline(file, line)) {
              config_json += line + "";
            }
            file.close();
          }

          JsonDocument doc;
          if (!config_json.empty()) {
            DeserializationError error = deserializeJson(doc, config_json);
            if (error) {
              ESP_LOGW("Chat", "Failed to parse contacts.json: %s", error.c_str());
              doc.clear();
            }
          }

          // Migrate old array format to object format
          if (doc["contacts"].is<JsonArray>()) {
            std::vector<std::string> names;
            for (JsonVariant item : doc["contacts"].as<JsonArray>()) {
              std::string n = item.as<std::string>();
              if (!n.empty()) names.push_back(n);
            }
            doc.clear();
            JsonObject contacts_obj = doc["contacts"].to<JsonObject>();
            for (auto &n : names) {
              contacts_obj[n.c_str()]["favorite"] = false;
              contacts_obj[n.c_str()]["unread"] = 0;
            }
          }

          JsonObject contacts = doc["contacts"].as<JsonObject>();
          if (contacts.isNull()) {
            contacts = doc["contacts"].to<JsonObject>();
          }
          if (!contacts[name.c_str()].isNull()) {
            id(show_notification)->execute("联系人已存在", "", 2000);
            return;
          }
          contacts[name.c_str()]["favorite"] = false;
          contacts[name.c_str()]["unread"] = 0;

          std::ofstream file1("/data/contacts.json", std::ios::trunc);
          serializeJson(doc, file1);
          file1.close();

          id(contacts_refresh_list)->execute();

  - id: contacts_delete
    mode: queued
    parameters:
      contact: string
    then:
      - lambda: |
          std::string target = contact;
          if (target.empty()) return;
          if (target == "cookie987" && id(uid) == "srr321" || target == "srr321" && id(uid) == "cookie987") {
            id(show_notification)->execute("你~删~不~掉~我~哦~~ :)", "", 2000);
            return;
          }

          std::ifstream file("/data/contacts.json");
          std::string config_json;
          if (file.is_open()) {
            std::string line;
            while (std::getline(file, line)) {
              config_json += line + "";
            }
            file.close();
          }

          JsonDocument doc;
          if (!config_json.empty()) {
            DeserializationError error = deserializeJson(doc, config_json);
            if (error) {
              ESP_LOGW("Chat", "Failed to parse contacts.json: %s", error.c_str());
              return;
            }
          }

          bool removed = false;
          if (doc["contacts"].is<JsonObject>()) {
            JsonObject contacts = doc["contacts"].as<JsonObject>();
            if (!contacts[target.c_str()].isNull()) {
              contacts.remove(target.c_str());
              removed = true;
            }
          }
          else if (doc["contacts"].is<JsonArray>()) {
            JsonArray contacts = doc["contacts"].as<JsonArray>();
            for (JsonArray::iterator it = contacts.begin(); it != contacts.end(); ++it) {
              if ((*it).as<std::string>() == target) {
                contacts.remove(it);
                removed = true;
                break;
              }
            }
          }

          if (!removed) return;

          std::ofstream file1("/data/contacts.json", std::ios::trunc);
          serializeJson(doc, file1);
          file1.close();

          if (id(current_contact_uid) == target) {
            id(contacts_close_chat)->execute();
          }
          id(contacts_refresh_list)->execute();

  - id: contacts_toggle_favorite
    mode: queued
    parameters:
      contact: string
    then:
      - lambda: |
          std::string target = contact;
          if (target.empty()) return;

          std::ifstream file("/data/contacts.json");
          std::string config_json;
          if (file.is_open()) {
            std::string line;
            while (std::getline(file, line)) {
              config_json += line + "\n";
            }
            file.close();
          }

          JsonDocument doc;
          if (!config_json.empty()) {
            DeserializationError error = deserializeJson(doc, config_json);
            if (error) {
              ESP_LOGW("Chat", "Failed to parse contacts.json: %s", error.c_str());
              return;
            }
          }

          JsonObject contacts = doc["contacts"].as<JsonObject>();
          if (contacts.isNull()) return;
          if (contacts[target.c_str()].isNull()) return;

          bool favorite = contacts[target.c_str()]["favorite"] | false;
          contacts[target.c_str()]["favorite"] = !favorite;

          std::string output;
          serializeJson(doc, output);
          std::ofstream file1("/data/contacts.json");
          file1 << output;
          file1.close();

          id(contacts_refresh_list)->execute();

  - id: contacts_open_chat
    mode: queued
    parameters:
      contact: string
    then:
      - lambda: |
          std::string name = contact;
          if (name.empty()) return;
          id(current_contact_uid) = name;
          lv_label_set_text(lbl_topbar_title, name.c_str());
          id(contacts_clear_unread)->execute(name);

          lv_obj_add_flag(id(tabview_message), LV_OBJ_FLAG_HIDDEN);
          lv_obj_clear_flag(id(obj_message_private_container), LV_OBJ_FLAG_HIDDEN);
          lv_obj_move_foreground(id(obj_message_private_container));

          id(chat_private_render_limit) = 25;
          id(chat_private_total_messages) = 0;
          id(chat_private_loading_more) = false;
          id(chat_private_prepend_mode) = false;

          // Reset private chat list for the selected contact
          lv_obj_clean(id(list_message_friend));
          lv_textarea_set_text(id(textarea_message_friend_input), "");
          lv_textarea_set_placeholder_text(id(textarea_message_friend_input),
                              "单击输入消息，长按进入全屏输入");
          id(chat_private_load)->execute(name);

  - id: contacts_close_chat
    mode: queued
    then:
      - lambda: |
          lv_label_set_text(lbl_topbar_title, "消息");
          lv_obj_add_flag(id(obj_message_private_container), LV_OBJ_FLAG_HIDDEN);
          lv_obj_clear_flag(id(tabview_message), LV_OBJ_FLAG_HIDDEN);
          lv_obj_move_foreground(id(tabview_message));
          lv_tabview_set_act(tabview_message, 0, LV_ANIM_OFF);
          id(current_contact_uid).clear();
          id(keyboard_message_hide)->execute();
          id(message_update_unread_indicators)->execute();

  - id: message_open_action_menu
    mode: restart
    parameters:
      sender: string
      content: string
    then:
      - lambda: |
          id(pending_message_sender) = sender;
          id(pending_message_content) = content;
          std::string sender_label = sender.empty() ? "发送人：未识别" : (std::string("发送人：") + sender);
          lv_label_set_text(id(lbl_message_action_sender), sender_label.c_str());
          lv_obj_clear_flag(id(obj_message_action_overlay), LV_OBJ_FLAG_HIDDEN);
          lv_obj_move_foreground(id(obj_message_action_overlay));

  - id: message_action_quote
    mode: restart
    then:
      - lambda: |
          std::string content = id(pending_message_content);
          std::string sender = id(pending_message_sender);
          if (content.empty()) {
            id(show_notification)->execute("没有可引用的消息", "", 1500);
            return;
          }

          lv_obj_t * textarea = nullptr;
          bool private_chat_open = !lv_obj_has_flag(id(obj_message_private_container), LV_OBJ_FLAG_HIDDEN);
          if (private_chat_open) {
            textarea = textarea_message_friend_input;
          } else if (lv_tabview_get_tab_act(tabview_message) == 1) {
            textarea = textarea_message_public_input;
          }
          if (textarea == nullptr) return;

          id(keyboard_message_show)->execute();
          lv_keyboard_reset_ime(id(keyboard_message_input)->obj);
          lv_keyboard_set_textarea(id(keyboard_message_input)->obj, textarea);
          std::string existing = lv_textarea_get_text(textarea);
          if (sender.empty()) {
            sender = "未识别";
          }
          std::string updated_text = std::string(" //") + sender + std::string(": ") + content;
          if (!existing.empty()) {
            updated_text += std::string("\n") + existing;
          }
          lv_textarea_set_text(textarea, updated_text.c_str());
          lv_obj_add_state(textarea, LV_STATE_FOCUSED);
          lv_obj_send_event(textarea, LV_EVENT_FOCUSED, nullptr);
          lv_textarea_set_cursor_pos(textarea, 0);

  - id: message_action_mention
    mode: restart
    then:
      - lambda: |
          std::string sender = id(pending_message_sender);
          if (sender.empty()) {
            id(show_notification)->execute("无法识别发送人", "", 1500);
            return;
          }

          lv_obj_t * textarea = nullptr;
          bool private_chat_open = !lv_obj_has_flag(id(obj_message_private_container), LV_OBJ_FLAG_HIDDEN);
          if (private_chat_open) {
            textarea = id(textarea_message_friend_input);
          } else if (lv_tabview_get_tab_act(tabview_message) == 1) {
            textarea = id(textarea_message_public_input);
          }
          if (textarea == nullptr) return;

          id(keyboard_message_show)->execute();
          lv_keyboard_reset_ime(id(keyboard_message_input)->obj);
          lv_keyboard_set_textarea(id(keyboard_message_input)->obj, textarea);

          std::string insert_text = std::string("@") + sender + " ";
          std::string existing = lv_textarea_get_text(textarea);
          if (!existing.empty() && existing.back() != ' ' && existing.back() != '\n') {
            insert_text = std::string(" ") + insert_text;
          }
          lv_textarea_set_cursor_pos(textarea, LV_TEXTAREA_CURSOR_LAST);
          lv_textarea_add_text(textarea, insert_text.c_str());
          lv_obj_add_state(textarea, LV_STATE_FOCUSED);
          lv_obj_send_event(textarea, LV_EVENT_FOCUSED, nullptr);
          lv_textarea_set_cursor_pos(textarea, LV_TEXTAREA_CURSOR_LAST);

  - id: contacts_increment_unread
    mode: queued
    parameters:
      contact: string
    then:
      - lambda: |
          std::string name = contact;
          if (name.empty()) return;
          std::ifstream file("/data/contacts.json");
          std::string config_json;
          if (file.is_open()) {
            std::string line;
            while (std::getline(file, line)) config_json += line + "";
            file.close();
          }

          JsonDocument doc;
          if (!config_json.empty()) {
            DeserializationError error = deserializeJson(doc, config_json);
            if (error) {
              ESP_LOGW("Chat", "Failed to parse contacts.json: %s", error.c_str());
              doc.clear();
            }
          }

          if (doc["contacts"].is<JsonArray>()) {
            std::vector<std::string> names;
            for (JsonVariant item : doc["contacts"].as<JsonArray>()) {
              std::string n = item.as<std::string>();
              if (!n.empty()) names.push_back(n);
            }
            doc.clear();
            JsonObject contacts_obj = doc["contacts"].to<JsonObject>();
            for (auto &n : names) {
              contacts_obj[n.c_str()]["favorite"] = false;
              contacts_obj[n.c_str()]["unread"] = 0;
            }
          }

          JsonObject contacts = doc["contacts"].as<JsonObject>();
          if (contacts.isNull()) {
            contacts = doc["contacts"].to<JsonObject>();
          }
          if (contacts[name.c_str()].isNull()) {
            contacts[name.c_str()]["favorite"] = false;
            contacts[name.c_str()]["unread"] = 0;
          }
          uint8_t unread = contacts[name.c_str()]["unread"] | 0;
          if (unread < 255) unread++;
          contacts[name.c_str()]["unread"] = unread;

          std::ofstream file1("/data/contacts.json", std::ios::trunc);
          serializeJson(doc, file1);
          file1.close();

          id(contacts_refresh_list)->execute();
          id(message_update_unread_indicators)->execute();
          id(message_refresh_alert_indicator)->execute();

