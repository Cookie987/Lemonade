                               std::string(" · ") + format_time(time_s, today_str, current_year);
            lv_text_flag_t text_flag = has_recolor ? LV_TEXT_FLAG_RECOLOR : LV_TEXT_FLAG_NONE;
            lv_point_t meta_size;
            lv_point_t content_size;
            auto *bubble_font = chinese_font14->get_lv_font();
            lv_txt_get_size(&meta_size, meta.c_str(), bubble_font, 0, 0, LV_COORD_MAX, LV_TEXT_FLAG_NONE);
            lv_txt_get_size(&content_size, content_s.c_str(), bubble_font, 0, 0, LV_COORD_MAX, text_flag);
            const lv_coord_t bubble_max_width = 244;
            const lv_coord_t bubble_inner_max_width = bubble_max_width - 20;
            lv_coord_t bubble_inner_width = meta_size.x > content_size.x ? meta_size.x : content_size.x;
            if (bubble_inner_width < 28) bubble_inner_width = 28;
            if (bubble_inner_width > bubble_inner_max_width) bubble_inner_width = bubble_inner_max_width;
            lv_coord_t bubble_width = bubble_inner_width + 20;

            lv_obj_t * row = lv_obj_create(list);
            lv_obj_set_width(row, lv_pct(100));
            lv_obj_set_height(row, LV_SIZE_CONTENT);
            lv_obj_set_style_bg_opa(row, LV_OPA_TRANSP, 0);
            lv_obj_set_style_border_width(row, 0, 0);
            lv_obj_set_style_pad_all(row, 0, 0);
            lv_obj_set_style_shadow_width(row, 0, 0);
            lv_obj_set_style_radius(row, 0, 0);
            lv_obj_clear_flag(row, LV_OBJ_FLAG_SCROLLABLE);

            lv_obj_t * bubble = lv_obj_create(row);
            lv_obj_set_width(bubble, bubble_width);
            lv_obj_set_height(bubble, LV_SIZE_CONTENT);
            lv_obj_clear_flag(bubble, LV_OBJ_FLAG_SCROLLABLE);
            lv_obj_set_scrollbar_mode(bubble, LV_SCROLLBAR_MODE_OFF);
            lv_obj_set_scroll_dir(bubble, LV_DIR_NONE);
            lv_obj_set_style_radius(bubble, 14, 0);
            lv_obj_set_style_border_width(bubble, has_recolor ? 2 : 0, 0);
            lv_obj_set_style_border_color(bubble, lv_color_hex(0x9098A1), 0);
            lv_obj_set_style_pad_ver(bubble, 8, 0);
            lv_obj_set_style_pad_hor(bubble, 10, 0);
            lv_obj_set_style_shadow_width(bubble, 0, 0);
            lv_obj_set_style_bg_color(bubble,
                                      has_recolor ? lv_color_hex(0xFFFFFF)
                                                  : (is_self ? lv_color_hex(0x1F95F6) : lv_color_hex(0xEEF2F6)),
                                      0);
            lv_obj_set_style_text_color(bubble,
                                        has_recolor ? lv_color_hex(0x111111)
                                                    : (is_self ? lv_color_hex(0xFFFFFF) : lv_color_hex(0x1F2328)),
                                        0);
            lv_obj_set_flex_flow(bubble, LV_FLEX_FLOW_COLUMN);
            lv_obj_set_flex_align(bubble, LV_FLEX_ALIGN_START, LV_FLEX_ALIGN_START, LV_FLEX_ALIGN_START);
            lv_obj_align(bubble, is_self ? LV_ALIGN_TOP_RIGHT : LV_ALIGN_TOP_LEFT, is_self ? -4 : 4, 0);

            lv_obj_t * meta_label = lv_label_create(bubble);
            lv_obj_set_width(meta_label, bubble_inner_width);
            lv_label_set_text(meta_label, meta.c_str());
            lv_obj_set_style_text_font(meta_label, chinese_font14, 0);
            lv_obj_set_style_text_color(meta_label,
                                        has_recolor ? lv_color_hex(0x4F5964)
                                                    : (is_self ? lv_color_hex(0xD8EEFF) : lv_color_hex(0x6E7781)),
                                        0);

            lv_obj_t * content_label = lv_label_create(bubble);
            lv_obj_set_width(content_label, bubble_inner_width);
            lv_label_set_text(content_label, content_s.c_str());
            lv_label_set_long_mode(content_label, LV_LABEL_LONG_WRAP);
            lv_obj_set_style_text_font(content_label, chinese_font14, 0);
            lv_obj_set_style_text_color(content_label,
                                        has_recolor ? lv_color_hex(0x111111)
                                                    : (is_self ? lv_color_hex(0xFFFFFF) : lv_color_hex(0x1F2328)),
                                        0);
            lv_label_set_recolor(content_label, true);

            lv_obj_add_event_cb(bubble, [](lv_event_t * e) {
              lv_obj_t * target = static_cast<lv_obj_t *>(lv_event_get_target(e));
              if (target == nullptr || lv_obj_get_child_cnt(target) < 2) return;
              lv_obj_t * meta_obj = lv_obj_get_child(target, 0);
              lv_obj_t * content_obj = lv_obj_get_child(target, 1);
              const char * meta_txt = meta_obj ? lv_label_get_text(meta_obj) : nullptr;
              const char * content_txt = content_obj ? lv_label_get_text(content_obj) : nullptr;
              if (content_txt == nullptr) return;

              std::string sender;
              if (meta_txt != nullptr) {
                std::string meta_str = meta_txt;
                size_t pos = meta_str.find(" · ");
                sender = pos == std::string::npos ? meta_str : meta_str.substr(0, pos);
                if (sender == "我") sender = id(uid);
              }
              id(message_open_action_menu)->execute(sender, std::string(content_txt));
            }, LV_EVENT_LONG_PRESSED, nullptr);

            lv_obj_update_layout(row);
            lv_obj_set_height(row, lv_obj_get_height(bubble) + 2);
            last_row = row;
          }

          if (modified) {
            std::ofstream out("/data/chat_public.json", std::ios::trunc);
            if (out.is_open()) {
              serializeJson(doc, out);
              out.close();
            }
          }

          lv_obj_update_layout(list);
          int32_t new_content_height =
              lv_obj_get_height(list) + lv_obj_get_scroll_top(list) + lv_obj_get_scroll_bottom(list);
          if (id(chat_public_prepend_mode)) {
            int32_t target_y =
                id(chat_public_prev_scroll_top) + (new_content_height - id(chat_public_prev_content_height));
            if (target_y < 0) target_y = 0;
            lv_obj_scroll_to_y(list, target_y, LV_ANIM_OFF);
          } else if (keep_bottom && last_row != nullptr) {
            lv_obj_scroll_to_view(last_row, LV_ANIM_OFF);
          } else {
            lv_obj_scroll_to_y(list, old_scroll_top, LV_ANIM_OFF);
          }

          id(chat_public_prepend_mode) = false;
          id(chat_public_loading_more) = false;

  - id: send_message
    then:
      - lambda: |
          bool private_chat_open = !lv_obj_has_flag(id(obj_message_private_container), LV_OBJ_FLAG_HIDDEN);
          std::string mac = id(text_sensor_mac_address).state;
          auto t = id(ntp_time).now();

          if (private_chat_open) {
            std::string targetuid = id(current_contact_uid);
            if (targetuid.empty()) {
              id(show_notification)->execute("请选择联系人", "", 2000);
              return;
            }
            std::string message_content = lv_textarea_get_text(textarea_message_friend_input);
            if (message_content.empty()) return;
            std::string time_str = t.strftime("%Y-%m-%d %H:%M:%S");
            ESP_LOGD("Chat", "Target UID: %s", targetuid.c_str());

            id(mqtt_client).publish_json((std::string("chat/") +
                                          mac +
                                          std::string("/up")).c_str(),
                                          [=](JsonObject root) {
              root["type"] = "p2p";
              root["to"] = targetuid;
              root["content"] = message_content;
              root["msg_id"] = esp_random();
            });

            lv_textarea_set_text(textarea_message_friend_input, "");
            lv_textarea_set_placeholder_text(textarea_message_friend_input,
                            (time_str + std::string(" 发送中……")).c_str()
                          );
            ESP_LOGD("Chat", "Sent message to %s", targetuid.c_str());
            return;
          }

          uint16_t tab_act = lv_tabview_get_tab_act(tabview_message);
          if (tab_act != 1) return;

          std::string message_content = lv_textarea_get_text(textarea_message_public_input);
          if (message_content.empty()) return;
          id(mqtt_client).publish("smck/glousr",(
                                    id(uid) +
                                    std::string(":") +
                                    message_content
                                  ).c_str()
                    );
          std::string time_str = t.strftime("%Y-%m-%d %H:%M:%S");
          lv_textarea_set_text(textarea_message_public_input, "");
          ESP_LOGD("Chat", "Sent message to the topic");

  - id: message_public_listen
    then:
      - lambda: |
          id(mqtt_client).subscribe("smck/glousr", [=](const std::string &topic, const std::string &payload) {
              ESP_LOGD("Chat", "Got raw public chat message.");
              // 获取发送者
              size_t pos = payload.find(':');
              std::string sender, content;
              if (pos != std::string::npos) {
                  sender  = payload.substr(0, pos);
                  content = payload.substr(pos + 1);
              } else {
                  sender  = payload;
                  content = "";
              }
              // 获取当前时间
              auto t = id(ntp_time).now();
              std::string time_str = t.strftime("%Y-%m-%d %H:%M:%S");
              id(chat_public_append)->execute(sender, content, time_str);
              id(chat_public_append_visible)->execute(sender, content, time_str);
              bool page_show = id(page_message).is_showing();
              bool chat_open = !lv_obj_has_flag(id(obj_message_private_container), LV_OBJ_FLAG_HIDDEN);
              bool on_public_tab = page_show && !chat_open && (lv_tabview_get_tab_act(tabview_message) == 1);
              bool global_dnd = id(message_dnd_switch).state;
              bool channel_dnd = id(message_channel_dnd_switch).state;
              bool only_favorite = id(message_only_favorite_switch).state;
              bool public_alert_enabled = !global_dnd && !channel_dnd && !only_favorite;

              if (!on_public_tab) {
                if (id(unread_messages_public_badge) < 255) {
                  id(unread_messages_public_badge)++;
                }
                id(message_update_unread_indicators)->execute();
                id(message_refresh_alert_indicator)->execute();
              } else if (id(unread_messages_public_badge) > 0) {
                id(unread_messages_public_badge) = 0;
                id(message_update_unread_indicators)->execute();
                id(message_refresh_alert_indicator)->execute();
              }

              if(!page_show && public_alert_enabled) {
                if (id(unread_messages_amount_public) < 255) {
                  id(unread_messages_amount_public)++;
                  id(show_notification)->execute(
                    std::string("收到 ") +
                    std::to_string(id(unread_messages_amount_public)) +
                    std::string(" 条频道消息"), std::string("条频道消息"), 0);
                }
                else{
                  id(show_notification)->execute(
                    std::string("收到 255+ 条频道消息"), std::string("条频道消息"), 0);
                }
                id(message_refresh_alert_indicator)->execute();
              }
          });
