  - id: chat_private_append
    mode: queued
    parameters:
      contact: string
      from: string
      content: string
      time: string
    then:
      - lambda: |
          if (contact.empty()) return;
          struct PsramAllocator : ArduinoJson::Allocator{
            void* allocate(size_t n) { return heap_caps_malloc(n, MALLOC_CAP_SPIRAM); }
            void deallocate(void* p) { heap_caps_free(p); }
            void* reallocate(void* p, size_t n) { return heap_caps_realloc(p, n, MALLOC_CAP_SPIRAM); }
          } psram_allocator;
          // 1. 路径生成优化：直接引用参数，不创建新的 string name = contact
          auto get_path = [&]() -> std::string {
            uint32_t h = 2166136261u;
            for (unsigned char c : contact) { // 直接遍历参数
              h ^= c;
              h *= 16777619u;
            }
            char buf[64];
            snprintf(buf, sizeof(buf), "/data/chat_private_%08X.json", (unsigned)h);
            return std::string(buf);
          };

          std::string path = get_path();
          JsonDocument doc(&psram_allocator);

          // 3. 文件读取优化：【最关键改动】
          // 删除了原来的 while(getline) 和 json_str += line
          // 直接从文件流解析，节省了存放整个 JSON 字符串的 RAM 空间
          std::ifstream is(path);
          if (is.is_open()) {
              deserializeJson(doc, is); // 直接对接流，无中间拷贝
              is.close();
          }

          // 4. JSON 操作
          JsonArray arr = doc["messages"].as<JsonArray>();
          if (arr.isNull()) {
              arr = doc["messages"].to<JsonArray>();
          }

          // 5. 写入数据：直接赋值，ArduinoJson 会处理内部存储
          JsonObject item = arr.add<JsonObject>();
          item["time"] = time;
          item["from"] = from;
          item["content"] = content;

          // 6. 长度控制
          while (arr.size() > 200) {
              arr.remove(0);
          }

          // 7. 文件保存优化
          // 使用 std::ios::trunc 覆盖写入，直接序列化到文件流
          std::ofstream os(path, std::ios::trunc);
          if (os.is_open()) {
              serializeJson(doc, os); // 直接写磁盘，不产生临时大字符串
              os.close();
          }

