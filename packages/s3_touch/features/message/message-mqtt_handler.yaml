script:
  - id: message_mqtt_handler
    then:
      - lambda: |
          std::string mac = id(text_sensor_mac_address).state;
          id(mqtt_client).subscribe("chat/" + mac + "/#", [=](const std::string &topic, const std::string &payload) {
              ESP_LOGI("CookieIoT", "Received from topic %s: %s", topic.c_str(), payload.c_str());
              auto bind_message_long_press = [](lv_obj_t * list_obj, lv_obj_t * btn) {
                if (list_obj == nullptr || btn == nullptr) return;
                lv_obj_add_event_cb(btn, [](lv_event_t * e) {
                  lv_obj_t * target_btn = lv_event_get_target(e);
                  lv_obj_t * parent_list = (lv_obj_t *) lv_event_get_user_data(e);
                  if (target_btn == nullptr || parent_list == nullptr) return;

                  const char * content_txt = lv_list_get_btn_text(parent_list, target_btn);
                  if (content_txt == nullptr) return;

                  std::string sender;
                  uint32_t index = lv_obj_get_index(target_btn);
                  if (index > 0) {
                    lv_obj_t * header = lv_obj_get_child(parent_list, index - 1);
                    const char * header_txt = header ? lv_label_get_text(header) : nullptr;
                    if (header_txt != nullptr) {
                      std::string header_str = header_txt;
                      size_t pos = header_str.rfind(" - ");
                      if (pos != std::string::npos) {
                        sender = header_str.substr(pos + 3);
                      }
                    }
                  }

                  id(message_open_action_menu)->execute(sender, std::string(content_txt));
                }, LV_EVENT_LONG_PRESSED, list_obj);
              };
              // 提取mac后的内容
              std::string response_suffix = "";
              size_t pos = topic.find(mac + "/");
              if (pos != std::string::npos) {
                response_suffix = topic.substr(pos + 18); // "00:00:00:00:00:00/".length() == 18
              }
              ESP_LOGI("CookieIoT", "Suffix: %s", response_suffix.c_str());

              //
              // down
              //
              if (response_suffix == "down"){
                ESP_LOGI("CookieIoT", "Received down");
                json::parse_json(payload, [&](JsonVariant root) -> bool {
                  std::string type = root["type"] | "chat";  // "chat", "ack", "system"
                  std::string sub_type = root["sub_type"] | "p2p";  // "p2p", "channel"
                  uint32_t msg_id = root["msg_id"] | 0;
                  time_t timestamp = root["timestamp"] | 0;
                  // timestamp 转为时间
                  esphome::ESPTime esp_time = esphome::ESPTime::from_epoch_local(timestamp);
                  if (type == "chat"){
                    // Simple de-dupe across devices using msg_id (no STL containers required)
                    if (msg_id != 0) {
                      static uint32_t recent_ids[64] = {0};
                      static uint8_t recent_count = 0;
                      static uint8_t recent_pos = 0;
                      bool seen = false;
                      for (uint8_t i = 0; i < recent_count; i++) {
                        if (recent_ids[i] == msg_id) { seen = true; break; }
                      }
                      if (seen) return true;
                      recent_ids[recent_pos] = msg_id;
                      recent_pos = (recent_pos + 1) % 64;
                      if (recent_count < 64) recent_count++;
                    }
                    std::string from_name = root["from"]["name"] | "匿名用户";
                    std::string to_name = root["to"]["name"] | "未知用户";
                    std::string format = root["payload"]["fmt"] | "text";  // "text", "image"
                    std::string content = root["payload"]["content"] | "";

                    if (sub_type == "p2p"){
                      bool page_show = id(page_message).is_showing();
                      bool chat_open = !lv_obj_has_flag(id(obj_message_private_container), LV_OBJ_FLAG_HIDDEN);
                      std::string active_contact = id(current_contact_uid);
                      bool is_active_contact = page_show && chat_open && !active_contact.empty() && (from_name == active_contact || (from_name == id(uid) && to_name == active_contact));
                      bool contact_favorite = false;
                      {
                        std::ifstream file("/data/contacts.json");
                        std::string config_json;
                        if (file.is_open()) {
                          std::string line;
                          while (std::getline(file, line)) config_json += line + "";
                          file.close();
                        }
                        if (!config_json.empty()) {
                          JsonDocument contact_doc;
                          DeserializationError contact_error = deserializeJson(contact_doc, config_json);
                          if (!contact_error) {
                            JsonObject contacts = contact_doc["contacts"].as<JsonObject>();
                            if (!contacts.isNull() && !contacts[from_name.c_str()].isNull()) {
                              contact_favorite = contacts[from_name.c_str()]["favorite"] | false;
                            }
                          }
                        }
                      }
                      bool global_dnd = id(message_dnd_switch).state;
                      bool only_favorite = id(message_only_favorite_switch).state;
                      bool favorite_global = id(message_favorite_global_switch).state;
                      bool private_alert_enabled = !global_dnd && (!only_favorite || contact_favorite);
                      bool should_raise_global_alert = false;

                      std::string time_str = esp_time.strftime("%Y-%m-%d %H:%M:%S");
                      if (from_name == id(uid)) {
                        id(chat_private_append)->execute(to_name, from_name, content, time_str);
                      } else if (to_name == id(uid)) {
                        id(chat_private_append)->execute(from_name, from_name, content, time_str);
                      }

                      if (to_name == id(uid) && from_name != id(uid)) {
                        if (is_active_contact) {
                          id(contacts_clear_unread)->execute(from_name);
                        } else {
                          id(contacts_increment_unread)->execute(from_name);
                        }
                      }

                      if (to_name == id(uid) && from_name != id(uid) && private_alert_enabled) {
                        if (!page_show) {
                          should_raise_global_alert = true;
                        } else if (contact_favorite && favorite_global && !is_active_contact) {
                          should_raise_global_alert = true;
                        }
                      }

                      if (should_raise_global_alert) {
                        if (contact_favorite) {
                          if (id(unread_messages_amount_private_favorite) < 255) {
                            id(unread_messages_amount_private_favorite)++;
                            id(show_notification)->execute(
                              std::string("收到 ") +
                              std::to_string(id(unread_messages_amount_private_favorite)) +
                              std::string(" 条私聊消息（特别关心）"),
                              "条私聊消息（特别关心）", 0);
                          } else {
                            id(show_notification)->execute("收到 255+ 条私聊消息（特别关心）", "条私聊消息（特别关心）", 0);
                          }
                        }
                        else if (id(unread_messages_amount_private) < 255) {
                          id(unread_messages_amount_private)++;
                          id(show_notification)->execute(
                            std::string("收到 ") +
                            std::to_string(id(unread_messages_amount_private)) +
                            std::string(" 条私聊消息"),
                            "条私聊消息", 0);
                        }
                        else{
                          id(show_notification)->execute("收到 255+ 条私聊消息", "条私聊消息", 0);
                        }
                        id(message_refresh_alert_indicator)->execute();
                      }
                      if (is_active_contact) {
                        lv_obj_t * friend_list = id(list_message_friend);
                        int32_t friend_scroll_top = 0;
                        bool keep_friend_bottom = false;
                        if (friend_list != nullptr) {
                          auto near_bottom_threshold = [](lv_obj_t * list_obj) -> int32_t {
                            if (list_obj == nullptr) return 12;
                            uint32_t child_count = lv_obj_get_child_cnt(list_obj);
                            int32_t threshold = 0;
                            uint8_t counted_messages = 0;
                            for (int32_t i = static_cast<int32_t>(child_count) - 1; i >= 0 && counted_messages < 2; --i) {
                              lv_obj_t * child = lv_obj_get_child(list_obj, static_cast<uint32_t>(i));
                              if (child == nullptr) continue;
                              threshold += lv_obj_get_height(child);
                              if ((i % 2) == 1) counted_messages++;
                            }
                            if (threshold <= 0) threshold = 12;
                            return threshold;
                          };
                          friend_scroll_top = lv_obj_get_scroll_top(friend_list);
                          keep_friend_bottom = lv_obj_get_scroll_bottom(friend_list) <= near_bottom_threshold(friend_list);
                        }
                        lv_list_add_text(friend_list,
                                          (
                                            time_str +
                                            std::string(" - ") +
                                            from_name
                                          ).c_str()
                                        );
                        lv_obj_t * list_btn = lv_list_add_btn(friend_list, NULL, content.c_str());
                        bind_message_long_press(friend_list, list_btn);
                        lv_label_set_recolor(lv_obj_get_child(list_btn, 0), true);
                        // 只保留最近的100条，但是名称标签也算，所以是200
                        uint32_t children_count = lv_obj_get_child_cnt(list_message_friend);
                        if (children_count > 200) {
                          for (uint32_t i = 0; i < children_count - 200; i++) {
                            lv_obj_del(lv_obj_get_child(list_message_friend, 0));
                          }
                        }
                        lv_obj_update_layout(friend_list);
                        if (keep_friend_bottom) {
                          lv_obj_scroll_to_view(list_btn, LV_ANIM_ON);
                        } else {
                          lv_obj_scroll_to_y(friend_list, friend_scroll_top, LV_ANIM_OFF);
                        }
                      }
                    }
                  }
                  return true;
                });
              }

              //
              // ack
              //
              if (response_suffix == "ack"){
                ESP_LOGI("CookieIoT", "Received ack");
                json::parse_json(payload, [&](JsonVariant root) -> bool {
                  auto t = id(ntp_time).now();
                  std::string status = root["status"] | "error";
                  if (status == "delivered"){
                    ESP_LOGI("CookieIoT", "Ack success");
                    lv_textarea_set_placeholder_text(textarea_message_friend_input, "输入消息...");
                  }
                  else{
                    ESP_LOGI("CookieIoT", "Ack error");
                    lv_textarea_set_placeholder_text(textarea_message_friend_input,
                                                  (std::string(t.strftime("%Y-%m-%d %H:%M:%S")) +
                                                  std::string(" 发送失败")).c_str()
                                                );
                  }
                  return true;
                });
              }
          },1);
