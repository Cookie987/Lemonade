globals:
  - id: mqtt_credential_registered
    type: bool
    restore_value: no
    initial_value: 'false'
  - id: mqtt_credential_username
    type: std::string
    restore_value: no
    initial_value: '""'
  - id: mqtt_credential_token
    type: std::string
    restore_value: no
    initial_value: '""'
  - id: mqtt_was_connected
    type: bool
    restore_value: no
    initial_value: 'false'

script:
  - id: mqtt_register_credentials
    mode: restart
    then:
      # 1. 检查本地是否已有凭据
      - lambda: |
          ESP_LOGI("MQTT_Cred", "Checking local credentials...");
          struct stat st;
          if (stat("/data/mqtt_credentials.json", &st) == 0) {
            std::ifstream f("/data/mqtt_credentials.json");
            JsonDocument doc;
            deserializeJson(doc, f);
            id(mqtt_credential_username) = doc["mqtt_username"] | "";
            id(mqtt_credential_token) = doc["mqtt_token"] | "";
            if (!id(mqtt_credential_username).empty() && !id(mqtt_credential_token).empty()) {
              id(mqtt_credential_registered) = true;
              ESP_LOGI("MQTT_Cred", "Loaded credentials from flash: %s", id(mqtt_credential_username).c_str());
              id(mqtt_client).set_username(id(mqtt_credential_username));
              id(mqtt_client).set_password(id(mqtt_credential_token));
              ESP_LOGI("MQTT_Cred", "Credentials set, enabling MQTT client...");
              id(mqtt_client).disable();
              delay(500);
              id(mqtt_client).enable();
              return;
            }
          }
          ESP_LOGI("MQTT_Cred", "No credentials found, will register after MQTT connects");

  - id: mqtt_register_and_reconnect
    mode: restart
    then:
      - if:
          condition:
            lambda: 'return id(mqtt_credential_registered);'
          then:
            - lambda: 'ESP_LOGI("MQTT_Cred", "Already registered, skipping");'
            - script.stop: mqtt_register_and_reconnect
            - mqtt.enable:
      - lambda: 'ESP_LOGI("MQTT_Cred", "Skipping registration, using existing credentials");'
      # 用旧凭据连接成功 → 注册新凭据
      - http_request.send_async:
          method: POST
          id: http_request_component
          url: ${c987_mqtt_register_url}
          request_headers:
            Content-Type: application/json
          body: !lambda |-
            return std::string("{\"mac\":\"") + id(text_sensor_mac_address).state + std::string("\",\"firmware_version\":\"${lemonade_version}\"}");
          capture_response: true
          max_response_buffer_size: 2kB
          on_response:
            then:
              - lambda: |
                  auto code = response->status_code;
                  if (code != 200) {
                    ESP_LOGE("MQTT_Cred", "Register failed: HTTP %d", code);
                    id(show_notification)->execute("无法连接认证服务器：" + std::to_string(code), "", 0);
                    return;
                  }
                  JsonDocument doc;
                  DeserializationError err = deserializeJson(doc, body);
                  if (err) {
                    ESP_LOGE("MQTT_Cred", "Parse error: %s", err.c_str());
                    return;
                  }
                  std::string username = doc["mqtt_username"] | "";
                  std::string token = doc["mqtt_token"] | "";
                  if (username.empty() || token.empty()) {
                    ESP_LOGE("MQTT_Cred", "Empty credentials in response");
                    id(show_notification)->execute("认证服务器错误", "认证服务器", 0);
                    return;
                  }
                  id(mqtt_credential_username) = username;
                  id(mqtt_credential_token) = token;
                  id(mqtt_credential_registered) = true;
                  // 保存到 flash
                  JsonDocument save;
                  save["mqtt_username"] = username;
                  save["mqtt_token"] = token;
                  std::ofstream f("/data/mqtt_credentials.json", std::ios::trunc);
                  serializeJson(save, f);
                  f.close();
                  ESP_LOGI("MQTT_Cred", "Registered: %s, reconnecting...", username.c_str());
                  id(show_notification)->execute("成功获取 MQTT 凭据", "认证服务器", 5000);
              # 注册成功 → 用新凭据重连
              - lambda: |
                  ESP_LOGI("MQTT_Cred", "Disconnecting to apply new credentials...");
                  id(mqtt_client).set_username(id(mqtt_credential_username));
                  id(mqtt_client).set_password(id(mqtt_credential_token));
                  id(mqtt_client).disable();
                  delay(500);
                  id(mqtt_client).enable();
          on_error:
            then:
              - lambda: 'ESP_LOGE("MQTT_Cred", "Register request failed");'
