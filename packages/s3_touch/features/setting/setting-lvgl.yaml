    - id: system_setting_new_wifi_page
      skip: true
      on_load:
        - lvgl.widget.hide: [btn_back_setting]
        - lvgl.label.update:
            id: lbl_topbar_title
            text: "添加Wi-Fi"
        - lambda: |
            // 清空textarea，因为每次进入这个页面才会有新的SSID
            lv_textarea_set_text(txt_new_wifi_password, "");
      widgets:
        - label:
            id: lbl_new_wifi_ssid
            text: "连接到的Wi-Fi"
            align: TOP_MID
            transform_scale: 1
            x: 0
            y: 40
            text_font: chinese_font14
        - textarea:
            id: txt_new_wifi_password
            align: TOP_MID
            x: 0
            y: 70
            width: 300
            height: 30
            text_font: chinese_font14
            password_mode: true
            one_line: true
            max_length: 63
            placeholder_text: "输入Wi-Fi密码"
            on_ready:
              then:
                - lambda: |
                    // 需要同步到json文件统一操作
                    // ssid和密码
                    std::string ssid = lv_label_get_text(id(lbl_new_wifi_ssid));
                    std::string password = lv_textarea_get_text(id(txt_new_wifi_password));
                    id(append_wifi_to_json)->execute(ssid, password);
                    id(prase_wifi_list)->execute();
                    global_preferences->sync();
                    if (wifi::global_wifi_component != nullptr) {
                      wifi::global_wifi_component->start_scanning();
                    }
                    id(lvgl_1)->show_page(system_setting_wifi_config_page->index, LV_SCR_LOAD_ANIM_MOVE_RIGHT, 200);
                    id(show_notification)->execute("建议重启 Wi-Fi 以获得最佳效果", "", 5000);

        - keyboard:
            id: keyboard_new_wifi_password
            textarea: txt_new_wifi_password
            mode: TEXT_LOWER
            on_cancel:
              then:
                - lvgl.page.show:
                    id: system_setting_wifi_config_page
                    animation: MOVE_RIGHT
                    time: 200ms

    - id: system_setting_notification_page
      skip: true
