    - id: system_setting_update_page
      skip: true
      on_load:
        - lvgl.widget.show: btn_back_setting
        - lvgl.label.update:
            id: lbl_topbar_title
            text: "系统更新"
        - script.execute: render_system_update_page
        - script.execute: check_system_update
      on_unload:
        - lvgl.widget.hide: btn_back_setting
      widgets:
        - label:
            id: lbl_update_summary
            align: TOP_MID
            x: 0
            y: 28
            width: 280
            text_align: LEFT
            text: "当前版本：${lemonade_version}\n最新版本：未知\n状态：尚未检查更新\n检查时间：未检查"
            text_font: chinese_font14
        - button:
            id: btn_check_system_update
            align: TOP_MID
            x: -68
            y: 102
            width: 112
            height: 32
            widgets:
              - label:
                  id: lbl_check_system_update
                  align: CENTER
                  text_font: chinese_font14
                  text: "刷新"
            on_click:
              then:
                - script.execute: check_system_update
        - button:
            id: btn_update_system
            align: TOP_MID
            x: 68
            y: 102
            width: 132
            height: 32
            widgets:
              - label:
                  id: lbl_update_system_action
                  align: CENTER
                  text_font: chinese_font14
                  text: "已是最新版本"
            on_click:
              then:
                - lambda: |
                    std::string target_version = id(setting_update_latest_version);
                    if (target_version.empty() || target_version == "未知") {
                      target_version = "最新版本";
                    }
                    std::string message =
                        std::string("将更新至 ") + target_version +
                        "，系统将暂时无响应(~60s)，请确保电量充足，网络连接稳定。系统将自动重启。";
                    lv_obj_t *msgbox_content = lv_msgbox_get_content(msgbox_update_message);
                    lv_obj_t *msgbox_text =
                        (msgbox_content != nullptr && lv_obj_get_child_count(msgbox_content) > 0)
                            ? lv_obj_get_child(msgbox_content, 0)
                            : nullptr;
                    if (msgbox_text != nullptr) {
                      lv_label_set_text(msgbox_text, message.c_str());
                    }
                - lvgl.widget.show: msgbox_update_message
        - label:
            id: lbl_update_changelog
            align: TOP_MID
            x: 0
            y: 146
            width: 280
            text_align: LEFT
            text: "更新日志\n点击刷新以检查更新日志"
            text_font: chinese_font14

    - id: system_setting_storage_page
      skip: true
      on_load:
        - lvgl.widget.show: btn_back_setting
        - lvgl.label.update:
            id: lbl_topbar_title
            text: "存储设置"
        - lambda: |
            size_t total = 0, used = 0;
            esp_err_t ret = esp_littlefs_info("littlefs", &total, &used);
            if (ret != ESP_OK)
            {
              ESP_LOGE("LittleFS", "Failed to get LittleFS partition information (%s)", esp_err_to_name(ret));
              std::string error_msg = std::string("无法获取内部存储信息：") + std::string(esp_err_to_name(ret));
              lv_label_set_text(id(lbl_littlefs_info), error_msg.c_str());
            }
            else
            {
              ESP_LOGI("LittleFS", "Partition size: total: %d, used: %d", total, used);
              std::string space = std::string("内部存储:\n总空间：") + std::to_string(total / 1024) + std::string("KB\n已用空间：") + std::to_string(used / 1024) + "KB";
              lv_label_set_text(id(lbl_littlefs_info), space.c_str());
            }

            auto total_sd = id(sd_free_space).state;
            auto used_sd = id(sd_used_space).state;
            std::string sd_space = std::string("SD卡:\n总空间：") + std::to_string(total_sd / 1024 / 1024) + std::string("MB\n已用空间：") + std::to_string(used_sd / 1024 / 1024) + "MB";
            lv_label_set_text(id(lbl_sd_info), sd_space.c_str());
      on_unload:
        - lvgl.widget.hide: btn_back_setting
      widgets:
        - label:
            id: lbl_littlefs_info
            align: CENTER
            text_align: CENTER
            width: 100%
            y: -50
            text: "加载中..."
            text_font: chinese_font14
        - label:
            id: lbl_sd_info
            align: CENTER
            text_align: CENTER
            width: 100%
            y: 50
            text: "加载中..."
            text_font: chinese_font14

