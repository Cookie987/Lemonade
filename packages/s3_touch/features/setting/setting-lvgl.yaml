    - id: system_setting_power_page
      skip: true
      on_load:
        - lvgl.widget.show: btn_back_setting
        - lvgl.label.update:
            id: lbl_topbar_title
            text: "电源和电池"
      on_unload:
        - lvgl.widget.hide: btn_back_setting
      widgets:
        - meter:
            id: usb_voltage_meter
            align: center
            x: -70
            y: 0
            width: 140
            height: 140
            widgets:
              - label:
                  id: usb_voltage_text
                  text: "-.--V"
                  align: CENTER
                  y: 25
                  text_font: chinese_font14
              - label:
                  text: "USB电压"
                  align: CENTER
                  y: 45
                  text_font: chinese_font14
            scales:
              - range_from: 0
                range_to: 60
                angle_range: 240
                rotation: 150
                ticks:
                  count: 61
                  length: 5
                  width: 2
                indicators:
                  - line:
                      id: usb_voltage_indicator
                      width: 2
                      color: 0xFF0000
                      length: -4
                  - tick_style:
                      start_value: 0
                      end_value: 60
                      color_start: 0xFF0000
                      color_end: 0xff2aff
              - range_from: 0  # scale for the value labels
                range_to: 6
                angle_range: 240
                rotation: 150
                ticks:
                  width: 1
                  count: 7
                  length: 10
                  color: 0x000000
                  major:
                    stride: 1
                    width: 2
                    length: 10
                    color: 0x404040
                    label_gap: 10
        - meter:
            id: battery_voltage_meter
            align: center
            x: 70
            y: 0
            width: 140
            height: 140
            widgets:
              - label:
                  id: battery_voltage_text
                  text: "-.--V"
                  align: CENTER
                  y: 25
                  text_font: chinese_font14
              - label:
                  text: "电池电压"
                  align: CENTER
                  y: 45
                  text_font: chinese_font14
            scales:
              - range_from: 0
                range_to: 50
                angle_range: 240
                rotation: 150
                ticks:
                  count: 51
                  length: 5
                  width: 2
                indicators:
                  - line:
                      id: battery_voltage_indicator
                      width: 2
                      color: 0xFF0000
                      length: -4
                  - tick_style:
                      start_value: 0
                      end_value: 50
                      color_start: 0xFF0000
                      color_end: 0xff2aff
              - range_from: 0  # scale for the value labels
                range_to: 5
                angle_range: 240
                rotation: 150
                ticks:
                  width: 1
                  count: 6
                  length: 10
                  color: 0x000000
                  major:
                    stride: 1
                    width: 2
                    length: 10
                    color: 0x404040
                    label_gap: 10
