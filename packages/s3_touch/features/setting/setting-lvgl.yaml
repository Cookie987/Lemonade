    # ════════════════════════════════════════════════════════════════════
    # 显示与亮度
    # ════════════════════════════════════════════════════════════════════
    - id: system_setting_display_page
      skip: true
      on_load:
        - script.execute:
            id: statusbar_enter
            title: "显示与亮度"
            back: true
            action: 0
        - lambda: |-
            float brightness = id(backlight).current_values.get_brightness();
            int pct = (int)(brightness * 100.0f + 0.5f);
            if (pct < 10) pct = 10;
            if (pct > 100) pct = 100;
            lv_slider_set_value(id(backlight_slider), pct, LV_ANIM_OFF);
            char buf[8];
            snprintf(buf, sizeof(buf), "%d%%", pct);
            lv_label_set_text(id(lbl_brightness_value), buf);
      widgets:
        - obj:
            x: 0
            y: 22
            width: 320
            height: 218
            styles: [setting_page]
        - obj:
            x: 8
            y: 26
            width: 304
            height: 70
            styles: [setting_card]
            widgets:
              - label:
                  styles: [setting_icon]
                  align: TOP_LEFT
                  x: 12
                  y: 10
                  text: "\uF53F"
              - label:
                  styles: [setting_title]
                  align: TOP_LEFT
                  x: 32
                  y: 10
                  text: "屏幕亮度"
              - label:
                  id: lbl_brightness_value
                  styles: [setting_value]
                  align: TOP_RIGHT
                  x: -12
                  y: 10
                  width: 70
                  text: "100%"
              - slider:
                  id: backlight_slider
                  x: 32
                  y: 44
                  width: 260
                  min_value: 10
                  max_value: 100
                  value: 100
                  on_release:
                    - lambda: global_preferences->sync();
                  on_change:
                    then:
                      - lambda: |-
                          char buf[8];
                          snprintf(buf, sizeof(buf), "%d%%", (int)x);
                          lv_label_set_text(id(lbl_brightness_value), buf);
                      - light.turn_on:
                          id: backlight
                          brightness: !lambda 'return lv_slider_get_value(id(backlight_slider)) / 100.0;'
        - obj:
            x: 8
            y: 104
            width: 304
            height: 132
            styles: [setting_card]
            widgets:
              - obj:
                  styles: [setting_row]
                  x: 0
                  y: 0
                  border_side: BOTTOM
                  border_width: 1
                  border_color: 0xedeff2
                  widgets:
