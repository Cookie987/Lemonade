            height: 218
            styles: [setting_page]
        - obj:
            x: 0
            y: 22
            width: 320
            height: 218
            pad_all: 0
            border_width: 0
            bg_opa: TRANSP
            scroll_dir: VER
            scrollbar_mode: AUTO
            widgets:
              - label:
                  styles: [setting_group]
                  x: 16
                  y: 6
                  text: "颜色"
              # ── 色调 / 亮度 ──
              - obj:
                  x: 8
                  y: 28
                  width: 304
                  height: 132
                  styles: [setting_card]
                  widgets:
                    # 色调
                    - label:
                        styles: [setting_title]
                        x: 14
                        y: 12
                        text: "色调"
                    - label:
                        id: lbl_bottle_hue_value
                        styles: [setting_value]
                        align: TOP_RIGHT
                        x: -14
                        y: 12
                        width: 70
                        text: "0°"
                    - slider:
                        id: bottle_ocean_hue_slider
                        x: 14
                        y: 40
                        width: 276
                        min_value: 0
                        max_value: 360
                        on_release:
                          - lambda: global_preferences->sync();
                        on_change:
                          then:
                            - lambda: |-
                                id(bottle_ocean_hue) = x;
                                char buf[12];
                                snprintf(buf, sizeof(buf), "%d°", (int)x);
                                lv_label_set_text(id(lbl_bottle_hue_value), buf);
                            - lvgl.slider.update:
                                id: bottle_ocean_hue_slider
                                knob:
                                  bg_color: !lambda 'return lv_color_hsv_to_rgb(x, 100, 100);'
                    # 亮度
                    - label:
                        styles: [setting_title]
                        x: 14
                        y: 78
                        text: "亮度"
                    - label:
                        id: lbl_bottle_brightness_value
                        styles: [setting_value]
                        align: TOP_RIGHT
                        x: -14
                        y: 78
                        width: 70
                        text: "100%"
                    - slider:
                        id: bottle_ocean_brightness_slider
                        x: 14
                        y: 106
                        width: 276
                        min_value: 63
                        max_value: 255
                        on_release:
                          - lambda: global_preferences->sync();
                        on_change:
                          then:
                            - lambda: |-
                                float input = x / 255.0f;
                                float corrected = std::pow(input, 2.8f);
                                id(bottle_ocean_brightness) = static_cast<uint8_t>(corrected * 255.0f);
                                int pct = (int)((x - 63) * 100.0f / 192.0f + 0.5f);
                                char buf[12];
                                snprintf(buf, sizeof(buf), "%d%%", pct);
                                lv_label_set_text(id(lbl_bottle_brightness_value), buf);

              - label:
                  styles: [setting_group]
                  x: 16
                  y: 168
                  text: "流体"
              # ── 活跃 / 压力 / 推力 / 液面 ──
              - obj:
                  x: 8
                  y: 190
                  width: 304
                  height: 264
                  styles: [setting_card]
                  widgets:
                    # 活跃
                    - label:
