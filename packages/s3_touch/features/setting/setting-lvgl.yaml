                        align: CENTER
                        text_font: chinese_font14
                        text: "获取 Cookie IoT 背景图片"
                  on_click:
                    then:
                      - lvgl.dropdown.update:
                          id: dropdown_image
                          selected_index: 1
                      - script.execute: get_background_img
              - label:
                  x: 9
                  y: 183
                  text: "颜色反转"
                  text_font: chinese_font14
              - switch:
                  id: switch_invert_color
                  x: 230
                  y: 178
