                        time: 200ms
              # - text: "\uF0F3 通知"
              #   id: btn_notification_setting
              #   list_button: {}
              #   on_click:
              #     then:
              #       - lvgl.page.show:
              #           id: system_setting_notification_page
              #           animation: MOVE_LEFT
              #           time: 200ms
              - text: "\uF7C2 存储"
                id: btn_storage_setting
                list_button: {}
                on_click:
                  then:
                    - lvgl.page.show:
                        id: system_setting_storage_page
                        animation: MOVE_LEFT
                        time: 200ms
              - text: "\uF240 电源和电池"
                id: btn_power_setting
                list_button: {}
                on_click:
                  then:
                    - lvgl.page.show:
                        id: system_setting_power_page
                        animation: MOVE_LEFT
                        time: 200ms
              - text: "\uF1CD 安全和隐私"
                id: btn_security_setting
                list_button: {}
                on_click:
                  then:
                    - lvgl.page.show:
                        id: system_setting_security_page
