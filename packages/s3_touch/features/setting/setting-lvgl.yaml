# ============================================================================
# 设置页（320×240）
#
# 层级：设置首页 → 网络与连接 / 显示与亮度 / 声音 / 电源与电池 / 存储 /
#       安全与隐私 / 系统更新 / 关于 / 瓶中之海
# 骨架：顶栏（返回 + 标题）→ 灰底 → 白色卡片 → 44px 行
# 令牌：见 setting-style.yaml；状态摘要见 setting-script.yaml
# ============================================================================

lvgl:
  msgboxes:
    - id: msgbox_halt_message
      close_button: false
      title: 关闭设备
      text_font: chinese_font14
      body:
        text: "设备将关闭。"
        text_font: chinese_font14
      buttons:
        - id: btn_halt_close
          text: "不"
          on_click:
            then:
              - lvgl.widget.hide: msgbox_halt_message
        - id: btn_halt_ok
          text: "好"
          on_click:
            then:
              - script.execute: halt

    - id: msgbox_restore_network_message
      close_button: false
      title: 恢复默认网络配置
      body:
        text: "此操作将删除当前Wi-Fi配置。"
      buttons:
        - id: btn_restore_network_close
          text: "不"
          on_click:
            then:
              - lvgl.widget.hide: msgbox_restore_network_message
        - id: btn_restore_network_ok
          text: "好"
          on_click:
            then:
              - lvgl.widget.hide: msgbox_restore_network_message
              - script.execute: restore_default_wifi_json

    - id: msgbox_delete_wifi_message
      close_button: false
      title: 删除Wi-Fi
      text_font: chinese_font14
      body:
        text: "你确定删除这个Wi-Fi吗？"
        text_font: chinese_font14
      buttons:
        - id: btn_delete_wifi_close
          text: "不"
          on_click:
            then:
              - lvgl.widget.hide: msgbox_delete_wifi_message
        - id: btn_delete_wifi_ok
          text: "好"
          on_click:
            then:
              - lambda: |
                  lv_obj_t * msgbox_content = lv_msgbox_get_content(msgbox_delete_wifi_message);
                  lv_obj_t * msgbox_text =
                      (msgbox_content != nullptr && lv_obj_get_child_count(msgbox_content) > 0)
                          ? lv_obj_get_child(msgbox_content, 0)
                          : nullptr;
                  const char *txt = msgbox_text != nullptr ? lv_label_get_text(msgbox_text) : nullptr;
                  if (txt == nullptr) {
                      lv_obj_add_flag(msgbox_delete_wifi_message_outer, LV_OBJ_FLAG_HIDDEN);
                      return;
                  }
                  // 提取Wi-Fi名称，格式是 "确定要删除 Wi-Fi名称 吗？"
                  std::string msg = txt;
                  std::string prefix = "确定要删除 ";
                  std::string suffix = " 吗？";

                  size_t start = msg.find(prefix);
                  if (start != std::string::npos)
                  {
                      start += prefix.length();
                      size_t end = msg.find(suffix, start);

                      if (end != std::string::npos)
                      {
                          std::string ssid = msg.substr(start, end - start);
                          id(delete_wifi_from_json)->execute(ssid);
                          id(prase_wifi_list)->execute();
                          lv_obj_add_flag(msgbox_delete_wifi_message_outer, LV_OBJ_FLAG_HIDDEN);
                      }
                  }

    - id: msgbox_update_message
      close_button: false
      title: 系统更新
      text_font: chinese_font14
      body:
        text: "将更新至新系统，系统将暂时无响应(~60s)，请确保电量充足，网络连接稳定。系统将自动重启。"
        text_font: chinese_font14
      buttons:
        - id: btn_update_system_close
          text: "不"
          on_click:
            then:
              - lvgl.widget.hide: msgbox_update_message
        - id: btn_update_system_ok
          text: "好"
          on_click:
            then:
              - lvgl.page.show: page_ota
              - delay: 200ms
              - ota.http_request.flash:
                  md5_url: !lambda |-
                    return id(setting_update_ota_md5_url).empty()
                              ? std::string("127.0.0.1")
                              : id(setting_update_ota_md5_url);
                  url: !lambda |-
                    return id(setting_update_ota_url).empty()
                                ? std::string("127.0.0.1")
                                : id(setting_update_ota_url);

