    # ════════════════════════════════════════════════════════════════════
    # 添加 Wi-Fi
    # ════════════════════════════════════════════════════════════════════
    - id: system_setting_new_wifi_page
      skip: true
      on_load:
        - script.execute:
            id: statusbar_enter
            title: "添加 Wi-Fi"
            back: true
            action: 0
        - lambda: |
            lv_textarea_set_text(txt_new_wifi_password, "");
      widgets:
        - obj:
            x: 0
            y: 22
            width: 320
            height: 218
            styles: [setting_page]
        - label:
            id: lbl_new_wifi_ssid
            styles: [setting_title]
            align: TOP_MID
            y: 30
            text: "连接到的Wi-Fi"
        - label:
            styles: [setting_hint]
            align: TOP_MID
            y: 48
            text: "输入密码后点键盘右下角确认"
        - textarea:
            id: txt_new_wifi_password
            align: TOP_MID
            y: 68
            width: 300
            height: 32
            text_font: chinese_font14
            password_mode: true
            one_line: true
            max_length: 63
            placeholder_text: "输入Wi-Fi密码"
            on_ready:
              then:
                - lambda: |
                    std::string ssid = lv_label_get_text(id(lbl_new_wifi_ssid));
                    std::string password = lv_textarea_get_text(id(txt_new_wifi_password));
                    if (ssid.empty()) {
                      id(lvgl_1)->show_page(system_setting_wifi_config_page->index, LV_SCR_LOAD_ANIM_MOVE_RIGHT, 200);
                      return;
                    }
                    // 保存凭据到 /data/wifilist.json 并立即优先连接该网络
                    id(append_wifi_to_json)->execute(ssid, password);
                    id(wifi_connect_saved)->execute(ssid);
                    id(lvgl_1)->show_page(system_setting_wifi_config_page->index, LV_SCR_LOAD_ANIM_MOVE_RIGHT, 200);
                    global_preferences->sync();
        - keyboard:
            id: keyboard_new_wifi_password
            textarea: txt_new_wifi_password
            mode: TEXT_LOWER
            on_cancel:
              then:
                - lvgl.page.show:
                    id: system_setting_wifi_config_page
                    animation: MOVE_RIGHT
                    time: 200ms

