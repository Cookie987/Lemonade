                        align: LEFT_MID
                        x: 32
                        text: "重新获取背景图"
                    - label:
                        styles: [setting_value]
                        align: RIGHT_MID
                        x: -12
                        width: 60
                        text_color: 0x1f95f6
                        text: "获取"
              - obj:
                  styles: [setting_row]
                  x: 0
                  y: 88
                  widgets:
                    - label:
                        styles: [setting_icon]
                        align: LEFT_MID
                        x: 12
                        text: "\uF042"
                    - label:
                        styles: [setting_title]
                        align: LEFT_MID
                        x: 32
