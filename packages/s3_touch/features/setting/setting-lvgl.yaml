                        x: 32
                        text: "背景图片"
                    - dropdown:
                        id: dropdown_image
                        align: RIGHT_MID
                        x: -12
                        width: 130
                        height: 32
                        symbol: "\uF107"
                        options:
                          - 系统默认
                          - Cookie IoT
                        text_font: chinese_font14
                        on_change:
                          then:
                            - lambda: global_preferences->sync();
                            - if:
                                condition:
                                  lambda: 'return id(dropdown_image).get_selected_text() == "系统默认";'
                                then:
                                  - lvgl.image.update:
                                      id: background_image
                                      src: default_bg
                            - if:
                                condition:
                                  lambda: 'return id(dropdown_image).get_selected_text() == "Cookie IoT";'
                                then:
                                  - script.execute: set_background_img
              - button:
                  styles: [setting_row]
                  x: 0
                  y: 44
                  border_side: BOTTOM
                  border_width: 1
                  border_color: 0xedeff2
                  pressed:
                    bg_color: 0xeef1f4
                  on_click:
                    then:
                      - lvgl.dropdown.update:
                          id: dropdown_image
