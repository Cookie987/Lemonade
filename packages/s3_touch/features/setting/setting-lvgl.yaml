                  max_value: 100
                  value: 100
                  width: 190
                  x: 83
                  y: 38
                  on_release:
                    - lambda: global_preferences->sync();
                  on_change:
                    then:
                      - light.turn_on:
                          id: backlight
                          brightness: !lambda 'return lv_slider_get_value(id(backlight_slider)) / 100.0;'
              - dropdown:
                  id: dropdown_image
                  x: 120
                  y: 73
                  width: 163
                  height: 38
                  symbol: "\uF107"  # angle-down
                  options:
                    - 系统默认
                    - Cookie IoT
                  text_font: chinese_font14
                  on_change:
                    then:
                      - lambda: global_preferences->sync();
                      - if:
                          condition:
                            lambda: 'return id(dropdown_image).get_selected_text() == "系统默认";'
                          then:
                            - lvgl.image.update:
                                id: background_image
                                src: default_bg
                      - if:
                          condition:
                            lambda: 'return id(dropdown_image).get_selected_text() == "Cookie IoT";'
                          then:
                            - script.execute: set_background_img
              - label:
                  x: 9
                  y: 83
                  text: "背景图片"
                  text_font: chinese_font14
              - button:
                  id: btn_get_background_img
