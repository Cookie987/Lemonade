                                snprintf(buf, sizeof(buf), "%d%%", (int)x);
                                lv_label_set_text(id(lbl_bottle_flip_value), buf);
                    # 压力
                    - label:
                        styles: [setting_title]
                        x: 14
                        y: 78
                        text: "压力"
                    - label:
                        id: lbl_bottle_pressure_value
                        styles: [setting_value]
                        align: TOP_RIGHT
                        x: -14
                        y: 78
                        width: 70
                        text: "10"
                    - slider:
                        id: bottle_ocean_pressure_slider
                        x: 14
                        y: 106
                        width: 276
                        min_value: 1
                        max_value: 50
                        on_release:
                          - lambda: global_preferences->sync();
                        on_change:
                          then:
                            - lambda: |-
                                id(bottle_ocean_pressure) = (float)x;
                                char buf[12];
                                snprintf(buf, sizeof(buf), "%d", (int)x);
