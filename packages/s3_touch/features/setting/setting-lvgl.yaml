              - label:
                  id: lbl_update_system_action
                  align: CENTER
                  styles: [setting_title]
                  text_color: 0xffffff
                  text: "已是最新版本"
            on_click:
              then:
                - lambda: |
                    std::string target_version = id(setting_update_latest_version);
                    if (target_version.empty() || target_version == "未知") {
                      target_version = "最新版本";
                    }
                    std::string message =
                        std::string("将更新至 ") + target_version +
                        "，系统将暂时无响应(~60s)，请确保电量充足，网络连接稳定。系统将自动重启。";
                    lv_obj_t *msgbox_content = lv_msgbox_get_content(msgbox_update_message);
                    lv_obj_t *msgbox_text =
                        (msgbox_content != nullptr && lv_obj_get_child_count(msgbox_content) > 0)
                            ? lv_obj_get_child(msgbox_content, 0)
                            : nullptr;
                    if (msgbox_text != nullptr) {
                      lv_label_set_text(msgbox_text, message.c_str());
                    }
                - lvgl.widget.show: msgbox_update_message

    # ════════════════════════════════════════════════════════════════════
    # 存储
    # ════════════════════════════════════════════════════════════════════
    - id: system_setting_storage_page
      skip: true
      on_load:
        - script.execute:
            id: statusbar_enter
            title: "存储"
            back: true
            action: 0
        - lambda: |
            size_t total = 0, used = 0;
            esp_err_t ret = esp_littlefs_info("littlefs", &total, &used);
            char buf[64];
            if (ret != ESP_OK)
            {
              lv_label_set_text(id(lbl_littlefs_summary), "无法读取");
              snprintf(buf, sizeof(buf), "%s", esp_err_to_name(ret));
              lv_label_set_text(id(lbl_littlefs_free), buf);
              lv_bar_set_value(id(bar_littlefs), 0, LV_ANIM_OFF);
            }
            else
            {
              int pct = total > 0 ? (int)(used * 100 / total) : 0;
              snprintf(buf, sizeof(buf), "%.1f MB / %.1f MB",
                       used / 1048576.0f, total / 1048576.0f);
              lv_label_set_text(id(lbl_littlefs_summary), buf);
              snprintf(buf, sizeof(buf), "剩余 %.1f MB 可用",
                       (total - used) / 1048576.0f);
              lv_label_set_text(id(lbl_littlefs_free), buf);
              lv_bar_set_value(id(bar_littlefs), pct, LV_ANIM_OFF);
            }

            float sd_free = id(sd_free_space).state;
            float sd_used = id(sd_used_space).state;
            float sd_total = sd_free + sd_used;
            if (!(sd_total > 0.0f))
            {
              lv_label_set_text(id(lbl_sd_summary), "未检测到 SD 卡");
              lv_label_set_text(id(lbl_sd_free), "插入存储卡后可查看容量");
              lv_bar_set_value(id(bar_sd), 0, LV_ANIM_OFF);
            }
            else
            {
              int pct = (int)(sd_used * 100.0f / sd_total + 0.5f);
              snprintf(buf, sizeof(buf), "%.1f GB / %.1f GB",
                       sd_used / 1073741824.0f, sd_total / 1073741824.0f);
              lv_label_set_text(id(lbl_sd_summary), buf);
              snprintf(buf, sizeof(buf), "剩余 %.1f GB 可用",
                       sd_free / 1073741824.0f);
              lv_label_set_text(id(lbl_sd_free), buf);
              lv_bar_set_value(id(bar_sd), pct, LV_ANIM_OFF);
            }
      widgets:
        - obj:
            x: 0
            y: 22
            width: 320
            height: 218
            styles: [setting_page]
        - obj:
            x: 8
            y: 26
            width: 304
            height: 86
            styles: [setting_card]
            widgets:
              - label:
                  styles: [setting_icon]
                  align: TOP_LEFT
                  x: 12
                  y: 10
                  text: "\uF0A0"
              - label:
                  styles: [setting_title]
                  align: TOP_LEFT
                  x: 32
                  y: 10
                  text: "内部存储"
              - label:
                  id: lbl_littlefs_summary
                  styles: [setting_value]
                  align: TOP_RIGHT
                  x: -12
                  y: 10
                  width: 160
                  text: "--"
              - bar:
                  id: bar_littlefs
                  x: 12
                  y: 44
                  width: 280
                  height: 6
                  radius: 3
                  min_value: 0
                  max_value: 100
                  value: 0
                  animated: false
              - label:
                  id: lbl_littlefs_free
                  styles: [setting_hint]
                  x: 12
                  y: 58
                  text: "剩余 --"
        - obj:
            x: 8
            y: 120
            width: 304
            height: 86
            styles: [setting_card]
            widgets:
              - label:
                  styles: [setting_icon]
                  align: TOP_LEFT
                  x: 12
                  y: 10
                  text: "\uF7C2"
              - label:
                  styles: [setting_title]
                  align: TOP_LEFT
                  x: 32
                  y: 10
                  text: "SD 卡"
              - label:
                  id: lbl_sd_summary
                  styles: [setting_value]
                  align: TOP_RIGHT
                  x: -12
                  y: 10
                  width: 160
                  text: "--"
              - bar:
                  id: bar_sd
                  x: 12
                  y: 44
                  width: 280
                  height: 6
                  radius: 3
                  min_value: 0
                  max_value: 100
                  value: 0
                  animated: false
              - label:
                  id: lbl_sd_free
                  styles: [setting_hint]
                  x: 12
                  y: 58
                  text: "剩余 --"

