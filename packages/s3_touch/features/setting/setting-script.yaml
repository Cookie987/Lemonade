globals:
  - id: setting_update_checking
    type: bool
    restore_value: no
    initial_value: 'false'
  - id: setting_update_has_update
    type: bool
    restore_value: no
    initial_value: 'false'
  - id: setting_update_latest_version
    type: std::string
    restore_value: no
    initial_value: '"未知"'
  - id: setting_update_status_text
    type: std::string
    restore_value: no
    initial_value: '"尚未检查更新"'
  - id: setting_update_checked_at
    type: std::string
    restore_value: no
    initial_value: '"未检查"'
  - id: setting_update_changelog
    type: std::string
    restore_value: no
    initial_value: '"点击刷新以检查更新日志"'
  - id: setting_update_ota_url
    type: std::string
    restore_value: no
  - id: setting_update_ota_md5_url
    type: std::string
    restore_value: no

script:
  - id: render_system_update_page
    mode: restart
    then:
      - lambda: |
          std::string latest_version = id(setting_update_latest_version);
          if (latest_version.empty()) {
            latest_version = "未知";
          }

          std::string status_text = id(setting_update_status_text);
          if (status_text.empty()) {
            status_text = "尚未检查更新";
          }

          std::string checked_at = id(setting_update_checked_at);
          if (checked_at.empty()) {
            checked_at = "未检查";
          }

          std::string summary =
              std::string("当前版本：${lemonade_version}\n") +
              "最新版本：" + latest_version + "\n" +
              "状态：" + status_text + "\n" +
              "检查时间：" + checked_at;
          lv_label_set_text(id(lbl_update_summary), summary.c_str());

          std::string changelog = id(setting_update_changelog);
          std::string changelog_view;
          changelog_view.reserve(changelog.size());
          int lines = 0;
          for (char c : changelog) {
            if (c == '\r') {
              continue;
            }
            if (c == '\n') {
              lines++;
              if (lines >= 7) {
                break;
              }
            }
            if (changelog_view.size() >= 260) {
              break;
            }
            changelog_view.push_back(c);
          }
          if (changelog_view.empty()) {
            changelog_view = "暂无更新日志";
          } else if (changelog_view.size() < changelog.size()) {
            changelog_view += "\n...";
          }
          lv_label_set_text(
              id(lbl_update_changelog),
              (std::string("更新日志\n") + changelog_view).c_str());

          if (id(setting_update_checking)) {
            lv_label_set_text(id(lbl_check_system_update), "检查中...");
            lv_obj_add_state(id(btn_check_system_update), LV_STATE_DISABLED);
            lv_label_set_text(id(lbl_update_system_action), "准备中...");
            lv_obj_add_state(id(btn_update_system), LV_STATE_DISABLED);
            return;
          }

          lv_label_set_text(id(lbl_check_system_update), "刷新");
          lv_obj_clear_state(id(btn_check_system_update), LV_STATE_DISABLED);

          if (id(setting_update_has_update)) {
            lv_label_set_text(
                id(lbl_update_system_action),
                (std::string("安装 ") + latest_version).c_str());
            lv_obj_clear_state(id(btn_update_system), LV_STATE_DISABLED);
          } else {
            lv_label_set_text(id(lbl_update_system_action), "已是最新版本");
            lv_obj_add_state(id(btn_update_system), LV_STATE_DISABLED);
          }

  - id: check_system_update
    mode: restart
    then:
      - lambda: |
          id(setting_update_checking) = true;
          id(setting_update_has_update) = false;
          id(setting_update_status_text) = "正在检查更新...";
          id(setting_update_checked_at) = "进行中";
          id(setting_update_changelog) = "正在从服务器获取更新日志...";
      - script.execute: render_system_update_page
      - if:
          condition:
            wifi.connected:
          then:
            - http_request.send_async:
                method: GET
                id: http_request_component
                url: ${lemonade_update_info_url}
                capture_response: true
                max_response_buffer_size: 4kB
                on_response:
                  then:
                    - lambda: |
                        auto mark_checked_now = [&]() {
                          auto now = id(ntp_time).now();
                          if (now.is_valid()) {
                            id(setting_update_checked_at) = now.strftime("%Y-%m-%d %H:%M:%S");
                          } else {
                            id(setting_update_checked_at) = "刚刚";
                          }
                        };
                        auto read_string = [](JsonVariantConst root, std::initializer_list<const char *> keys) {
                          for (const char *key : keys) {
                            if (!root[key].isNull()) {
                              return root[key].as<std::string>();
                            }
                          }
                          return std::string();
                        };

                        id(setting_update_checking) = false;
                        mark_checked_now();

                        if (response->status_code != 200) {
                          id(setting_update_latest_version) = "未知";
                          id(setting_update_status_text) =
                              std::string("检查失败（HTTP ") + std::to_string(response->status_code) + ")";
                          id(setting_update_changelog) = "请确认更新接口地址和服务器状态。";
                          return;
                        }

                        JsonDocument doc;
                        DeserializationError error = deserializeJson(doc, body);
                        if (error) {
                          id(setting_update_latest_version) = "未知";
                          id(setting_update_status_text) = "更新信息解析失败";
                          id(setting_update_changelog) =
                              std::string("JSON 解析失败：") + error.c_str();
                          return;
                        }

                        JsonVariantConst root = doc.as<JsonVariantConst>();
                        std::string latest_version =
                            read_string(root, {"latest_version", "version", "tag_name", "name"});
                        std::string changelog =
                            read_string(root, {"changelog", "release_notes", "body", "description"});
                        std::string ota_url =
                            read_string(root, {"ota_url", "firmware_url", "url"});
                        std::string md5_url =
                            read_string(root, {"md5_url", "ota_md5_url"});

                        if (root["ota"].is<JsonObjectConst>()) {
                          JsonVariantConst ota = root["ota"].as<JsonVariantConst>();
                          if (ota_url.empty()) {
                            ota_url = read_string(ota, {"url", "ota_url", "firmware_url"});
                          }
                          if (md5_url.empty()) {
                            md5_url = read_string(ota, {"md5_url", "ota_md5_url"});
                          }
                        }

                        if (changelog.empty() && root["changes"].is<JsonArrayConst>()) {
                          bool first_line = true;
                          for (JsonVariantConst item : root["changes"].as<JsonArrayConst>()) {
                            std::string line = item.as<std::string>();
                            if (line.empty()) {
                              continue;
                            }
                            if (!first_line) {
                              changelog += "\n";
                            }
                            changelog += "- " + line;
                            first_line = false;
                          }
                        }

                        if (latest_version.empty()) {
                          latest_version = "未知";
                        }
                        if (changelog.empty()) {
                          changelog = "暂无更新日志";
                        }

                        id(setting_update_latest_version) = latest_version;
                        id(setting_update_changelog) = changelog;
                        id(setting_update_ota_url) = ota_url;
                        id(setting_update_ota_md5_url) = md5_url;

                        bool has_update =
                            latest_version != "未知" &&
                            latest_version != std::string("${lemonade_version}");
                        id(setting_update_has_update) = has_update;
                        if (has_update) {
                          id(setting_update_status_text) =
                              std::string("发现新版本 ") + latest_version;
                          id(show_notification)->execute(
                              std::string("发现新版本 ") + latest_version, "", 4000);
                        } else {
                          id(setting_update_status_text) = "当前已是最新版本";
                        }
                    - script.execute: render_system_update_page
                on_error:
                  then:
                    - lambda: |
                        id(setting_update_checking) = false;
                        id(setting_update_has_update) = false;
                        id(setting_update_latest_version) = "未知";
                        id(setting_update_status_text) = "检查更新失败";
                        id(setting_update_changelog) =
                            "请确认网络连接、证书配置或更新接口地址。";
                        auto now = id(ntp_time).now();
                        if (now.is_valid()) {
                          id(setting_update_checked_at) = now.strftime("%Y-%m-%d %H:%M:%S");
                        } else {
                          id(setting_update_checked_at) = "刚刚";
                        }
                    - script.execute: render_system_update_page
          else:
            - lambda: |
                id(setting_update_checking) = false;
                id(setting_update_has_update) = false;
                id(setting_update_latest_version) = "未知";
                id(setting_update_status_text) = "Wi-Fi 未连接";
                id(setting_update_changelog) = "连接网络后可检查最新版本和更新日志。";
                auto now = id(ntp_time).now();
                if (now.is_valid()) {
                  id(setting_update_checked_at) = now.strftime("%Y-%m-%d %H:%M:%S");
                } else {
                  id(setting_update_checked_at) = "刚刚";
                }
            - script.execute: render_system_update_page

  - id: restore_default_wifi_json
    mode: queued
    then:
      - lambda: |
          static const char *const DEFAULT_WIFI_JSON =
              "{\"statusCode\":200,\"error\":null,\"wifis\":[{\"ssid\":\"SEEWO\",\"password\":\"SEEWOSEEWO\"}]}";
          std::ofstream file("/data/wifilist.json");
          if (!file.is_open()) {
            ESP_LOGE("CookieIoT", "Failed to open /data/wifilist.json for reset");
            lv_label_set_text(lbl_wifi_get_info, "恢复默认网络配置失败：无法写入文件");
            return;
          }
          file << DEFAULT_WIFI_JSON;
          file.close();
          ESP_LOGI("CookieIoT", "Restored default WiFi config");
      - script.execute: prase_wifi_list

  - id: append_wifi_to_json
    mode: queued
    parameters:
      ssid: string
      password: string
    then:
      - lambda: |
          auto trim_copy = [](std::string value) {
            size_t start = value.find_first_not_of(" \t\r\n");
            if (start == std::string::npos) {
              return std::string();
            }
            size_t end = value.find_last_not_of(" \t\r\n");
            return value.substr(start, end - start + 1);
          };

          std::string normalized_ssid = trim_copy(ssid);
          std::string normalized_password = password;
          if (normalized_ssid.empty()) {
            ESP_LOGW("CookieIoT", "Skip append_wifi_to_json: empty SSID");
            return;
          }

          JsonDocument doc;
          bool loaded_existing = false;
          std::ifstream file("/data/wifilist.json");
          if (file.is_open()) {
            std::string config_json((std::istreambuf_iterator<char>(file)), std::istreambuf_iterator<char>());
            file.close();
            if (!config_json.empty()) {
              DeserializationError error = deserializeJson(doc, config_json);
              if (error) {
                ESP_LOGW("CookieIoT", "Failed to parse existing wifilist.json: %s", error.c_str());
              } else {
                loaded_existing = true;
              }
            }
          } else {
            ESP_LOGW("CookieIoT", "Config file not found, recreating /data/wifilist.json");
          }

          if (!loaded_existing) {
            doc["statusCode"] = 200;
            doc["error"] = nullptr;
            doc["wifis"].to<JsonArray>();
          }

          doc["statusCode"] = 200;
          doc["error"] = nullptr;
          JsonArray wifis;
          if (doc["wifis"].is<JsonArray>()) {
            wifis = doc["wifis"].as<JsonArray>();
          } else {
            wifis = doc["wifis"].to<JsonArray>();
          }

          bool updated = false;
          for (JsonObject item : wifis) {
            std::string current_ssid = item["ssid"] | "";
            if (trim_copy(current_ssid) == normalized_ssid) {
              item["ssid"] = normalized_ssid;
              item["password"] = normalized_password;
              updated = true;
              ESP_LOGI("CookieIoT", "Updated WiFi: %s", normalized_ssid.c_str());
              break;
            }
          }

          if (!updated) {
            JsonObject new_wifi = wifis.add<JsonObject>();
            new_wifi["ssid"] = normalized_ssid;
            new_wifi["password"] = normalized_password;
            ESP_LOGI("CookieIoT", "Added WiFi: %s", normalized_ssid.c_str());
          }

          std::string output;
          serializeJson(doc, output);
          std::ofstream output_file("/data/wifilist.json");
          if (!output_file.is_open()) {
            ESP_LOGE("CookieIoT", "Failed to open /data/wifilist.json for write");
            return;
          }
          output_file << output;
          output_file.close();

  - id: delete_wifi_from_json
    mode: queued
    parameters:
      ssid: string
    then:
      - lambda: |
          if (ssid.empty()) {
            ESP_LOGW("CookieIoT", "Skip delete_wifi_from_json: empty SSID");
            return;
          }

          JsonDocument doc;
          std::ifstream file("/data/wifilist.json");
          if (!file.is_open()) {
            ESP_LOGW("CookieIoT", "Config file not found.");
            return;
          }

          std::string config_json((std::istreambuf_iterator<char>(file)), std::istreambuf_iterator<char>());
          file.close();

          DeserializationError error = deserializeJson(doc, config_json);
          if (error) {
            ESP_LOGW("CookieIoT", "Failed to parse JSON: %s", error.c_str());
            return;
          }

          JsonArray wifis;
          if (doc["wifis"].is<JsonArray>()) {
            wifis = doc["wifis"].as<JsonArray>();
          } else {
            wifis = doc["wifis"].to<JsonArray>();
          }
          bool deleted = false;
          for (JsonArray::iterator it = wifis.begin(); it != wifis.end(); ++it) {
            std::string current_ssid = (*it)["ssid"] | "";
            if (current_ssid == ssid) {
              wifis.remove(it);
              deleted = true;
              ESP_LOGI("CookieIoT", "Deleted WiFi: %s", ssid.c_str());
              break;
            }
          }

          if (!deleted) {
            ESP_LOGW("CookieIoT", "WiFi not found in JSON: %s", ssid.c_str());
          }

          std::string output;
          serializeJson(doc, output);
          std::ofstream output_file("/data/wifilist.json");
          if (!output_file.is_open()) {
            ESP_LOGE("CookieIoT", "Failed to open /data/wifilist.json for write");
            return;
          }
          output_file << output;
          output_file.close();

  - id: prase_wifi_list
    then:
      - lambda: |
          auto wifi = wifi::global_wifi_component;
          if (wifi == nullptr) {
            ESP_LOGE("CookieIoT", "WiFi component unavailable");
            lv_label_set_text(lbl_wifi_get_info, "WiFi组件不可用");
            return;
          }

          // wifi 组件直接从 /data/wifilist.json 读取凭据
          wifi->reload_saved_wifi_stas();

          lv_label_set_text(lbl_wifi_get_info, "WiFi 已刷新");
      - script.execute: refresh_wifi_list

  - id: refresh_wifi_list
    then:
      - lambda: |
          auto wifi = wifi::global_wifi_component;
          if (wifi == nullptr) {
            ESP_LOGW("Setting", "Skip refresh_wifi_list: wifi component unavailable");
            return;
          }

          lv_obj_t *list_obj = id(list_scanned_wifi);
          if (list_obj == nullptr || !lv_obj_is_valid(list_obj)) {
            ESP_LOGW("Setting", "Skip refresh_wifi_list: list_scanned_wifi invalid (%p)", list_obj);
            return;
          }

          auto trim_copy = [](std::string value) {
            size_t start = value.find_first_not_of(" \t\r\n");
            if (start == std::string::npos) {
              return std::string();
            }
            size_t end = value.find_last_not_of(" \t\r\n");
            return value.substr(start, end - start + 1);
          };
          auto has_suffix = [](const std::string &value, const std::string &suffix) {
            return value.size() >= suffix.size() &&
                   value.compare(value.size() - suffix.size(), suffix.size(), suffix) == 0;
          };
          auto strip_status_suffix = [&](std::string value) {
            value = trim_copy(value);
            static const char *const suffixes[] = {"(已连接)", "(已保存)"};
            for (const char *suffix : suffixes) {
              std::string marker = std::string(" ") + suffix;
              if (has_suffix(value, marker)) {
                value.erase(value.size() - marker.size());
                break;
              }
            }
            return trim_copy(value);
          };
          auto extract_ssid = [&](const std::string &value) {
            std::string cleaned = strip_status_suffix(value);
            size_t pos = cleaned.find_last_of(':');
            if (pos != std::string::npos) {
              cleaned = cleaned.substr(0, pos);
            }
            return trim_copy(cleaned);
          };
          auto is_saved_ssid = [&](const std::string &ssid_value) {
            for (const auto &ap : wifi->get_sta_list()) {
              if (ap.get_ssid() == ssid_value) {
                return true;
              }
            }
            return false;
          };

          struct WifiEntry {
            std::string raw;
            std::string ssid;
            int rssi;
            bool saved;
            bool connected;
          };

          std::string connected_ssid = id(ssid).state;
          std::string wifi_list = id(wifi_scan_results).state;
          std::vector<WifiEntry> entries;

          size_t start = 0;
          while (start <= wifi_list.size()) {
            size_t end = wifi_list.find('\n', start);
            std::string line = end == std::string::npos ? wifi_list.substr(start) : wifi_list.substr(start, end - start);
            start = end == std::string::npos ? wifi_list.size() + 1 : end + 1;

            line = trim_copy(line);
            if (line.empty()) {
              continue;
            }

            std::string current_ssid = extract_ssid(line);
            if (current_ssid.empty()) {
              continue;
            }

            int rssi_value = -127;
            size_t colon_pos = line.find_last_of(':');
            if (colon_pos != std::string::npos) {
              std::string rssi_text = trim_copy(line.substr(colon_pos + 1));
              int parsed_rssi = -127;
              if (sscanf(rssi_text.c_str(), "%d", &parsed_rssi) == 1) {
                rssi_value = parsed_rssi;
              }
            }

            bool connected = !connected_ssid.empty() && current_ssid == connected_ssid;
            bool saved = is_saved_ssid(current_ssid);
            entries.push_back({line, current_ssid, rssi_value, saved, connected});
          }

          std::sort(entries.begin(), entries.end(), [](const WifiEntry &a, const WifiEntry &b) {
            if (a.connected != b.connected) {
              return a.connected > b.connected;
            }
            if (a.rssi != b.rssi) {
              return a.rssi > b.rssi;
            }
            return a.ssid < b.ssid;
          });

          lv_obj_clean(list_obj);
          lv_list_add_text(list_obj, "扫描到的Wi-Fi");
          if (entries.empty()) {
            lv_list_add_text(list_obj, "暂无扫描结果");
            return;
          }

          for (const auto &entry : entries) {
            std::string display_text = entry.raw;
            if (entry.connected) {
              display_text += " (已连接)";
            } else if (entry.saved) {
              display_text += " (已保存)";
            }

            lv_obj_t *btn = lv_list_add_btn(list_obj, NULL, display_text.c_str());
            lv_obj_add_event_cb(
                btn,
                [](lv_event_t *e) {
                  auto trim_copy = [](std::string value) {
                    size_t start = value.find_first_not_of(" \t\r\n");
                    if (start == std::string::npos) {
                      return std::string();
                    }
                    size_t end = value.find_last_not_of(" \t\r\n");
                    return value.substr(start, end - start + 1);
                  };
                  auto has_suffix = [](const std::string &value, const std::string &suffix) {
                    return value.size() >= suffix.size() &&
                           value.compare(value.size() - suffix.size(), suffix.size(), suffix) == 0;
                  };
                  auto strip_status_suffix = [&](std::string value) {
                    value = trim_copy(value);
                    static const char *const suffixes[] = {"(已连接)", "(已保存)"};
                    for (const char *suffix : suffixes) {
                      std::string marker = std::string(" ") + suffix;
                      if (has_suffix(value, marker)) {
                        value.erase(value.size() - marker.size());
                        break;
                      }
                    }
                    return trim_copy(value);
                  };
                  auto extract_ssid = [&](const std::string &value) {
                    std::string cleaned = strip_status_suffix(value);
                    size_t pos = cleaned.find_last_of(':');
                    if (pos != std::string::npos) {
                      cleaned = cleaned.substr(0, pos);
                    }
                    return trim_copy(cleaned);
                  };

                  lv_obj_t *target_btn = static_cast<lv_obj_t *>(lv_event_get_target(e));
                  if (target_btn == nullptr) {
                    return;
                  }
                  lv_obj_t *parent = lv_obj_get_parent(target_btn);
                  if (parent == nullptr) {
                    return;
                  }

                  const char *txt = lv_list_get_btn_text(parent, target_btn);
                  if (txt == nullptr) {
                    return;
                  }

                  std::string selected_text = txt;
                  std::string selected_ssid = extract_ssid(selected_text);
                  if (selected_ssid.empty()) {
                    return;
                  }

                  bool managed_wifi = selected_text.find("(已保存)") != std::string::npos ||
                                      selected_text.find("(已连接)") != std::string::npos;
                  if (managed_wifi) {
                    lv_obj_t *msgbox_content = lv_msgbox_get_content(msgbox_delete_wifi_message);
                    lv_obj_t *msgbox_text =
                        (msgbox_content != nullptr && lv_obj_get_child_count(msgbox_content) > 0)
                            ? lv_obj_get_child(msgbox_content, 0)
                            : nullptr;
                    if (msgbox_text != nullptr) {
                      lv_label_set_text(msgbox_text, (std::string("确定要删除 ") + selected_ssid + " 吗？").c_str());
                    }
                    lv_obj_clear_flag(msgbox_delete_wifi_message_outer, LV_OBJ_FLAG_HIDDEN);
                    lv_obj_move_foreground(msgbox_delete_wifi_message_outer);
                    return;
                  }

                  ESP_LOGD("Setting", "Going to password input for Wi-Fi: %s", selected_ssid.c_str());
                  lv_label_set_text(lbl_new_wifi_ssid, selected_ssid.c_str());
                  id(lvgl_1)->show_page(system_setting_new_wifi_page->index, LV_SCR_LOAD_ANIM_MOVE_LEFT, 200);
                },
                LV_EVENT_CLICKED,
                NULL);
          }
