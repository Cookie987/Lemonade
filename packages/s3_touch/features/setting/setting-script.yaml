script:
  - id: append_wifi_to_json
    mode: queued
    parameters:
      ssid: string
      password: string
    then:
      - lambda: |
          ESP_LOGD("CookieIoT", "Started parsing wifilist.json");
          std::ifstream file("/data/wifilist.json");
          if (!file.is_open()) {
              ESP_LOGW("CookieIoT", "Config file not found.");
          }
          std::string line;
          std::string config_json;
          while (std::getline(file, line)) {
              config_json += line + "\n";
          }
          file.close();

          // 2. 分配 JsonDocument
          // 建议根据 JSON 大小预估内存，或者在 V7 中直接使用 JsonDocument doc;
          JsonDocument doc;

          // 3. 反序列化 (解析) 字符串
          DeserializationError error = deserializeJson(doc, config_json);

          if (error) {
              // 解析失败处理
              ESP_LOGW("CookieIoT", "Failed to parse JSON: %s", error.c_str());
              return;
          }

          // 4. 获取 wifis 数组
          // 如果 wifis 不存在，doc["wifis"].to<JsonArray>() 会创建一个
          JsonArray wifis = doc["wifis"].as<JsonArray>();

          // 5. 创建新的 WiFi 对象并添加到数组中
          JsonObject newWifi = wifis.add<JsonObject>();
          newWifi["ssid"] = ssid;
          newWifi["password"] = password;

          ESP_LOGI("CookieIoT", "Added WiFi: %s", ssid.c_str());
          // 6. 将修改后的对象序列化回 std::string
          std::string output;
          serializeJson(doc, output);

          // 7. 将修改后的对象写入文件
          std::ofstream file1("/data/wifilist.json");
          file1 << output;
          file1.close();

  - id: delete_wifi_from_json
    mode: queued
    parameters:
      ssid: string
    then:
      - lambda: |
          // 1. 解析原始字符串
          ESP_LOGD("CookieIoT", "Started parsing wifilist.json");
          std::ifstream file("/data/wifilist.json");
          if (!file.is_open()) {
              ESP_LOGW("CookieIoT", "Config file not found.");
          }
          std::string line;
          std::string config_json;
          while (std::getline(file, line)) {
              config_json += line + "\n";
          }
          file.close();
          JsonDocument doc;
          DeserializationError error = deserializeJson(doc, config_json);
          if (error) {
              ESP_LOGW("CookieIoT", "Failed to parse JSON: %s", error.c_str());
              return; // 解析失败
          }

          // 2. 获取 wifis 数组
          JsonArray wifis = doc["wifis"].as<JsonArray>();

          // 3. 遍历并查找匹配项
          // 注意：使用迭代器进行删除是最安全的方式
          for (JsonArray::iterator it = wifis.begin(); it != wifis.end(); ++it) {
              // 检查当前对象的 "ssid" 是否匹配
              if ((*it)["ssid"] == ssid) {
                  wifis.remove(it); // 找到匹配项并删除
                  ESP_LOGI("CookieIoT", "Deleted WiFi: %s", ssid.c_str());
                  break;            // 如果只需删除第一个匹配项，直接跳出循环
              }
          }

          // 4. 将结果序列化回字符串
          std::string output;
          serializeJson(doc, output);

          // 7. 将修改后的对象写入文件
          std::ofstream file1("/data/wifilist.json");
          file1 << output;
          file1.close();

  - id: prase_wifi_list
    then:
      - lambda: |
          // 读取Wi-Fi配置文件
          ESP_LOGD("CookieIoT", "Started parsing wifilist.json");
          std::ifstream file("/data/wifilist.json");
          if (!file.is_open()) {
              ESP_LOGW("CookieIoT", "Config file not found.");
          }
          std::string line;
          std::string config_json;
          while (std::getline(file, line)) {
              config_json += line + "\n";
          }
          file.close();
          ESP_LOGD("CookieIoT", "Config file content:\n%s", config_json.c_str());
          json::parse_json(config_json, [&](JsonVariant root) -> bool {
            if (root["statusCode"] == 200){
              ESP_LOGI("CookieIoT", "Clearing WiFi STA");
              auto wifi = wifi::global_wifi_component;
              wifi->clear_saved_wifi_stas();
              JsonArray wifis = root["wifis"];
              int i = 0;
              for (JsonObject item : wifis) {
                wifi->append_wifi_sta(item["ssid"].as<std::string>(), item["password"].as<std::string>());
                ESP_LOGI("CookieIoT", "Saved WiFi STA: %s", item["ssid"].as<std::string>().c_str());
                i++;
              }
              global_preferences->sync();
              lv_label_set_text(lbl_wifi_get_info,(
                                std::string("保存了") +
                                std::to_string(i) +
                                std::string("个WiFi。请关闭并重新打开WiFi")).c_str());
            }
            return true;
          });

  - id: refresh_wifi_list
    then:
      - lambda: |
          auto wifi = wifi::global_wifi_component;
          auto &saved_wifis = wifi->get_sta_list();
          for (const auto &ap : saved_wifis) {
            ESP_LOGD("Setting", "Saved SSID: %s", ap.get_ssid().c_str());
          }
          ESP_LOGD("Setting", "Connected Wi-Fi SSID: %s", id(ssid).state.c_str());
          // 获取扫描结果
          ESP_LOGD("Setting", "Wi-Fi Scan Results: %s\n", id(wifi_scan_results).state.c_str());
          lv_obj_t *list_obj = id(list_scanned_wifi);
          if (list_obj == nullptr || !lv_obj_is_valid(list_obj)) {
            ESP_LOGW("Setting", "Skip refresh_wifi_list: list_scanned_wifi invalid (%p)", list_obj);
            return;
          }
          lv_obj_clean(list_obj);
          ESP_LOGD("Setting", "Cleaned list_scanned_wifi.");
          lv_list_add_text(list_obj, "扫描到的Wi-Fi");
          std::string wifi_list = id(wifi_scan_results).state;
          struct WifiEntry {
              std::string line;
              int rssi;
          };
          std::vector<WifiEntry> wifis;
          size_t start = 0, end = 0;

          // 1. 获取当前已连接的 SSID
          std::string connected_ssid = id(ssid).state;

          // 2. 解析数据并提取 RSSI
          while ((end = wifi_list.find('\n', start)) != std::string::npos) {
              std::string line = wifi_list.substr(start, end - start);
              if (line.length() > 2) {
                  int rssi_val = -100;
                  size_t colon_pos = line.find_last_of(':');
                  if (colon_pos != std::string::npos) {
                      sscanf(line.c_str() + colon_pos + 1, "%d", &rssi_val);
                  }
                  wifis.push_back({line, rssi_val});
              }
              start = end + 1;
          }

          // 3. 排序：已连接的 Wi-Fi 强制排在第一，其他的按信号强度从强到弱
          std::sort(wifis.begin(), wifis.end(), [&connected_ssid](const WifiEntry& a, const WifiEntry& b) {
              // 提取 SSID 函数
              auto get_ssid_from_line = [](const std::string& l) {
                  size_t p = l.find_last_of(':');
                  if (p == std::string::npos) return l;
                  std::string s = l.substr(0, p);
                  // 去掉末尾空格
                  size_t last = s.find_last_not_of(' ');
                  return (last == std::string::npos) ? s : s.substr(0, last + 1);
              };

              std::string ssid_a = get_ssid_from_line(a.line);
              std::string ssid_b = get_ssid_from_line(b.line);

              bool is_a_connected = (!connected_ssid.empty() && ssid_a == connected_ssid);
              bool is_b_connected = (!connected_ssid.empty() && ssid_b == connected_ssid);

              if (is_a_connected) return true;  // a 是已连接，排前面
              if (is_b_connected) return false; // b 是已连接，排前面
              return a.rssi > b.rssi;           // 否则比信号强度
          });

          // 4. 遍历并创建按钮
          for (const auto& wifi : wifis) {
              std::string display_text = wifi.line;

              // 再次提取 SSID 用于比对，添加后缀
              size_t p = wifi.line.find_last_of(':');
              std::string current_ssid = (p != std::string::npos) ? wifi.line.substr(0, p) : wifi.line;
              // 简单的去除末尾空格处理
              current_ssid.erase(current_ssid.find_last_not_of(" ") + 1);

              // 添加其他信息
              bool is_saved = false;
              for (const auto &ap : saved_wifis) {
                if (ap.get_ssid() == current_ssid) {
                  is_saved = true;
                  break;
                }
              }
              if (!connected_ssid.empty() && current_ssid == connected_ssid) {
                  display_text += " (已连接)";
              }
              else if (is_saved) {
                  display_text += " (已保存)";
              }

              // 创建按钮
              lv_obj_t *btn = lv_list_add_btn(list_obj, NULL, display_text.c_str());

              // 事件回调
              lv_obj_add_event_cb(
                  btn,
                  [](lv_event_t *e) {
                    auto wifi = wifi::global_wifi_component;
                    lv_obj_t *target_btn = lv_event_get_target(e);
                    lv_obj_t *list_obj = lv_obj_get_parent(target_btn);
                    const char *txt = lv_list_get_btn_text(list_obj, target_btn);
                    // 如果是已保存的 Wi-Fi，直接连接；否则进入输入密码界面
                    if(txt) ESP_LOGD("Setting", "Clicked Wi-Fi: %s", txt);
                    if (strstr(txt, "(已保存)")) {
                      std::string ssid = txt;
                      size_t pos = ssid.find(" (已保存)");
                      if (pos != std::string::npos) {
                          ssid.erase(pos);
                      }
                      // 去除:后面的RSSI等信息
                      pos = ssid.find_last_of(':');
                      if (pos != std::string::npos) {
                          ssid.erase(pos);
                      }
                      // 去掉末尾空格
                      ssid.erase(ssid.find_last_not_of(" ") + 1);
                      // 暂时不做连接，改为删除选中的wifi
                      // // 还需要获取密码
                      // for (const auto &ap : wifi->get_sta_list()) {
                      //   if (ap.get_ssid() == ssid) {
                      //     ESP_LOGD("Setting", "Connecting to saved Wi-Fi: %s", ssid.c_str());
                      //     wifi::WiFiAP sta{};
                      //     sta.set_ssid(ssid);
                      //     sta.set_password(ap.get_password());
                      //     wifi->start_connecting(sta);
                      //     break;
                      //   }
                      // }
                      lv_obj_t * msgbox_text = lv_msgbox_get_text(msgbox_delete_wifi_message);
                      lv_label_set_text(msgbox_text,
                                        (
                                          std::string("确定要删除 ") + ssid + " 吗？"
                                        ).c_str());
                      lv_obj_clear_flag(msgbox_delete_wifi_message_outer, LV_OBJ_FLAG_HIDDEN);
                      lv_obj_move_foreground(msgbox_delete_wifi_message_outer);
                    }
                    else {
                      std::string ssid = txt;
                      size_t pos = ssid.find(" (已保存)");
                      if (pos != std::string::npos) {
                          ssid.erase(pos);
                      }
                      // 去除:后面的RSSI等信息
                      pos = ssid.find_last_of(':');
                      if (pos != std::string::npos) {
                          ssid.erase(pos);
                      }
                      // 去掉末尾空格
                      ssid.erase(ssid.find_last_not_of(" ") + 1);
                      ESP_LOGD("Setting", "Going to password input for Wi-Fi: %s", ssid.c_str());
                      lv_label_set_text(lbl_new_wifi_ssid, ssid.c_str());
                      id(lvgl_1)->show_page(system_setting_new_wifi_page->index, LV_SCR_LOAD_ANIM_MOVE_LEFT, 200);
                    }
                  },
                  LV_EVENT_CLICKED,
                  NULL
              );
          }

