# ════════════════════════════════════════════════════════════════════
# 返回手势（类手机全面屏：从屏幕左/右边缘向内轻扫触发返回）
#
# 复用说明（移植到其它触摸项目）：
#   1. 拷贝本文件，改 substitutions 里的屏幕尺寸/阈值；
#   2. 在目标项目的 touchscreen 配置里挂 3 个钩子（见文件底部注释）；
#   3. 返回动作统一交给 statusbar.yaml 的 page_back，本文件只负责手势判定。
# ════════════════════════════════════════════════════════════════════
substitutions:
  back_gesture_screen_width: "320"
  back_gesture_screen_height: "240"
  back_gesture_edge_margin: "24"    # 起点须落在屏幕左右边缘多少像素内
  back_gesture_show_dx: "20"        # 图标开始跟随手指的距离 px
  back_gesture_stop_dx: "40"        # 图标向内移动到这里后停住；必须滑到这里才触发返回
  back_gesture_max_dy: "55"         # 垂直方向最大偏移 px（过滤斜滑/竖向滚动）

globals:
  - id: back_gesture_active
    type: bool
    initial_value: 'false'
  - id: back_gesture_start_x
    type: int
    initial_value: '0'
  - id: back_gesture_start_y
    type: int
    initial_value: '0'
  - id: back_gesture_last_x
    type: int
    initial_value: '0'
  - id: back_gesture_last_y
    type: int
    initial_value: '0'
  # 本次手势是否已经滑到触发距离（到点即锁定，抬手时不再要求仍停在最里面）
  - id: back_gesture_reached
    type: bool
    initial_value: 'false'

script:
  # ── 新手势开始：记录起点，清掉上一次的状态 ──
  - id: back_gesture_touch
    mode: restart
    parameters:
      x: int
      y: int
    then:
      - lambda: |
          id(back_gesture_active) = true;
          id(back_gesture_reached) = false;
          id(back_gesture_start_x) = x;
          id(back_gesture_start_y) = y;
          id(back_gesture_last_x) = x;
          id(back_gesture_last_y) = y;
          lv_obj_t *arrow = id(obj_back_gesture_arrow);
          if (arrow != nullptr) {
            lv_obj_add_flag(arrow, LV_OBJ_FLAG_HIDDEN);
          }

  # ── 检测管线：由 hardware.yaml 的 touchscreen 触发器驱动 ──
  - id: back_gesture_update
    mode: restart
    parameters:
      x: int
      y: int
    then:
      - lambda: |
          lv_obj_t *arrow = id(obj_back_gesture_arrow);
          if (arrow == nullptr) return;

          // 用“真正显示在屏幕上的页面”判断能否返回。
          // 有页内上级的页面由状态栏把 bar_back_available 置 true；
          // 根页面（商店/消息/设置首页/计时器/天气/Lua）由 bar_gesture_home 允许手势回主页。
          lv_obj_t *active = lv_screen_active();
          bool special_back =
              active == id(page_security_pattern)->obj ||
              active == id(page_security_pin)->obj;
          bool can_back = special_back || id(bar_back_available) || id(bar_gesture_home);

          // on_update 可能先于 on_touch 到达：第一次拿到坐标就当作起点
          if (!id(back_gesture_active)) {
            id(back_gesture_active) = true;
            id(back_gesture_reached) = false;
            id(back_gesture_start_x) = x;
            id(back_gesture_start_y) = y;
            id(back_gesture_last_x) = x;
            id(back_gesture_last_y) = y;
            lv_obj_add_flag(arrow, LV_OBJ_FLAG_HIDDEN);
            return;
          }

          id(back_gesture_last_x) = x;
          id(back_gesture_last_y) = y;

          if (!can_back) {
            lv_obj_add_flag(arrow, LV_OBJ_FLAG_HIDDEN);
            return;
          }

          int dx = x - id(back_gesture_start_x);
          int dy = y - id(back_gesture_start_y);
          bool from_left = id(back_gesture_start_x) <= ${back_gesture_edge_margin};
          bool from_right = id(back_gesture_start_x) >= ${back_gesture_screen_width} - ${back_gesture_edge_margin};
          if (!from_left && !from_right) {
            lv_obj_add_flag(arrow, LV_OBJ_FLAG_HIDDEN);
            return;
          }

          int inward_dx = from_left ? dx : -dx;
          if (inward_dx < ${back_gesture_show_dx} || std::abs(dy) > ${back_gesture_max_dy}) {
            lv_obj_add_flag(arrow, LV_OBJ_FLAG_HIDDEN);
            return;
          }

          // 到点即锁定：抬手时只要曾经到达过这里就返回，不受时长限制
          if (inward_dx >= ${back_gesture_stop_dx}) {
            if (!id(back_gesture_reached)) {
              id(back_gesture_reached) = true;
              // 手势成立后让 LVGL 忽略本次触摸的后续事件，
              // 否则松手时压在下面的按钮/列表项仍会收到 CLICKED。
              // wait_until_release 会在抬手时给被按下的控件发 PRESS_LOST，
              // 从而吃掉这次点击。
              for (lv_indev_t *indev = lv_indev_get_next(nullptr); indev != nullptr;
                   indev = lv_indev_get_next(indev)) {
                lv_indev_wait_release(indev);
              }
            }
          }

          lv_label_set_text(id(lbl_back_gesture_arrow), from_left ? "\uF104" : "\uF105");

          // x 轴只跟随到固定距离：左侧最多到 stop_dx，右侧对称
          int center_x = from_left ? std::min(x, ${back_gesture_stop_dx})
                                   : std::max(x, ${back_gesture_screen_width} - ${back_gesture_stop_dx});
          int ax = center_x - 12;
          int ay = y - 12;
          if (ax < 0) ax = 0;
          if (ax > ${back_gesture_screen_width} - 24) ax = ${back_gesture_screen_width} - 24;
          if (ay < 0) ay = 0;
          if (ay > ${back_gesture_screen_height} - 24) ay = ${back_gesture_screen_height} - 24;
          lv_obj_set_pos(arrow, ax, ay);
          lv_obj_clear_flag(arrow, LV_OBJ_FLAG_HIDDEN);

  - id: back_gesture_release
    mode: restart
    then:
      - lambda: |
          lv_obj_t *arrow = id(obj_back_gesture_arrow);
          if (arrow != nullptr) {
            lv_obj_add_flag(arrow, LV_OBJ_FLAG_HIDDEN);
          }

          const bool triggered = id(back_gesture_reached);
          const int dy = id(back_gesture_last_y) - id(back_gesture_start_y);
          const bool from_left = id(back_gesture_start_x) <= ${back_gesture_edge_margin};
          const bool from_right = id(back_gesture_start_x) >= ${back_gesture_screen_width} - ${back_gesture_edge_margin};

          id(back_gesture_active) = false;
          id(back_gesture_reached) = false;

          lv_obj_t *active = lv_screen_active();
          bool special_back =
              active == id(page_security_pattern)->obj ||
              active == id(page_security_pin)->obj;

          if (triggered &&
              (from_left || from_right) &&
              std::abs(dy) <= ${back_gesture_max_dy} &&
              (special_back || id(bar_back_available) || id(bar_gesture_home))) {
            id(page_back)->execute();
          }

  # ── 返回分发已统一到 statusbar.yaml 的 page_back ──

lvgl:
  top_layer:
    widgets:
      # 跟随手指的返回箭头，抬手后隐藏
      - obj:
          id: obj_back_gesture_arrow
          x: 0
          y: 0
          width: 24
          height: 24
          radius: 12
          bg_color: !lambda return lv_color_hex(0x1f95f6);
          border_width: 0
          hidden: true
          widgets:
            - label:
                id: lbl_back_gesture_arrow
                align: CENTER
                text: "\uF104"
                text_color: !lambda return lv_color_hex(0xffffff);
                text_font: chinese_font14
          on_boot:
            then:
              - lambda: |
                  lv_obj_clear_flag(id(obj_back_gesture_arrow), LV_OBJ_FLAG_CLICKABLE);
                  lv_obj_clear_flag(id(obj_back_gesture_arrow), LV_OBJ_FLAG_SCROLLABLE);

