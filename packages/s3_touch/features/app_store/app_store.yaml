app_store:
  id: app_store_component
  http_request_id: http_request_component
  lua_runtime_id: lua
  index_url: ${lemonade_app_store_index_url}
  platform: ${lemonade_app_platform}

image:
  rgb565:
    - file: "imgs/icon/app/appstore-96x.png"
      transparency: alpha_channel
      id: app_store_icon
      resize: 96x96

globals:
  - id: app_store_list_offset
    type: int
    restore_value: no
    initial_value: '0'

script:
  - id: refresh_app_store_widgets
    mode: restart
    then:
      - lambda: |
          auto first_utf8 = [](const std::string &text) -> std::string {
            if (text.empty()) {
              return std::string();
            }
            unsigned char c = static_cast<unsigned char>(text[0]);
            size_t len = 1;
            if ((c & 0xE0) == 0xC0) {
              len = 2;
            } else if ((c & 0xF0) == 0xE0) {
              len = 3;
            } else if ((c & 0xF8) == 0xF0) {
              len = 4;
            }
            if (len > text.size()) {
              len = 1;
            }
            return text.substr(0, len);
          };

          auto update_item = [&](size_t slot, lv_obj_t *btn, lv_obj_t *title, lv_obj_t *meta,
                                 lv_obj_t *icon, lv_obj_t *tile) {
            size_t index = static_cast<size_t>(id(app_store_list_offset) + static_cast<int>(slot));
            if (!id(app_store_component).has_entry(index)) {
              lv_obj_add_flag(btn, LV_OBJ_FLAG_HIDDEN);
              return;
            }
            lv_obj_clear_flag(btn, LV_OBJ_FLAG_HIDDEN);
            std::string name = id(app_store_component).get_entry_name(index);
            lv_label_set_text(title, name.c_str());
            lv_label_set_text(meta, id(app_store_component).get_entry_meta(index).c_str());
            lv_label_set_text(icon, first_utf8(name).c_str());
            static const uint32_t colors[] = {0x5B8FF9, 0xE8A33D, 0x35A16B, 0x9B7BD8, 0xE35D5D};
            lv_obj_set_style_bg_color(tile, lv_color_hex(colors[index % 5]), 0);
          };

          if (id(app_store_list_offset) < 0) {
            id(app_store_list_offset) = 0;
          }

          update_item(0, id(btn_app_store_item_0), id(lbl_app_store_item_0_title),
                      id(lbl_app_store_item_0_meta), id(lbl_app_store_item_0_icon),
                      id(obj_app_store_item_0_icon));
          update_item(1, id(btn_app_store_item_1), id(lbl_app_store_item_1_title),
                      id(lbl_app_store_item_1_meta), id(lbl_app_store_item_1_icon),
                      id(obj_app_store_item_1_icon));
          update_item(2, id(btn_app_store_item_2), id(lbl_app_store_item_2_title),
                      id(lbl_app_store_item_2_meta), id(lbl_app_store_item_2_icon),
                      id(obj_app_store_item_2_icon));

          if (id(app_store_list_offset) <= 0) {
            lv_obj_add_flag(id(btn_app_store_prev), LV_OBJ_FLAG_HIDDEN);
          } else {
            lv_obj_clear_flag(id(btn_app_store_prev), LV_OBJ_FLAG_HIDDEN);
          }

          if (id(app_store_component).has_more_entries(static_cast<size_t>(id(app_store_list_offset)), 3)) {
            lv_obj_clear_flag(id(btn_app_store_next), LV_OBJ_FLAG_HIDDEN);
          } else {
            lv_obj_add_flag(id(btn_app_store_next), LV_OBJ_FLAG_HIDDEN);
          }

          lv_label_set_text(id(lbl_app_store_status), id(app_store_component).get_status_message().c_str());
          lv_label_set_text(id(lbl_app_store_detail_body), id(app_store_component).get_selected_detail_text().c_str());
          lv_label_set_text(id(lbl_app_store_action_install), id(app_store_component).get_selected_primary_action_label().c_str());

          if (id(app_store_component).is_busy()) {
            lv_obj_add_state(id(btn_app_store_action_install), LV_STATE_DISABLED);
            lv_obj_add_state(id(btn_app_store_action_uninstall), LV_STATE_DISABLED);
          } else {
            lv_obj_clear_state(id(btn_app_store_action_install), LV_STATE_DISABLED);
            lv_obj_clear_state(id(btn_app_store_action_uninstall), LV_STATE_DISABLED);
          }

          if (id(app_store_component).selected_can_uninstall()) {
            lv_obj_clear_flag(id(btn_app_store_action_uninstall), LV_OBJ_FLAG_HIDDEN);
          } else {
            lv_obj_add_flag(id(btn_app_store_action_uninstall), LV_OBJ_FLAG_HIDDEN);
          }

interval:
  - interval: 500ms
    then:
      - lambda: |
          bool refresh_ui = id(app_store_component).consume_ui_refresh_requested();
          bool refresh_apps = id(app_store_component).consume_external_apps_refresh_requested();
          std::string notification_message;
          int notification_delay_ms = 0;
          if (refresh_ui) {
            id(refresh_app_store_widgets)->execute();
          }
          if (refresh_apps) {
            id(refresh_external_apps)->execute();
          }
          if (id(app_store_component).consume_notification(notification_message, notification_delay_ms)) {
            id(show_notification)->execute(notification_message, "", notification_delay_ms);
          }

lvgl:
  pages:
    - id: !extend page_main
      widgets:
        - tileview:
            id: !extend tileview_main
            tiles:
              - id: !extend tile_appcenter
                widgets:
                  - image:
                      src: app_store_icon
                      id: img_app_store_app
                      width: 96
                      height: 96
                      x: 0
                      y: 45
                      align: CENTER
                      on_click:
                        then:
                          - if:
                              condition:
                                lambda: 'return !id(app_edit_mode);'
                              then:
                                - lvgl.page.show:
                                    id: page_app_store
                                    animation: FADE_IN
                                    time: 200ms

    # 应用商店列表：白卡 + 图标块 + 标题/副标题 + 箭头
    - id: page_app_store
      skip: true
      on_load:
        - script.execute:
            id: statusbar_enter
            title: "应用商店"
            back: false
            action: 1
        - lambda: |
            id(app_store_component).request_refresh_if_empty();
            id(refresh_app_store_widgets)->execute();
      widgets:
        - obj:
            x: 0
            y: 0
            width: 320
            height: 240
            styles: [setting_page]

        # ── 条目 0 ──
        - button:
            id: btn_app_store_item_0
            x: 8
            y: 26
            width: 304
            height: 56
            hidden: true
            styles: [setting_card]
            pressed:
              bg_color: 0xeef1f4
            widgets:
              - obj:
                  id: obj_app_store_item_0_icon
                  x: 10
                  y: 10
                  width: 36
                  height: 36
                  radius: 9
                  bg_color: 0x5b8ff9
                  border_width: 0
                  pad_all: 0
                  scrollable: false
                  scrollbar_mode: "OFF"
                  widgets:
                    - label:
                        id: lbl_app_store_item_0_icon
                        align: CENTER
                        text: "A"
                        text_color: 0xffffff
                        text_font: chinese_font14
                        transform_scale: 1.3
              - label:
                  id: lbl_app_store_item_0_title
                  x: 58
                  y: 8
                  width: 220
                  long_mode: DOT
                  styles: [setting_title]
                  text: ""
              - label:
                  id: lbl_app_store_item_0_meta
                  x: 58
                  y: 29
                  width: 220
                  long_mode: DOT
                  styles: [setting_hint]
                  text: ""
              - label:
                  styles: [setting_chevron]
                  align: RIGHT_MID
                  x: -10
                  text: "\uF105"
            on_click:
              then:
                - lambda: |
                    int index = id(app_store_list_offset);
                    if (id(app_store_component).has_entry(index)) {
                      id(app_store_component).set_selected_index(index);
                      id(refresh_app_store_widgets)->execute();
                    }
                - lvgl.page.show:
                    id: page_app_store_detail
                    animation: MOVE_LEFT
                    time: 200ms

        # ── 条目 1 ──
        - button:
            id: btn_app_store_item_1
            x: 8
            y: 88
            width: 304
            height: 56
            hidden: true
            styles: [setting_card]
            pressed:
              bg_color: 0xeef1f4
            widgets:
              - obj:
                  id: obj_app_store_item_1_icon
                  x: 10
                  y: 10
                  width: 36
                  height: 36
                  radius: 9
                  bg_color: 0xe8a33d
                  border_width: 0
                  pad_all: 0
                  scrollable: false
                  scrollbar_mode: "OFF"
                  widgets:
                    - label:
                        id: lbl_app_store_item_1_icon
                        align: CENTER
                        text: "B"
                        text_color: 0xffffff
                        text_font: chinese_font14
                        transform_scale: 1.3
              - label:
                  id: lbl_app_store_item_1_title
                  x: 58
                  y: 8
                  width: 220
                  long_mode: DOT
                  styles: [setting_title]
                  text: ""
              - label:
                  id: lbl_app_store_item_1_meta
                  x: 58
                  y: 29
                  width: 220
                  long_mode: DOT
                  styles: [setting_hint]
                  text: ""
              - label:
                  styles: [setting_chevron]
                  align: RIGHT_MID
                  x: -10
                  text: "\uF105"
            on_click:
              then:
                - lambda: |
                    int index = id(app_store_list_offset) + 1;
                    if (id(app_store_component).has_entry(index)) {
                      id(app_store_component).set_selected_index(index);
                      id(refresh_app_store_widgets)->execute();
                    }
                - lvgl.page.show:
                    id: page_app_store_detail
                    animation: MOVE_LEFT
                    time: 200ms

        # ── 条目 2 ──
        - button:
            id: btn_app_store_item_2
            x: 8
            y: 150
            width: 304
            height: 56
            hidden: true
            styles: [setting_card]
            pressed:
              bg_color: 0xeef1f4
            widgets:
              - obj:
                  id: obj_app_store_item_2_icon
                  x: 10
                  y: 10
                  width: 36
                  height: 36
                  radius: 9
                  bg_color: 0x35a16b
                  border_width: 0
                  pad_all: 0
                  scrollable: false
                  scrollbar_mode: "OFF"
                  widgets:
                    - label:
                        id: lbl_app_store_item_2_icon
                        align: CENTER
                        text: "C"
                        text_color: 0xffffff
                        text_font: chinese_font14
                        transform_scale: 1.3
              - label:
                  id: lbl_app_store_item_2_title
                  x: 58
                  y: 8
                  width: 220
                  long_mode: DOT
                  styles: [setting_title]
                  text: ""
              - label:
                  id: lbl_app_store_item_2_meta
                  x: 58
                  y: 29
                  width: 220
                  long_mode: DOT
                  styles: [setting_hint]
                  text: ""
              - label:
                  styles: [setting_chevron]
                  align: RIGHT_MID
                  x: -10
                  text: "\uF105"
            on_click:
              then:
                - lambda: |
                    int index = id(app_store_list_offset) + 2;
                    if (id(app_store_component).has_entry(index)) {
                      id(app_store_component).set_selected_index(index);
                      id(refresh_app_store_widgets)->execute();
                    }
                - lvgl.page.show:
                    id: page_app_store_detail
                    animation: MOVE_LEFT
                    time: 200ms

        # ── 分页 + 状态 ──
        - button:
            id: btn_app_store_prev
            x: 8
            y: 210
            width: 52
            height: 24
            hidden: true
            bg_opa: TRANSP
            border_width: 0
            shadow_width: 0
            pad_all: 0
            pressed:
              bg_color: 0xe7e9ec
              bg_opa: COVER
            widgets:
              - label:
                  align: CENTER
                  text: "上页"
                  text_color: 0x1f95f6
                  text_font: chinese_font14
            on_click:
              then:
                - lambda: |
                    id(app_store_list_offset) = id(app_store_list_offset) - 3;
                    if (id(app_store_list_offset) < 0) {
                      id(app_store_list_offset) = 0;
                    }
                    id(refresh_app_store_widgets)->execute();
        - button:
            id: btn_app_store_next
            x: 260
            y: 210
            width: 52
            height: 24
            hidden: true
            bg_opa: TRANSP
            border_width: 0
            shadow_width: 0
            pad_all: 0
            pressed:
              bg_color: 0xe7e9ec
              bg_opa: COVER
            widgets:
              - label:
                  align: CENTER
                  text: "下页"
                  text_color: 0x1f95f6
                  text_font: chinese_font14
            on_click:
              then:
                - lambda: |
                    id(app_store_list_offset) = id(app_store_list_offset) + 3;
                    id(refresh_app_store_widgets)->execute();
        - label:
            id: lbl_app_store_status
            x: 64
            y: 210
            width: 192
            height: 24
            text_align: CENTER
            long_mode: DOT
            styles: [setting_hint]
            text: "应用商店未加载"

    # 应用详情
    - id: page_app_store_detail
      skip: true
      on_load:
        - script.execute:
            id: statusbar_enter
            title: "应用"
            back: true
            action: 0
        - lambda: |
            id(statusbar_title)->execute(id(app_store_component).get_selected_name());
            id(refresh_app_store_widgets)->execute();
      widgets:
        - obj:
            x: 0
            y: 0
            width: 320
            height: 240
            styles: [setting_page]
        - obj:
            x: 8
            y: 26
            width: 304
            height: 156
            styles: [setting_card]
            scrollable: false
            widgets:
              - label:
                  id: lbl_app_store_detail_body
                  x: 12
                  y: 12
                  width: 280
                  height: 132
                  long_mode: WRAP
                  styles: [setting_title]
                  text: "请选择一个应用。"
        - button:
            id: btn_app_store_action_install
            x: 8
            y: 190
            width: 148
            height: 34
            styles: [setting_primary_btn]
            widgets:
              - label:
                  id: lbl_app_store_action_install
                  align: CENTER
                  styles: [setting_primary_text]
                  text: "安装"
            on_click:
              then:
                - lambda: |
                    id(app_store_component).request_install_selected();
                    id(refresh_app_store_widgets)->execute();
        - button:
            id: btn_app_store_action_uninstall
            x: 164
            y: 190
            width: 148
            height: 34
            hidden: true
            styles: [setting_primary_btn]
            bg_color: 0xe5484d
            widgets:
              - label:
                  align: CENTER
                  styles: [setting_primary_text]
                  text: "卸载"
            on_click:
              then:
                - lambda: |
                    id(app_store_component).request_uninstall_selected();
                    id(refresh_app_store_widgets)->execute();
