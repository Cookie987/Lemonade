lvgl:
  pages:
    - id: !extend page_main
      widgets:
        - tileview:
            id: !extend tileview_main
            tiles:
              - id: !extend tile_clock
                widgets:
                  - label:
                      id: lbl_current_weather_text_main
                      align: CENTER
                      y: 35
                      text_font: chinese_font18
                      text_color: !lambda return lv_color_hex(0xffffff);
                      text: "N/A"
              - id: !extend tile_appcenter
                widgets:
                  - image:
                      src: weather_icon
                      id: img_weather_app
                      width: 96
                      height: 96
                      x: 96
                      y: -45
                      align: CENTER
                      on_click:
                        then:
                          - if:
                              condition:
                                lambda: 'return !id(app_edit_mode);'
                              then:
                                - lvgl.page.show:
                                    id: page_weather_forecast
                                    animation: FADE_IN
                                    time: 200ms

    - id: page_weather_forecast
      skip: true
      on_load:
        - script.execute:
            id: statusbar_enter
            title: "天气"
            back: false
            action: 3
        - lambda: |
            lv_obj_t *btns = lv_tabview_get_tab_btns(tabview_weather);
            if (btns != nullptr) {
              lv_obj_set_parent(id(obj_weather_tab_indicator), btns);
              lv_obj_add_flag(id(obj_weather_tab_indicator), LV_OBJ_FLAG_IGNORE_LAYOUT);
              lv_obj_add_flag(id(obj_weather_tab_indicator), LV_OBJ_FLAG_FLOATING);
              lv_coord_t tw = lv_obj_get_width(btns) / 3;
              uint16_t act = lv_tabview_get_tab_act(tabview_weather);
              lv_obj_align(id(obj_weather_tab_indicator), LV_ALIGN_TOP_LEFT, tw * act + tw / 2 - 16, 30);
              lv_obj_clear_flag(id(obj_weather_tab_indicator), LV_OBJ_FLAG_HIDDEN);
              lv_obj_move_foreground(id(obj_weather_tab_indicator));
            }
      widgets:
        - obj:
            id: obj_weather_tab_indicator
            width: 32
            height: 2
            hidden: true
            bg_color: 0x1f95f6
            border_width: 0
            radius: 1

        - tabview:
            id: tabview_weather
            anim_duration: 0.3s
            x: 0
            y: 22
            width: 320
            height: 218
            size: 15%
            tab_style:
              bg_color: 0xffffff
              border_width: 0
              pad_all: 0
              items:
                bg_opa: TRANSP
                text_color: 0x8a9099
                text_font: chinese_font14
                checked:
                  text_color: 0x1f95f6
            content_style:
              bg_color: 0xf2f3f5
              pad_all: 0
            on_value:
              then:
                - lambda: |
                    lv_obj_t *btns = lv_tabview_get_tab_btns(tabview_weather);
                    if (btns != nullptr) {
                      uint16_t act = lv_tabview_get_tab_act(tabview_weather);
                      lv_coord_t tw = lv_obj_get_width(btns) / 3;
                      lv_obj_align(id(obj_weather_tab_indicator), LV_ALIGN_TOP_LEFT,
                                   tw * act + tw / 2 - 16, 30);
                    }
            tabs:
              # ── 现在 ─────────────────────────────────────────────
              - name: 现在
                text_font: chinese_font14
                scrollable: true
                scroll_dir: "VER"
                scrollbar_mode: "ON"
                pad_all: 0
