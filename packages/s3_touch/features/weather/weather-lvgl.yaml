lvgl:
  pages:
    - id: !extend page_main
      widgets:
        - tileview:
            id: !extend tileview_main
            tiles:
              - id: !extend tile_clock
                widgets:
                  - label:
                      id: lbl_current_weather_text_main
                      align: CENTER
                      y: 35
                      text_font: chinese_font18
                      text_color: !lambda return lv_color_hex(0xffffff);
                      text: "N/A"
              - id: !extend tile_appcenter
                widgets:
                  - image:
                      src: weather_icon
                      id: img_weather_app
                      width: 96
                      height: 96
                      x: 96
                      y: -45
                      align: CENTER
                      on_click:
                        then:
                          - lvgl.page.show:
                              id: page_weather_forecast
                              animation: FADE_IN
                              time: 200ms

    - id: page_weather_forecast
      skip: true
      on_load:
        - lvgl.label.update:
            id: lbl_topbar_title
            text: "天气"
      widgets:
        - tabview:
            id: tabview_weather
            anim_time: 0.5s
            x: 0
            y: 18
            width: 320
            height: 222
            size: 15%
            tab_style:
              bg_color: !lambda return lv_color_hex(0xf6f6f6);
            content_style:
              bg_color: !lambda return lv_color_hex(0xffffff);
            tabs:
              # 当前天气标签页
              - name: 当前天气
                text_font: chinese_font14
                scrollbar_mode: "OFF"
                scroll_dir: "VER"
                widgets:
                  - image:
                      id: img_current_weather_icon
                      src: c999_2x_black
                      x: 10
                      y: -20
                      align: LEFT_MID
                  - label:
                      id: lbl_current_weather_text
                      x: -5
                      y: -45
                      align: RIGHT_MID
                      text_font: chinese_font36
                      text: "N/A"
                  - label:
                      id: lbl_current_weather_max_min_temp
                      x: -5
                      y: -10
                      align: RIGHT_MID
                      text_font: chinese_font18
                      text: "N/A"
                  - label:
                      id: lbl_current_weather_wind
                      x: -5
                      y: 15
                      align: RIGHT_MID
                      text_font: chinese_font18
                      text: "N/A"
                  - label:
                      id: lbl_current_weather_rain_summary
                      align: BOTTOM_MID
                      text_align: CENTER
                      y: -10
                      x: 0
                      width: 250
                      recolor: true
                      long_mode: SCROLL_CIRCULAR
                      text_font: chinese_font14
                      text: "N/A"
                  - label:
                      id: lbl_update_time
                      align: BOTTOM_LEFT
                      # #c4c4c4ff
                      text_color: !lambda return lv_color_hex(0xc4c4c4);
                      x: -8
                      y: 10
                      text: "N/A"
                  - label:
                      id: lbl_data_source
                      align: BOTTOM_RIGHT
                      # #f6f6f6
                      text_color: !lambda return lv_color_hex(0xc4c4c4);
                      x: 8
                      y: 10
                      text: "来自和风天气"

              - name: 3日预报
                text_font: chinese_font14
                scrollbar_mode: "OFF"
                scroll_dir: "VER"
                bg_color: !lambda return lv_color_hex(0xffffff);
                widgets:
                  - image:
                      id: img_forecast_day1_weather_icon
                      x: -120
                      y: -50
                      align: CENTER
                      src: c999_1x_black
                  - image:
                      id: img_forecast_day2_weather_icon
                      x: -120
                      y: 0
                      align: CENTER
                      src: c999_1x_black
                  - image:
                      id: img_forecast_day3_weather_icon
                      x: -120
                      y: 50
                      align: CENTER
                      src: c999_1x_black
                  - label:
                      id: lbl_forecast_day1_weather
                      x: 35
                      y: -50
                      width: 220
                      align: CENTER
                      text_align: LEFT
                      text_font: chinese_font18
                      text: "N/A℃~N/A℃  N/A"
                  - label:
                      id: lbl_forecast_day2_weather
                      x: 35
                      y: 0
                      width: 220
                      align: CENTER
                      text_align: LEFT
                      text_font: chinese_font18
                      text: "N/A℃~N/A℃  N/A"
                  - label:
                      id: lbl_forecast_day3_weather
                      x: 35
                      y: 50
                      width: 220
                      align: CENTER
                      text_align: LEFT
                      text_font: chinese_font18
                      text: "N/A℃~N/A℃  N/A"
