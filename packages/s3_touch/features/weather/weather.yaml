packages:
  - !include weather-lvgl.yaml
  - !include weather-image.yaml

interval:
  - interval: 10min
    id: interval_weather
    then:
      - script.execute: weather_update

time:
  - id: !extend ntp_time
    on_time_sync:
      - script.execute: weather_update

