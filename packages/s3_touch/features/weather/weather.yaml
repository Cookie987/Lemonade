packages:
  - !include weather-lvgl.yaml
  - !include weather-image.yaml

interval:
  - interval: 10min
    id: interval_weather
    then:
      - script.execute: weather_update

mqtt:
  on_connect:
    then:
      - script.execute: weather_update

