script:
  - id: weather_update
    then:
      if:
        condition:
          wifi.connected:
        then:
          - mqtt.publish_json:
              topic: !lambda |-
                return "weather/request";
              payload: |-
                root["mac"] = id(text_sensor_mac_address).state;
          - lambda: |-
              ESP_LOGD("987IoT", "Started updating weather");
              std::string mac = id(text_sensor_mac_address).state;
              id(mqtt_client).subscribe_json("weather/response/" + mac, [=](const std::string &topic, JsonObject root) {
                if (root["error"]){
                  int icon = 999;
                  std::string text = "N/A";
                  lv_img_set_src(id(img_current_weather_icon), id(weather_icon_2x)[icon]);
                  lv_label_set_text(id(lbl_current_weather_max_min_temp), text.c_str());
                  lv_label_set_text(id(lbl_current_weather_wind), text.c_str());
                }
                if (root["now"]) {
                  std::string text = root["now"]["text"].as<std::string>();
                  text += " " + root["now"]["temp"].as<std::string>() + "℃";
                  int icon = root["now"]["icon"].as<int>();
                  lv_img_set_src(id(img_current_weather_icon), id(weather_icon_2x)[icon]);
                  lv_label_set_text(id(lbl_current_weather_text), text.c_str());
                  lv_label_set_text(id(lbl_current_weather_text_main), text.c_str());
                  std::string windDir = root["now"]["windDir"].as<std::string>();

                  // km/h转换成m/s，保留1位小数
                  char windSpeed_text[10];
                  float windSpeed = root["now"]["windSpeed"].as<float>() / 3.6;
                  sprintf(windSpeed_text, "%.1f", windSpeed);
                  std::string wind_text = windDir + " " + windSpeed_text + "m/s";

                  std::string obs_time = root["now"]["obsTime"].as<std::string>();
                  // 把2025-11-13T23:00+08:00转换成11.13 23:00
                  obs_time = "更新于 " + obs_time.substr(5, 5) + " " + obs_time.substr(11, 5);
                  std::string update_text = obs_time;
                  lv_label_set_text(id(lbl_update_time), update_text.c_str());
                  lv_label_set_text(id(lbl_current_weather_wind), wind_text.c_str());
                }
                if (root["forecast"]) {
                  std::string tempMax = root["forecast"]["daily"][0]["tempMax"].as<std::string>();
                  std::string tempMin = root["forecast"]["daily"][0]["tempMin"].as<std::string>();
                  std::string humidity = root["now"]["humidity"].as<std::string>();
                  std::string temp_text = tempMax + "℃/" + tempMin + "℃" + " " + humidity + "%";

                  int icon1 = root["forecast"]["daily"][1]["iconDay"].as<int>();
                  int icon2 = root["forecast"]["daily"][2]["iconDay"].as<int>();
                  int icon3 = root["forecast"]["daily"][3]["iconDay"].as<int>();
                  lv_img_set_src(id(img_forecast_day1_weather_icon), id(weather_icon_1x)[icon1]);
                  lv_img_set_src(id(img_forecast_day2_weather_icon), id(weather_icon_1x)[icon2]);
                  lv_img_set_src(id(img_forecast_day3_weather_icon), id(weather_icon_1x)[icon3]);

                  std::string tempMax1 = root["forecast"]["daily"][1]["tempMax"].as<std::string>();
                  std::string tempMin1 = root["forecast"]["daily"][1]["tempMin"].as<std::string>();
                  std::string fxDate1 = root["forecast"]["daily"][1]["fxDate"].as<std::string>();
                  // 把2025-11-13转换成11.13
                  fxDate1 = fxDate1.substr(5, 5);
                  std::string day1_text = fxDate1 + " | " + tempMax1 + "℃/" + tempMin1 + "℃ " + root["forecast"]["daily"][1]["textDay"].as<std::string>();
                  if (root["forecast"]["daily"][1]["textDay"].as<std::string>() != root["forecast"]["daily"][1]["textNight"].as<std::string>())
                  {
                    day1_text += "转" + root["forecast"]["daily"][1]["textNight"].as<std::string>();
                  }
                  lv_label_set_text(id(lbl_forecast_day1_weather), day1_text.c_str());

                  std::string tempMax2 = root["forecast"]["daily"][2]["tempMax"].as<std::string>();
                  std::string tempMin2 = root["forecast"]["daily"][2]["tempMin"].as<std::string>();
                  std::string fxDate2 = root["forecast"]["daily"][2]["fxDate"].as<std::string>();
                  fxDate2 = fxDate2.substr(5, 5);
                  std::string day2_text = fxDate2 + " | " + tempMax2 + "℃/" + tempMin2 + "℃ " + root["forecast"]["daily"][2]["textDay"].as<std::string>();
                  if (root["forecast"]["daily"][2]["textDay"].as<std::string>() != root["forecast"]["daily"][2]["textNight"].as<std::string>())
                  {
                    day2_text += "转" + root["forecast"]["daily"][2]["textNight"].as<std::string>();
                  }
                  lv_label_set_text(id(lbl_forecast_day2_weather), day2_text.c_str());
                  std::string tempMax3 = root["forecast"]["daily"][3]["tempMax"].as<std::string>();
                  std::string tempMin3 = root["forecast"]["daily"][3]["tempMin"].as<std::string>();
                  std::string fxDate3 = root["forecast"]["daily"][3]["fxDate"].as<std::string>();
                  fxDate3 = fxDate3.substr(5, 5);
                  std::string day3_text = fxDate3 + " | " + tempMax3 + "℃/" + tempMin3 + "℃ " + root["forecast"]["daily"][3]["textDay"].as<std::string>();
                  if (root["forecast"]["daily"][3]["textDay"].as<std::string>() != root["forecast"]["daily"][3]["textNight"].as<std::string>())
                  {
                    day3_text += "转" + root["forecast"]["daily"][3]["textNight"].as<std::string>();
                  }
                  lv_label_set_text(id(lbl_forecast_day3_weather), day3_text.c_str());
                  lv_label_set_text(id(lbl_current_weather_max_min_temp), temp_text.c_str());
                }
                std::string alert_text;
                if (root["alert"]) {
                  if(!root["alert"]["zeroResult"]){
                    alert_text = "  " + root["alert"]["headline"].as<std::string>();
                  }
                }
                if (root["minutely"]) {
                  std::string rain_summary = root["minutely"]["summary"].as<std::string>() + alert_text;
                  lv_label_set_text(id(lbl_current_weather_rain_summary), rain_summary.c_str());
                }
              });
              return;
