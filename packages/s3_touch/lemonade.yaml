esphome:
  name: "${lemonade_device_name}"
  friendly_name: ${lemonade_device_friendly_name}
  platformio_options:
    upload_speed: 921600

  includes:
    - <esp_littlefs.h>
    - <mbedtls/base64.h>
    - <fstream>

  on_boot:
    - priority: 800
      then:
        - script.execute: littlefs_init
    - priority: 400
      then:
        - script.execute: prase_iot_info
        - if:
            condition:
              lambda: 'return id(dropdown_image).get_selected_text() == "Cookie IoT";'
            then:
              - script.execute: set_background_img
    - priority: 300
      then:
        - lambda: |-
            float b = id(backlight).current_values.get_brightness();
            lv_slider_set_value(id(backlight_slider), b * 100.0, LV_ANIM_ON);
        - switch.turn_on: switch_powermanage_lock_apb
        - light.turn_on:
            id: backlight
            transition_length: 1s
        - if:
            condition:
              lambda: 'return id(switch_buzzer).state;'
            then:
              - rtttl.play: "DJIStartup:d=16,o=6,b=60:c,d,g"
        - lvgl.widget.hide: boot_screen
    - priority: 100
      then:
        - script.execute: mqtt_response_handler

esp32:
  board: ${lemonade_board}
  cpu_frequency: 240MHz
  flash_size: 16MB
  partitions: partitions_16M.csv
  framework:
    type: esp-idf
    components:
      - name: joltwallet/littlefs
        source: https://github.com/joltwallet/esp_littlefs.git
    advanced:
      execute_from_psram: yes
    sdkconfig_options:
      CONFIG_PM_ENABLE: y
      CONFIG_PM_DFS_INIT_AUTO: y

psram:
  mode: octal
  speed: 80MHz
  ignore_not_found: false

safe_mode:
  disabled: false
  boot_is_good_after: 10s
  reboot_timeout: 1min

power_management:
  max_frequency: 240MHZ
  min_frequency: 40MHZ
  enable_light_sleep: true
  idle_time_before_sleep: 3
  power_down_flash: false
  power_down_peripherals: true
  esphome_locks: true
  profiling: false
  trace: false

debug:
  update_interval: 5s

globals:
  - id: uid
    type: std::string
    restore_value: yes
    initial_value: '"0000"'
  - id: is_sleeping
    type: bool
    restore_value: no
    initial_value: 'false'
  - id: is_slider_changing
    type: bool
    restore_value: no
    initial_value: 'false'
  - id: is_timer_running
    type: bool
    # restore_value: yes
    initial_value: 'false'
  - id: stopwatch_start_time
    type: unsigned long
    restore_value: yes
    initial_value: '0'
  - id: stopwatch_paused_time
    type: unsigned long
    restore_value: yes
    initial_value: '0'
  - id: is_countdown_running
    type: bool
    restore_value: yes
    initial_value: 'false'
  - id: countdown_end_time
    type: unsigned long
    restore_value: yes
    initial_value: '0'
  - id: countdown_hours
    type: int
    restore_value: yes
    initial_value: '0'
  - id: countdown_minutes
    type: int
    restore_value: yes
    initial_value: '0'
  - id: countdown_seconds
    type: int
    restore_value: yes
    initial_value: '0'
  - id: iot_last_status
    type: std::string
    restore_value: yes
    initial_value: '"未获取过"'

# Enable logging
logger:
  level: DEBUG
  on_message:
    level: ERROR
    then:
      - mqtt.publish:
          topic: !lambda |-
            return "logs/" + id(text_sensor_mac_address).state;
          payload: !lambda |-
            return message;

ota:
  - platform: esphome
    password: ${lemonade_ota_password}
    on_begin:
      - logger.log: "Turn On Lock"
      - switch.turn_on: switch_powermanage_lock
      - logger.log: "Begin OTA Flash"
      - lvgl.page.show: page_ota
      - lambda: "id(lvgl_1).loop();"
      - output.set_level:
          id: backlight_pin
          level: 100%
      - delay: 1s
    on_progress:
      then:
        - lvgl.bar.update:
            id: bar_ota_progress
            value: !lambda "return (int)x;"
        - lambda: "id(lvgl_1).loop();"
    on_error: 
      then:
        - logger.log: "Turn Off Lock"
        - lvgl.widget.hide: lbl_ota_prompt
        - lvgl.label.update:
            id: lbl_ota_prompt
            text:
              format: "#ff0000 更新失败：%d\n #ffffff 请按 Home 键返回主页#"
              args: ["x"]
        - switch.turn_off: switch_powermanage_lock

  - platform: http_request
    on_begin:
      - logger.log: "Turn On Lock"
      - switch.turn_on: switch_powermanage_lock
      - logger.log: "Begin OTA Flash"
      - lvgl.page.show: page_ota
      - lambda: "id(lvgl_1).loop();"
      - output.set_level:
          id: backlight_pin
          level: 100%
      - delay: 1s
    on_progress:
      then:
        - lvgl.bar.update:
            id: bar_ota_progress
            value: !lambda "return (int)x;"
        - lambda: "id(lvgl_1).loop();"
    on_error: 
      then:
        - logger.log: "Turn Off Lock"
        - lvgl.label.update:
            id: lbl_ota_prompt
            text:
              format: "#ff0000 更新失败：%d\n #ffffff 请按 Home 键返回主页#"
              args: ["x"]
        - switch.turn_off: switch_powermanage_lock

wifi:
  reboot_timeout: 0s
  enable_btm: true
  enable_rrm: true
  # Enable fallback hotspot (captive portal) in case wifi connection fails
  ap:
    ssid: "Lemonade"
    password: "Lemonade"
    ap_timeout: 0s
  power_save_mode: HIGH
  on_connect:
    then:
      - mqtt.enable:

  on_disconnect:
    then:
      - mqtt.disable:
      - if:
          condition: 
            lambda: 'return id(wifi_switch).state;'
          then:
            - logger.log: WiFi signal is too weak or not connected. Reconnecting...
            - wifi.disable
            - delay: 5s
            - wifi.enable

improv_serial:

switch:
  - platform: template
    id: switch_powermanage_lock
    optimistic: true
    restore_mode: ALWAYS_OFF
    turn_on_action:
      then:
        - logger.log: "Turn On Lock"
        - power_management.acquire_lock:
    turn_off_action:
      then:
        - logger.log: "Turn Off Lock"
        - power_management.release_lock:
  
  - platform: template
    id: switch_powermanage_lock_apb
    optimistic: true
    restore_mode: ALWAYS_OFF
    turn_on_action:
      then:
        - logger.log: "Turn On Lock"
        - power_management.acquire_lock: APB
    turn_off_action:
      then:
        - logger.log: "Turn Off Lock"
        - power_management.release_lock: APB

  - platform: lvgl
    id: wifi_switch
    widget: switch_wifi
    restore_mode: ALWAYS_ON
    on_turn_on: 
      then:
        - wifi.enable
    on_turn_off:
      then:
        - wifi.disable

  - platform: lvgl
    id: buzzer_switch
    widget: switch_buzzer
    restore_mode: RESTORE_DEFAULT_OFF

