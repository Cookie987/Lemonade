time:
  - id: ntp_time
    platform: sntp
    timezone: "Asia/Shanghai"   # 可改为你所在时区
    servers:
      - ntp.cookie987.top
      - cn.pool.ntp.org
    on_time_sync: 
      then:
        - script.execute: update_date
        - script.execute: update_time
        - lambda: |-
            // 初始化秒表状态（仅在没有保存的状态时）
            static bool initialized = false;
            if (!initialized) {
              initialized = true;
              // 如果没有有效的保存状态，则初始化为默认值
              if (id(stopwatch_start_time) == 0 && id(stopwatch_paused_time) == 0) {
                id(stopwatch_start_time) = millis();
                id(stopwatch_paused_time) = 0;
              }
              unsigned long elapsed = millis() - id(stopwatch_start_time);
              int hours = (elapsed / 1000) / 3600;
              int minutes = ((elapsed / 1000) / 60) % 60;
              int seconds = (elapsed / 1000) % 60;
              int hundredths = (elapsed % 1000) / 10;  // 精确到0.01秒
              char buf[16];
              sprintf(buf, "%02d:%02d:%02d.%02d", hours, minutes, seconds, hundredths);
              // lv_label_set_text(id(stopwatch_label), buf);
              // 初始化倒计时状态
              if (id(countdown_end_time) > 0 && id(is_countdown_running)) {
                // 如果倒计时正在运行且未结束，则继续倒计时
                unsigned long current_time = millis();
                lv_label_set_text(id(lbl_countdown_button), "暂停");
                if (current_time >= id(countdown_end_time)) {
                  // 如果倒计时已经结束，重置状态
                  id(is_countdown_running) = false;
                  id(countdown_end_time) = 0;
                }
              }
              unsigned long current_time = millis();
              if (current_time < id(countdown_end_time)) {
                // 计算剩余时间
                unsigned long remaining = (id(countdown_end_time) - current_time) / 1000;
                
                // 计算小时、分钟、秒
                int hours = remaining / 3600;
                int minutes = (remaining % 3600) / 60;
                int seconds = remaining % 60;
                
                // 更新roller显示
                lv_roller_set_selected(id(roller_countdown_hours_tens).obj, hours / 10, LV_ANIM_ON);
                lv_roller_set_selected(id(roller_countdown_hours_ones).obj, hours % 10, LV_ANIM_ON);
                lv_roller_set_selected(id(roller_countdown_minutes_tens).obj, minutes / 10, LV_ANIM_ON);
                lv_roller_set_selected(id(roller_countdown_minutes_ones).obj, minutes % 10, LV_ANIM_ON);
                lv_roller_set_selected(id(roller_countdown_seconds_tens).obj, seconds / 10, LV_ANIM_ON);
                lv_roller_set_selected(id(roller_countdown_seconds_ones).obj, seconds % 10, LV_ANIM_ON);
                
              }
            }
    on_time: 
      - seconds: '*'
        then:
          - script.execute: update_time
      - minutes: '*'
        then:
          - script.execute: update_date

sensor: 
  - platform: wifi_signal
    id: rssi
    update_interval: 4s
    on_value: 
      then:
        - script.execute: statusbar_update

  - platform: internal_temperature
    id: internal_temp
    update_interval: 2s
    
  - platform: debug
    free:
      id: heap_free
    block:
      id: heap_block
    loop_time:
      id: loop_time
    psram:
      id: psram_free
    cpu_frequency:
      id: cpu_freq

rtttl:
  output: rttl_pin
  id: rtttl_player
  gain: 10%

esp32_ble_beacon:
  type: iBeacon
  uuid: ${lemonade_ibeacon_uuid}
  major: ${lemonade_ibeacon_major}
  minor: ${lemonade_ibeacon_minor}
  measured_power: ${lemonade_ibeacon_measured_power}
  tx_power: 0dBm

light:
  - platform: monochromatic
    output: backlight_pin
    name: "Screen Brightness"
    id: backlight
    restore_mode: RESTORE_DEFAULT_ON
    default_transition_length: 0s

http_request:
  useragent: "Lemonade/${lemonade_version} (https://cookie987.top)"
  watchdog_timeout: 10s


text_sensor:
  - platform: wifi_info
    mac_address:
      id: text_sensor_mac_address
    ssid:
      id: ssid
  - platform: debug
    device:
      id: device_info
    reset_reason:
      id: reset_reason
  - platform: version
    id: esphome_version
  - platform: git_commit_sha
    id: lemonade_git_commit_sha
  - platform: uptime
    id: uptime_text
    update_interval: 30s
    format:
      separator: " "
      expand: true

select:
  - platform: lvgl
    widget: dropdown_image
    name: Background Select
    restore_value: True