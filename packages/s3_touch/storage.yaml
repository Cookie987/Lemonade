external_components:
  - source: github://p1ngb4ck/esphome@dev
    components: [binary_storage, picture_viewer, storage, nfs_client, http_file_browser, webdav_server, usb_host, usb_uart, usb_storage]

binary_storage:
  - type: flash_partition
    id: littlefs
    partition_label: littlefs
    mount_path: /data

storage:
  id: storage_id
  mounts:
    - path: /data
      platform: binary_storage
      id: littlefs_storage


