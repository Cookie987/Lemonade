interval:
  - interval: 5s
    id: interval_infopage
    then:
      - if:
          condition:
            lambda: 'return !id(is_sleeping);'
          then:
            - if:
                condition:
                  or:
                    - lvgl.page.is_showing: system_setting_network_page
                    - lvgl.page.is_showing: system_setting_system_page
                then:
                  - script.execute: refresh_info_page

  - interval: 5s
    then:
      - lambda: |-
          // 打印当前剩余的堆内存信息
          ESP_LOGI("DEBUG", "========================================");

          // 1. 打印内部 SRAM（最关键：系统、蓝牙、任务栈消耗这里）
          ESP_LOGI("DEBUG", "Internal SRAM Free : %d bytes", heap_caps_get_free_size(MALLOC_CAP_INTERNAL));
          ESP_LOGI("DEBUG", "Internal SRAM Min  : %d bytes", heap_caps_get_minimum_free_size(MALLOC_CAP_INTERNAL));
          ESP_LOGI("DEBUG", "Internal SRAM MaxBlk: %d bytes", heap_caps_get_largest_free_block(MALLOC_CAP_INTERNAL));

          // 2. 打印外部 PSRAM（LVGL、ArduinoJson、大缓冲区消耗这里）
          ESP_LOGI("DEBUG", "External PSRAM Free: %d bytes", heap_caps_get_free_size(MALLOC_CAP_SPIRAM));
          ESP_LOGI("DEBUG", "External PSRAM Min : %d bytes", heap_caps_get_minimum_free_size(MALLOC_CAP_SPIRAM));

          ESP_LOGI("DEBUG", "========================================");
      - script.execute: statusbar_update

  # keepalive
  - interval: 120s
    then:
      - script.execute: keepalive
