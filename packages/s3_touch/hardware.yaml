display:
  - platform: mipi_spi
    id: watchface
    data_rate: 80MHz
    model: ST7789V
    cs_pin: GPIO6
    reset_pin: GPIO7
    dc_pin: GPIO15
    show_test_card: false
    color_order: bgr
    invert_colors: true
    auto_clear_enabled: false
    update_interval: never
    pixel_mode: 16bit
    double_buffer: false
    use_dma: true
    transform:
      swap_xy: true
      mirror_x: false
      mirror_y: true
    dimensions:
      width: 320
      height: 240

touchscreen:
  - id: touch_panel
    display: watchface
    platform: ft63x6
    interrupt_pin: GPIO13
    reset_pin: GPIO10
    transform:
      swap_xy: true
      mirror_x: true
      mirror_y: false
    on_touch:
      then:
        - if:
            condition:
              lambda: 'return !id(is_sleeping);'
            then:
              - switch.turn_on: switch_powermanage_lock_apb

i2c:
  sda: GPIO11
  scl: GPIO9
  scan: false
  id: bus_a
  frequency: 20kHz

spi:
  clk_pin: GPIO18
  mosi_pin: GPIO17

switch:
  - platform: gpio
    pin: GPIO40
    id: acc
    restore_mode: ALWAYS_ON

    # - platform: lvgl
    #   id: bluetooth_switch
    #   widget: switch_bluetooth
    #   restore_mode: ALWAYS_ON

output:
  - platform: ledc
    pin: GPIO8
    id: backlight_pin
    frequency: 3840
    channel: 0
  - platform: ledc
    pin: GPIO42
    id: rttl_pin
    channel: 2

binary_sensor:
  - platform: gpio
    pin: GPIO39
    id: home
    filters:
      - settle: 20ms
    on_multi_click:
      - timing:
          - ON for at most 0.8s
          - OFF for at least 0.1s
        then:
          - script.execute: sleep_button

  - platform: gpio
    pin: GPIO0
    id: boot
    filters:
      - settle: 20ms
    on_press:
      then:
        - script.execute: wakeup_button
        - lvgl.page.show:
            id: page_main
            animation: FADE_IN
            time: 200ms

  - platform: gpio
    id: charge
    pin:
      number: GPIO41
      mode: INPUT_PULLUP
      inverted: true
    filters:
      - settle: 70ms
    on_press:
      then:
        - logger.log: Charger connected
        - script.execute: update_date
    on_release:
      then:
        - logger.log: Charger disconnected
        - script.execute: update_date

sensor:
  - platform: adc
    pin: GPIO1
    id: usb_input_voltage
    update_interval: 5s
    attenuation: auto
    filters:
      - multiply: 5
    on_value:
      - if:
          condition:
            lambda: 'return !id(is_sleeping);'
          then:
            - if:
                condition:
                  lvgl.page.is_showing: system_setting_power_page
                then:
                  - lvgl.indicator.update:
                      id: usb_voltage_indicator
                      value: !lambda 'return id(usb_input_voltage).state * 10;'
                  - lvgl.label.update:
                      id: usb_voltage_text
                      text:
                        format: "%.2fV"
                        args: ['x']

  - platform: adc
    pin: GPIO2
    id: battery_voltage
    update_interval: 5s
    attenuation: auto
    filters:
      - multiply: 5
    on_value:
      - if:
          condition:
            lambda: 'return !id(is_sleeping);'
          then:
            - lambda: |-
                float v = id(battery_voltage).state;
                float usb_v = id(usb_input_voltage).state;
                bool charging = id(charge).state;
                // TP4056: charging voltage is inflated; compensate while charging (taper near full)
                float v_est = v;
                if (charging) {
                  float comp = 0.25f;
                  if (v > 4.05f) comp -= (v - 4.05f) * 0.6f; // taper: 0.12 -> ~0.03 at 4.20V
                  if (comp < 0.03f) comp = 0.03f;
                  v_est = v - comp;
                }
                if (v_est < 3.20f) v_est = 3.20f;
                // Voltage to raw percent (tuneable curve)
                float p = 0.0f;
                if (v_est >= 4.20f) p = 100.0f;
                else if (v_est >= 4.10f) p = 90.0f + (v_est - 4.10f) * (10.0f / 0.10f);
                else if (v_est >= 4.00f) p = 80.0f + (v_est - 4.00f) * (10.0f / 0.10f);
                else if (v_est >= 3.92f) p = 70.0f + (v_est - 3.92f) * (10.0f / 0.08f);
                else if (v_est >= 3.85f) p = 60.0f + (v_est - 3.85f) * (10.0f / 0.07f);
                else if (v_est >= 3.80f) p = 50.0f + (v_est - 3.80f) * (10.0f / 0.05f);
                else if (v_est >= 3.75f) p = 40.0f + (v_est - 3.75f) * (10.0f / 0.05f);
                else if (v_est >= 3.70f) p = 30.0f + (v_est - 3.70f) * (10.0f / 0.05f);
                else if (v_est >= 3.65f) p = 20.0f + (v_est - 3.65f) * (10.0f / 0.05f);
                else if (v_est >= 3.60f) p = 10.0f + (v_est - 3.60f) * (10.0f / 0.05f);
                else if (v_est >= 3.50f) p = (v_est - 3.50f) * (10.0f / 0.10f);
                else p = 0.0f;

                if (p < 0.0f) p = 0.0f;
                if (p > 100.0f) p = 100.0f;

                // Smooth raw percent to reduce short voltage dips/spikes
                if (!id(battery_raw_valid)) {
                  id(battery_raw_percent) = p;
                  id(battery_raw_valid) = true;
                } else {
                  const float alpha = 0.15f;
                  id(battery_raw_percent) = id(battery_raw_percent) * (1.0f - alpha) + p * alpha;
                }

                // Full lock: USB present, battery high, and charger not active
                if (usb_v > 4.5f && v > 4.14f && !id(charge).state) {
                  id(battery_soc) = 100.0f;
                  id(battery_soc_initialized) = true;
                  id(battery_raw_percent) = 100.0f;
                  id(battery_raw_valid) = true;
                  return;
                }

                // SOC monotonic constraint: do not increase when not charging
                if (!id(battery_soc_initialized)) {
                  id(battery_soc) = id(battery_raw_percent);
                  id(battery_soc_initialized) = true;
                } else {
                  float target = id(battery_raw_percent);
                  if (!charging && target > id(battery_soc)) {
                    target = id(battery_soc);
                  }
                  float max_step = charging ? 1.0f : 0.5f;
                  float delta = target - id(battery_soc);
                  if (delta > max_step) delta = max_step;
                  if (delta < -max_step) delta = -max_step;
                  id(battery_soc) += delta;
                }
            - script.execute: update_date
            - if:
                condition:
                  lvgl.page.is_showing: system_setting_power_page
                then:
                  - lvgl.indicator.update:
                      id: battery_voltage_indicator
                      value: !lambda 'return id(battery_voltage).state * 10;'
                  - lvgl.label.update:
                      id: battery_voltage_text
                      text:
                        format: "%.2fV"
                        args: ['x']

  - platform: sd_mmc_card
    type: used_space
    id: sd_used_space

  - platform: sd_mmc_card
    type: free_space
    id: sd_free_space

sd_mmc_card:
  id: sd
  mode_1bit: true
  clk_pin: GPIO21
  cmd_pin: GPIO47
  data0_pin: GPIO14
  data1_pin: GPIO3
  data2_pin: GPIO38
  data3_pin: GPIO48
