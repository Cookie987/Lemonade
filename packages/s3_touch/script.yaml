script:
  - id: wakeup_button
    then:
      - if:
          condition:
            lambda: 'return id(is_sleeping);'
          then:
            - light.turn_on:
                id: backlight
                transition_length: 0.5s
            - lambda: id(is_sleeping)=false;
            - lvgl.animimg.start: ani_battery_charging
            - lvgl.resume:
                lvgl_id: lvgl_1
  
  - id: sleep_button
    then:
      - light.toggle:
          id: backlight
          transition_length: 0.5s
      - lambda: id(is_sleeping)=!id(is_sleeping);
      - lvgl.resume: 
          lvgl_id: lvgl_1
      - lvgl.animimg.start: ani_battery_charging
      - if:
          condition:
            lambda: 'return id(is_sleeping);'
          then:
            - lvgl.pause:
                show_snow: false
                lvgl_id: lvgl_1
            - lvgl.animimg.stop: ani_battery_charging

  - id: littlefs_init
    mode: single
    then:
      - lambda: |-
          esp_vfs_littlefs_conf_t conf = {
            .base_path = "/data",
            .partition_label = "littlefs",
            .format_if_mount_failed = true,
            .dont_mount = false,
          };
          esp_err_t ret = esp_vfs_littlefs_register(&conf);
          if (ret != ESP_OK)
          {
            if (ret == ESP_FAIL){
              ESP_LOGE("LittleFS", "Failed to mount or format filesystem");
            }
            else if (ret == ESP_ERR_NOT_FOUND){
              ESP_LOGE("LittleFS", "Failed to find LittleFS partition");
            }
            else{
              ESP_LOGE("LittleFS", "Failed to initialize LittleFS (%s)", esp_err_to_name(ret));
            }
            return;
          }

          size_t total = 0, used = 0;
          ret = esp_littlefs_info(conf.partition_label, &total, &used);
          if (ret != ESP_OK){
            ESP_LOGE("LittleFS", "Failed to get LittleFS partition information (%s)", esp_err_to_name(ret));
          }
          else{
            ESP_LOGI("LittleFS", "Mounted LittleFS. Partition size: total: %d, used: %d", total, used);
          }

  - id: set_background_img
    mode: single
    then:
      - lambda: |-
          ESP_LOGI("987IoT", "Selected ZSV IoT background image.");
          struct stat st;
          const char *LVGL_FILE_PATH = "A:/data/custom_bg.jpg";
          ESP_LOGI("987IoT", "Have custom background image.");
          if (id(background_image) == nullptr) {
              ESP_LOGW("987IoT", "LVGL image object (background_image) not initialized.");
              return; 
          }
          lv_img_set_src(id(background_image), LVGL_FILE_PATH);
          ESP_LOGI("987IoT", "Background image source updated form LittleFS.");

  - id: get_background_img
    mode: single
    then:
      - mqtt.publish_json:
          topic: !lambda |-
            return "background/request";
          payload: |-
            root["mac"] = id(text_sensor_mac_address).state;
      - lambda: |-
          // 下载图片
          auto mac = id(text_sensor_mac_address).state;

          id(mqtt_client).subscribe_json("background/response/" + mac, [=](const std::string &topic, JsonObject root) {

            // 删掉已有图片
            struct stat st;
            if (stat("/data/custom_bg.jpg", &st) == 0)
            {
              unlink("/data/custom_bg.jpg");
              ESP_LOGI("987IoT", "Deleted existing background image.");
            }
            // --- 1. 获取 Base64 字符串 ---
            // 假设 JSON 路径 "image_base64" 存在且为字符串
            const char *base64_str = root["image_base64"].as<const char *>();
            
            if (base64_str == nullptr) {
                ESP_LOGW("987IoT", "'image_base64' field is missing or not a string.");
                return;
            }
            
            size_t base64_len = strlen(base64_str);
            if (base64_len == 0) {
                ESP_LOGW("987IoT", "Received empty Base64 string.");
                return;
            }
            std::string start_of_str(base64_str, std::min((size_t)20, base64_len));
            ESP_LOGI("987IoT", "Base64 string starts with: %s", start_of_str.c_str());
            // --- 2. Base64 解码 ---
            size_t decoded_max_len = base64_len / 4 * 3 + 4;
            // 使用 std::vector 存储解码后的二进制数据
            std::vector<uint8_t> decoded_data(decoded_max_len);
            size_t decoded_len = 0;
            
            // 使用 mbedtls Base64 解码
            int ret = mbedtls_base64_decode(
                decoded_data.data(),
                decoded_max_len,
                &decoded_len,
                (const unsigned char *)base64_str,
                base64_len
            );

            if (ret != 0) {
                ESP_LOGE("987IoT", "Base64 decode failed with code %d!", ret);
                return;
            }
            
            ESP_LOGI("987IoT", "Decoded image size: %zu bytes.", decoded_len);
            
            // --- 3. 写入 littlefs ---
            const char* LOCAL_FILE_PATH = "/data/custom_bg.jpg";
            // 以二进制模式打开文件
            std::ofstream file(LOCAL_FILE_PATH, std::ios::binary);
            if (!file.is_open()) {
                ESP_LOGE("987IoT", "Failed to open file %s for writing!", LOCAL_FILE_PATH);
                return;
            }
            // 写入实际解码的数据
            file.write(reinterpret_cast<const char*>(decoded_data.data()), decoded_len);
            // 检查写入是否成功
            if (!file.good()) {
                ESP_LOGE("987IoT", "File write failed. Expected %zu bytes.", decoded_len);
                file.close();
                return;
            }
            file.close();
            ESP_LOGI("987IoT", "File saved successfully: %s (%zu bytes)", LOCAL_FILE_PATH, decoded_len);
            const char *LVGL_FILE_PATH = "A:/data/custom_bg.jpg";
            if (id(background_image) == nullptr) {
                ESP_LOGW("987IoT", "LVGL image object (background_image) not initialized.");
                return; 
            }
            lv_img_set_src(id(background_image), LVGL_FILE_PATH);
            ESP_LOGI("987IoT", "Image source updated.");
          });
          

  - id: update_date
    then:
      - if:
          condition:
            lambda: 'return !id(is_sleeping);'
          then:
            - lvgl.label.update:
                id: lbl_topbar_time
                text: !lambda |-
                  int x = id(rssi).state;
                  std::string icon;
                  if (x >= -50) {
                    icon = "\U000F0928"; // mdi-wifi-strength-4
                  } else if (x >= -65) {
                    icon = "\U000F0925"; // mdi-wifi-strength-3
                  } else if (x >= -80) {
                    icon = "\U000F0922"; // mdi-wifi-strength-2
                  } else if (x >= -95) {
                    icon = "\U000F091F"; // mdi-wifi-strength-1
                  } else {
                    icon = "\U000F092E"; // mdi-wifi-strength-off-outline
                  }
                  float v = id(battery_voltage).state;
                  // 保留两位小数（四舍五入）
                  float rounded = (int)(v * 100 + 0.5f) / 100.0f;
                  // 电压映射到百分比
                  // 4.15V = 100%，3.55V = 0%
                  float percent = (rounded - 3.55f) / (4.15f - 3.55f) * 100.0f;
                  if (percent > 100.0f) percent = 100.0f;
                  if (percent < 0.0f) percent = 0.0f;
                  // 根据电量百分比选择 MDI 图标
                  std::string iconbat;
                  if (percent == 100.0f)
                      iconbat = "\U000F0079"; // mdi-battery (full)
                  else if (percent > 90)
                      iconbat = "\U000F0082"; // mdi-battery-90
                  else if (percent > 80)
                      iconbat = "\U000F0081"; // mdi-battery-80
                  else if (percent > 70)
                      iconbat = "\U000F0080"; // mdi-battery-70
                  else if (percent > 60)
                      iconbat = "\U000F007F"; // mdi-battery-60
                  else if (percent > 50)
                      iconbat = "\U000F007E"; // mdi-battery-50
                  else if (percent > 40)
                      iconbat = "\U000F007D"; // mdi-battery-40
                  else if (percent > 30)
                      iconbat = "\U000F007C"; // mdi-battery-30
                  else if (percent > 20)
                      iconbat = "\U000F007B"; // mdi-battery-20
                  else if (percent > 10)
                      iconbat = "\U000F007A"; // mdi-battery-10
                  else if (percent >= 0)
                      iconbat = "\U000F008E"; // mdi-battery-outline
                  else
                      iconbat = "\U000F0091"; // mdi-battery-unknown
                  // if (id(usb_input_voltage).state > 4.5) {
                  //     // 充电中图标隐藏
                  //     iconbat = " "; 
                  // }
                  // 格式化电压字符串
                  char bufbat[8];
                  sprintf(bufbat, "%.2f", rounded);
                  // 低电量红色警告（<3.4V）
                  std::string batstr;
                  if (v < 3.55f or percent < 20.0f)
                      batstr = "#FF0000 " + iconbat + " " + bufbat + "V#";
                  else
                      batstr = iconbat + " " + bufbat + "V";
                  return icon + " " + batstr;

            - lambda: |-
                // 更新日期显示
                auto t = id(ntp_time).now();
                char date_buf[30];
                char weekday_buf[10];
                // ESPHome中day_of_week: 1=Sunday, 2=Monday, ..., 7=Saturday
                switch(t.day_of_week) {
                  case 1: strcpy(weekday_buf, "星期日"); break;
                  case 2: strcpy(weekday_buf, "星期一"); break;
                  case 3: strcpy(weekday_buf, "星期二"); break;
                  case 4: strcpy(weekday_buf, "星期三"); break;
                  case 5: strcpy(weekday_buf, "星期四"); break;
                  case 6: strcpy(weekday_buf, "星期五"); break;
                  case 7: strcpy(weekday_buf, "星期六"); break;
                  default: strcpy(weekday_buf, "未知"); break;
                }
                snprintf(date_buf, sizeof(date_buf), "%04d-%02d-%02d %s",
                        t.year, t.month, t.day_of_month, weekday_buf);
                lv_label_set_text(id(date_label), date_buf);
            - lvgl.label.update:
                id: lbl_topbar_date
                text: !lambda |-
                  // 00:00 格式
                  auto t = id(ntp_time).now();
                  char buf1[6];
                  snprintf(buf1, sizeof(buf1), "%02d:%02d", t.hour, t.minute);
                  static const char * const day_names[] = {"Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"};
                  char buf[20];
                  auto a = day_names[id(ntp_time).now().day_of_week - 1]; // Adjust for 0-based index
                  snprintf(buf, sizeof(buf), "%02d.%02d %s", t.month, t.day_of_month, a);
                  return std::string(buf1) + " " + std::string(buf);

  - id: update_time
    then:
      - if:
          condition:
            lambda: 'return !id(is_sleeping);'
          then:
            - lambda: |-
                // 更新时间显示
                auto t = id(ntp_time).now();
                char buf[9];
                snprintf(buf, sizeof(buf), "%02d:%02d:%02d", t.hour, t.minute, t.second);
                lv_label_set_text(id(time_label), buf);

  - id: get_iot_info
    then:
      - mqtt.publish_json:
          topic: !lambda |-
            return "zsv/cfg/request";
          payload: |-
            root["mac"] = id(text_sensor_mac_address).state;
      - mqtt.publish_json:
          topic: !lambda |-
            return "uid/request";
          payload: |-
            root["mac"] = id(text_sensor_mac_address).state;
      - delay: 2s
      - lambda: |-
          ESP_LOGD("987IoT", "Started updating config");
          std::string mac = id(text_sensor_mac_address).state;
          id(mqtt_client).subscribe("zsv/cfg/response/" + mac, [=](const std::string &topic, const std::string &payload) {
              ESP_LOGD("987IoT", "Got config response");
              std::ofstream file("/data/cfg.json");
              file << payload;
              file.close();
              ESP_LOGD("987IoT", "Config response saved.");
          });
          id(mqtt_client).subscribe("uid/response/" + mac, [=](const std::string &topic, const std::string &payload) {
              ESP_LOGD("987IoT", "Got special uid response");
              std::ofstream file("/data/uid.json");
              file << payload;
              file.close();
              ESP_LOGD("987IoT", "Special uid response saved.");
          });
          // 获取时间日期
          auto t = id(ntp_time).now();
          id(zsv_iot_last_status) = t.strftime("%Y-%m-%d %H:%M:%S");

  - id: prase_iot_info
    then:
      - lambda: |-
          std::string config_json;
          // 读取文件
          ESP_LOGD("987IoT", "Started parsing cfg.json");
          std::ifstream file("/data/cfg.json");
          if (!file.is_open()) {
              ESP_LOGW("987IoT", "Config file not found.");
              return;
          }
          std::string line;
          while (std::getline(file, line)) {
              config_json += line + "\n";
          }
          file.close();
          int wifi_sum = 0;
          std::string desc;
          ESP_LOGD("987IoT", "JSON: '%s'", config_json.c_str());
          json::parse_json(config_json, [&](JsonVariant root) -> bool {
              if (!root["uid"]) {
                ESP_LOGE("987IoT", "JSON missing 'uid' key!");
                return false;
              }
              if (root["morewifi"]) {
                JsonArray morewifi = root["morewifi"];
                for (JsonObject item : morewifi) {
                  wifi_sum++;
                }
              }
              if (root["desc"]) {
                desc = root["desc"].as<std::string>();
              }
              id(uid)= root["uid"].as<std::string>();
              return true;
          });

          // 特殊uid处理
          std::string uid_json;
          std::ifstream file2("/data/uid.json");
          if (!file2.is_open()) {
              ESP_LOGW("987IoT", "Special uid file not found.");
              return;
          }
          std::string line2;
          while (std::getline(file2, line2)) {
              uid_json += line2 + "\n";
          }
          file2.close();
          json::parse_json(uid_json, [&](JsonVariant root) -> bool { 
              if (root["error"]) {
                ESP_LOGW("987IoT", "Special uid JSON error. Using ZSV uid.");
                return false;
              }
              id(uid)= root["uid"].as<std::string>();
              return true;
          });
          // 更新标签
          std::string info_text = "${lemonade_version}\n";
          info_text += "API版本：2\n";
          info_text += "WiFi数量：" + std::to_string(wifi_sum) + "\n";
          info_text += "设备描述：" + desc + "\n";
          info_text += "获取时间：" + id(zsv_iot_last_status);
          ESP_LOGD("987IoT", "Info text: '%s'", info_text.c_str());
          lv_label_set_text(id(lbl_iot_info), info_text.c_str());
          lv_label_set_text(id(lbl_uid), id(uid).c_str());
      - lambda: global_preferences->sync();



  - id: refresh_info_page
    then:
      - lambda: |-
          using namespace esphome;

          // 获取 WiFi 全局对象
          auto wifi = wifi::global_wifi_component;
          if (wifi == nullptr) return;

          std::string ip = "N/A";
          auto ip_list = wifi->get_ip_addresses();
          if (!ip_list.empty()) {
            ip = ip_list[0].str();
          }

          std::string mac = "none";
          std::string commit = "fffffff";

          auto cpu_freq1 = id(cpu_freq).state / 1000000;
          std::string cpu_freq = std::to_string((int)cpu_freq1) + "MHz";  
          std::string cpu_temp = std::to_string((int)id(internal_temp).state) + "°C";

          mac = id(text_sensor_mac_address).state;
          commit = id(lemonade_git_commit_sha).state.substr(0, 7);
          
          auto esphome_ver = id(esphome_version).state;
          auto ssid_val = id(ssid).state;
          auto rssi_val = id(rssi).state;
          std::string rssi_str = std::to_string((int)rssi_val);
          if (!id(wifi_switch).state) {
            ssid_val = "(已关闭)";
            rssi_str = "-∞";
          }

          
          if (ssid_val == "") {
            ssid_val = "(未连接)";
            rssi_str = "-∞";
          }
          // 拼接文字
          char buf[256];
          snprintf(buf, sizeof(buf),
                  "运行时间: %s "
                  "CPU: 40~%s "
                  "%s \n"
                  "型号：${lemonade_device_model} MAC: %s\n\nLemonade OS ${lemonade_version}"
                  " %s\n"
                  "ESPHome %s\nOS by Cookie987, HW by ZSVStudio.\n©2025 RedCookieStudios.",
                  id(uptime_text).state.c_str(),
                  cpu_freq.c_str(),
                  cpu_temp.c_str(),
                  mac.c_str(),
                  commit.c_str(),
                  esphome_ver.c_str()
                  );

          char buf_wifi_info[256];
          snprintf(buf_wifi_info, sizeof(buf_wifi_info),
                  "SSID: %s   "
                  "RSSI: %s dBm\n"
                  "IP: %s  "
                  "MAC: %s\n",
                  ssid_val.c_str(),
                  rssi_str.c_str(),
                  ip.c_str(),
                  mac.c_str()
                  );
          lv_label_set_text(id(lbl_wifi_info), buf_wifi_info);
          lv_label_set_text(id(lbl_sysinfo), buf);

  - id: zsv_iot_update
    mode: single
    then:
      - http_request.get:
          url: !lambda |-
            std::string url, mac, acturl;
            url = "${zsv_iot_url}cfg?id=";
            mac = id(text_sensor_mac_address).state;
            
            // 检查MAC地址是否为空或无效
            if (mac.empty() || mac == "" || mac.length() < 10) {
              ESP_LOGE("main", "MAC address is invalid or empty: '%s'", mac.c_str());
              return "${zsv_iot_url}cfg?id=000000000000";
            }
            
            acturl = url + mac;
            ESP_LOGD("zsv_iot", " %s", acturl.c_str());
            return acturl.c_str();
          capture_response: true
          on_response:
            then:
              - lambda: |- 
                  ESP_LOGD("zsv_iot", "BODY: '%s'", body.c_str());
              - if:
                  condition:
                      lambda: return response->status_code == 200;
                  then:
                      - lambda: |-
                          json::parse_json(body, [](JsonObject root) -> bool {
                              if (root["producetime"]) {
                                id(zsv_iot_last_status) =(root["producetime"]).as<std::string>();
                              }
                              if (root["morewifi"]) {
                                auto wifi = wifi::global_wifi_component;
                                if (wifi == nullptr) return false;
                                JsonArray morewifi = root["morewifi"];
                                int i = 0;
                                wifi->clear_saved_wifi_stas();
                                ESP_LOGI("zsv_iot", "Cleared user saved WiFi STA");
                                for (JsonObject item : morewifi) {
                                  i++;
                                  wifi->append_wifi_sta(item["ssid"].as<std::string>(), item["password"].as<std::string>());
                                  ESP_LOGI("zsv_iot", "Saved WiFi STA: %s", item["ssid"].as<std::string>().c_str());
                                }
                              }
                              if (root["desc"]) {
                                ESP_LOGI("zsv_iot", "Got description: %s", root["desc"].as<std::string>());
                              }
                              auto t = id(ntp_time).now();
                              std::string msg = "成功更新于 " + t.strftime("%H:%M:%S") + "重启WiFi以应用更改" + "\n" + root["desc"].as<std::string>();
                              lv_label_set_text(id(lbl_zsv_iot_info), msg.c_str());
                              return true;
                          });
                          return;
                      - logger.log:
                          format: "Response status: %d, message %s"
                          args: [ 'response->status_code', 'body.c_str()' ]
                  else:
                      - logger.log:
                          format: "Error: Response status: %d, message %s"
                          args: [ 'response->status_code', 'body.c_str()' ]
                      - lambda: |-
                          auto t = id(ntp_time).now();
                          std::string msg = std::to_string(response->status_code) + " 失败。 于" + t.strftime("%H:%M:%S");
                          lv_label_set_text(id(lbl_zsv_iot_info), msg.c_str());