  # 创建或修改通知
  # para1: 新的通知内容
  # para2: （若非空）用于匹配并替换已有通知的后缀
  # para3: （若非0）在该毫秒数后关闭当前显示的通知内容
  - id: show_notification
    parameters:
      notification_message: string
      suffix: string
      delay_ms: int
    mode: parallel
    then:
      - lvgl.resume:
          lvgl_id: lvgl_1
      - lambda: |
          lv_obj_t * screen = lv_disp_get_layer_top(lvgl_1->get_disp());
          lv_obj_t * target_bar = nullptr;
          void * const NOTIFICATION_OPEN = reinterpret_cast<void *>(0xDEAD);
          const int32_t BAR_Y_HIDE = -45; // 隐藏时的 Y 坐标
          const int32_t BAR_Y_SHOW = 10;  // 显示时的 Y 坐标

          if(suffix != "") {
            // --- 1. 查找是否已有符合条件的通知条 ---
            uint32_t child_cnt = lv_obj_get_child_cnt(screen);
            for(uint32_t i = 0; i < child_cnt; i++) {
              lv_obj_t * child = lv_obj_get_child(screen, i);
              // 检查标记是否为我们定义的通知条 (0xDEAD)
              if(lv_obj_get_user_data(child) == NOTIFICATION_OPEN) {
                lv_obj_t * lbl = lv_obj_get_child(child, 0); // 找到里面的 Label
                if(lbl) {
                  std::string current_text = lv_label_get_text(lbl);
                  // 检查字符串是否以指定后缀结尾
                  if(current_text.size() >= suffix.size() &&
                    current_text.compare(current_text.size() - suffix.size(), suffix.size(), suffix) == 0) {
                      target_bar = child;
                      break;
                  }
                }
              }
            }
          }

          if(target_bar) {
            // 找到了旧通知，直接更新文字
            lv_obj_t * lbl = lv_obj_get_child(target_bar, 0);
            lv_obj_move_foreground(target_bar);
            lv_label_set_text(lbl, notification_message.c_str());
            // 视觉反馈：让它“弹跳”一下，提醒用户内容更新了
            lv_anim_t a_shake;
            lv_anim_init(&a_shake);
            lv_anim_set_var(&a_shake, target_bar);
            lv_anim_set_values(&a_shake, BAR_Y_SHOW, BAR_Y_SHOW + 8);
            lv_anim_set_exec_cb(&a_shake, (lv_anim_exec_xcb_t)lv_obj_set_y);
            lv_anim_set_time(&a_shake, 100);
            lv_anim_set_playback_time(&a_shake, 100); // 弹下去再缩回来
            lv_anim_start(&a_shake);
            // 旧通知已经加过callback
            return;
          }

          // 1. 创建背景框 (Parent)
          lv_obj_t * obj_notification_bar = lv_obj_create(screen);
          lv_obj_set_size(obj_notification_bar, 240, 25);
          lv_obj_align(obj_notification_bar, LV_ALIGN_TOP_MID, 0, BAR_Y_HIDE); // 初始位置在屏幕上方 -40，完全藏住
          lv_obj_set_scrollbar_mode(obj_notification_bar, LV_SCROLLBAR_MODE_OFF);
          lv_obj_set_style_bg_opa(obj_notification_bar, 175, 0); // 45% 透明度 (255 * 0.7 ≈ 175)
          lv_obj_set_style_pad_all(obj_notification_bar, 0, 0);
          lv_obj_set_user_data(obj_notification_bar, NOTIFICATION_OPEN);

          // 2. 创建标签 (Child) - 注意第一个参数传入 obj_notification_bar
          lv_obj_t * lbl_notification = lv_label_create(obj_notification_bar);
          lv_label_set_text(lbl_notification, notification_message.c_str());
          lv_obj_set_width(lbl_notification, 220);
          lv_label_set_long_mode(lbl_notification, LV_LABEL_LONG_DOT);
          lv_obj_set_style_text_align(lbl_notification, LV_TEXT_ALIGN_CENTER, 0);
          lv_obj_align(lbl_notification, LV_ALIGN_CENTER, 0, 0); // 在父框内居中
          if (id(notification_amount) >= 15) {
            ESP_LOGW("Notification", "Reached the maximum number of notifications. No more notifications will be displayed.");
            lv_obj_del(obj_notification_bar);
            return;
          } //最多显示15条
          id(notification_amount) += 1;

          // 播放动画
          lv_anim_t a_in;
          lv_anim_init(&a_in);
          lv_anim_set_var(&a_in, obj_notification_bar);
          lv_anim_set_values(&a_in, BAR_Y_HIDE, BAR_Y_SHOW); // 从屏幕外滑入
          lv_anim_set_exec_cb(&a_in, (lv_anim_exec_xcb_t)lv_obj_set_y);
          lv_anim_set_time(&a_in, 500);

          // 使用 overshoot 路径，会有一个帅气的回弹效果
          lv_anim_set_path_cb(&a_in, lv_anim_path_overshoot);

          lv_anim_start(&a_in);

          // --- 动画收回逻辑 ---

          // 3. 给背景框添加点击事件
          lv_obj_add_event_cb(obj_notification_bar, [](lv_event_t * e) {
            lv_obj_t * bar = static_cast<lv_obj_t *>(lv_event_get_target(e));
            if (bar == nullptr || !lv_obj_is_valid(bar)) {
              return;
            }

            void * const NOTIFICATION_OPEN = reinterpret_cast<void *>(0xDEAD);
            void * const NOTIFICATION_CLOSING = reinterpret_cast<void *>(0xBEEF);
            if (lv_obj_get_user_data(bar) != NOTIFICATION_OPEN) {
              return;
            }
            lv_obj_set_user_data(bar, NOTIFICATION_CLOSING);
            lv_anim_del(bar, (lv_anim_exec_xcb_t)lv_obj_set_y);

            // 创建收回动画
            lv_anim_t a;
            lv_anim_init(&a);
            lv_anim_set_var(&a, bar);

            lv_anim_set_values(&a, lv_obj_get_y(bar), BAR_Y_HIDE);
            lv_anim_set_exec_cb(&a, (lv_anim_exec_xcb_t)lv_obj_set_y);
            lv_anim_set_time(&a, 300);
            lv_anim_set_path_cb(&a, lv_anim_path_ease_in);

            // 动画结束后的清理工作
            lv_anim_set_ready_cb(&a, [](lv_anim_t * anim) {
              lv_obj_t * target_bar = (lv_obj_t *)anim->var;
              void * const NOTIFICATION_CLOSING = reinterpret_cast<void *>(0xBEEF);
              void * const NOTIFICATION_DELETED = reinterpret_cast<void *>(0xC0DE);
              if (target_bar == nullptr || !lv_obj_is_valid(target_bar)) {
                return;
              }
              if (lv_obj_get_user_data(target_bar) != NOTIFICATION_CLOSING) {
                return;
              }
              lv_obj_set_user_data(target_bar, NOTIFICATION_DELETED);
              lv_obj_del(target_bar);
              if (id(notification_amount) > 0) {
                id(notification_amount) -= 1;
              }
            });
            lv_anim_start(&a);
          }, LV_EVENT_CLICKED, NULL);
      - if:
          condition:
            lambda: 'if (delay_ms > 0) return true; else return false;'
          then:
            - delay: !lambda 'return delay_ms;'
            - lambda: |
                id(close_notification)->execute(notification_message);
      - if:
          condition:
            lambda: 'return id(is_sleeping);'
          then:
            - lvgl.pause:
                show_snow: false
                lvgl_id: lvgl_1
  # 关闭通知
  # para1: 要关闭的通知消息的后缀
  - id: close_notification
    parameters:
      # 匹配通知消息的后缀
      notification_message: string
    mode: queued
    then:
      - lambda: |
          lv_obj_t * screen = lv_disp_get_layer_top(lvgl_1->get_disp());
          lv_obj_t * target_bar = nullptr;
          std::string suffix = notification_message;
          void * const NOTIFICATION_OPEN = reinterpret_cast<void *>(0xDEAD);
          void * const NOTIFICATION_CLOSING = reinterpret_cast<void *>(0xBEEF);
          void * const NOTIFICATION_DELETED = reinterpret_cast<void *>(0xC0DE);
          const int32_t BAR_Y_HIDE = -45; // 隐藏时的 Y 坐标

          // --- 1. 查找是否已有符合条件的通知条 ---
          uint32_t child_cnt = lv_obj_get_child_cnt(screen);
          for(uint32_t i = 0; i < child_cnt; i++) {
            lv_obj_t * child = lv_obj_get_child(screen, i);
            // 检查标记是否为我们定义的通知条 (0xDEAD)
            if(lv_obj_get_user_data(child) == NOTIFICATION_OPEN) {
              lv_obj_t * lbl = lv_obj_get_child(child, 0); // 找到里面的 Label
              if(lbl) {
                std::string current_text = lv_label_get_text(lbl);
                // 检查字符串是否以指定后缀结尾
                if(current_text.size() >= suffix.size() &&
                  current_text.compare(current_text.size() - suffix.size(), suffix.size(), suffix) == 0) {
                    target_bar = child;
                    break;
                }
              }
            }
          }
          if(target_bar) {
            if (!lv_obj_is_valid(target_bar) || lv_obj_get_user_data(target_bar) != NOTIFICATION_OPEN) {
              return;
            }
            lv_obj_set_user_data(target_bar, NOTIFICATION_CLOSING);
            lv_anim_del(target_bar, (lv_anim_exec_xcb_t)lv_obj_set_y);

            // 创建收回动画
            lv_anim_t a;
            lv_anim_init(&a);
            lv_anim_set_var(&a, target_bar);

            lv_anim_set_values(&a, lv_obj_get_y(target_bar), BAR_Y_HIDE);
            lv_anim_set_exec_cb(&a, (lv_anim_exec_xcb_t)lv_obj_set_y);
            lv_anim_set_time(&a, 300);
            lv_anim_set_path_cb(&a, lv_anim_path_ease_in);

            // 动画结束后的清理工作
            lv_anim_set_ready_cb(&a, [](lv_anim_t * anim) {
              lv_obj_t * bar = (lv_obj_t *)anim->var;
              void * const NOTIFICATION_CLOSING = reinterpret_cast<void *>(0xBEEF);
              void * const NOTIFICATION_DELETED = reinterpret_cast<void *>(0xC0DE);
              if (bar == nullptr || !lv_obj_is_valid(bar)) {
                return;
              }
              if (lv_obj_get_user_data(bar) != NOTIFICATION_CLOSING) {
                return;
              }
              lv_obj_set_user_data(bar, NOTIFICATION_DELETED);
              lv_obj_del(bar);
              if (id(notification_amount) > 0) {
                id(notification_amount) -= 1;
              }
            });
            lv_anim_start(&a);
          }
          else{
            ESP_LOGW("Notification", "No matching notification found.");
          }

  - id: init_main_screen
    then:
      - lambda: |
            struct IconItem {
              const char *id;
              const char *title;
              lv_obj_t *obj;
              lv_obj_t *page;
              int16_t default_x;
              int16_t default_y;
            };
            struct EditState {
              bool initialized;
              bool edit_mode;
              bool suppress_click;
              lv_obj_t *dragging;
              int16_t drag_offset_x;
              int16_t drag_offset_y;
              int16_t drag_start_x;
              int16_t drag_start_y;
              int16_t grid_x[16];
              size_t grid_x_count;
              int16_t grid_y[16];
              size_t grid_y_count;
              lv_obj_t *tileview;
              IconItem *icons;
              size_t icon_count;
            };
            struct RefreshContext {
              EditState *state;
              lv_obj_t *tile_appcenter;
            };
            struct Helper {
              static bool str_eq(const char *a, const char *b) {
                if (a == nullptr || b == nullptr) return false;
                while (*a && *b) {
                  if (*a != *b) return false;
                  a++;
                  b++;
                }
                return *a == *b;
              }
                  static void add_unique(int16_t v, int16_t *arr, size_t *count) {
                    for (size_t i = 0; i < *count; i++) {
                      if (arr[i] == v) return;
                    }
                if (*count < 8) {
                  arr[*count] = v;
                  (*count)++;
                }
              }
              static int16_t nearest(int16_t v, const int16_t *arr, size_t count) {
                if (count == 0) return v;
                int16_t best = arr[0];
                int32_t best_d = (int32_t) v - (int32_t) arr[0];
                if (best_d < 0) best_d = -best_d;
                for (size_t i = 1; i < count; i++) {
                  int32_t d = (int32_t) v - (int32_t) arr[i];
                  if (d < 0) d = -d;
                  if (d < best_d) {
                    best = arr[i];
                    best_d = d;
                  }
                }
                return best;
              }
              static IconItem *find_by_id(EditState *st, const char *id) {
                if (st == nullptr || id == nullptr) return nullptr;
                for (size_t i = 0; i < st->icon_count; i++) {
                  if (str_eq(st->icons[i].id, id)) {
                    return &st->icons[i];
                  }
                }
                return nullptr;
              }
              static IconItem *find_by_obj(EditState *st, lv_obj_t *obj) {
                if (st == nullptr || obj == nullptr) return nullptr;
                for (size_t i = 0; i < st->icon_count; i++) {
                  if (st->icons[i].obj == obj) {
                    return &st->icons[i];
                  }
                }
                return nullptr;
              }
              static int find_index_by_obj(EditState *st, lv_obj_t *obj) {
                if (st == nullptr || obj == nullptr) return -1;
                for (size_t i = 0; i < st->icon_count; i++) {
                  if (st->icons[i].obj == obj) {
                    return (int) i;
                  }
                }
                return -1;
              }
                  static IconItem *find_by_pos(EditState *st, int16_t x, int16_t y, lv_obj_t *exclude) {
                    if (st == nullptr) return nullptr;
                    for (size_t i = 0; i < st->icon_count; i++) {
                      lv_obj_t *obj = st->icons[i].obj;
                      if (obj == nullptr || obj == exclude) continue;
                      int16_t ox = get_offset_x(obj);
                      int16_t oy = get_offset_y(obj);
                      if (ox == x && oy == y) {
                        return &st->icons[i];
                      }
                    }
                    return nullptr;
                  }
                  static void apply_pos(IconItem *icon, int16_t x, int16_t y) {
                    if (icon == nullptr || icon->obj == nullptr) return;
                    set_offset_pos(icon->obj, x, y);
                  }
                  static int16_t get_offset_x(lv_obj_t *obj) {
                    if (obj == nullptr) return 0;
                    lv_obj_t *parent = lv_obj_get_parent(obj);
                    if (parent == nullptr) return (int16_t) lv_obj_get_x(obj);
                    int16_t pw = (int16_t) lv_obj_get_width(parent);
                    int16_t ow = (int16_t) lv_obj_get_width(obj);
                    int16_t center_left = (int16_t) ((pw - ow) / 2);
                    return (int16_t) (lv_obj_get_x(obj) - center_left);
                  }
                  static int16_t get_offset_y(lv_obj_t *obj) {
                    if (obj == nullptr) return 0;
                    lv_obj_t *parent = lv_obj_get_parent(obj);
                    if (parent == nullptr) return (int16_t) lv_obj_get_y(obj);
                    int16_t ph = (int16_t) lv_obj_get_height(parent);
                    int16_t oh = (int16_t) lv_obj_get_height(obj);
                    int16_t center_top = (int16_t) ((ph - oh) / 2);
                    return (int16_t) (lv_obj_get_y(obj) - center_top);
                  }
                  static void set_offset_pos(lv_obj_t *obj, int16_t off_x, int16_t off_y) {
                    if (obj == nullptr) return;
                    lv_obj_align(obj, LV_ALIGN_CENTER, off_x, off_y);
                  }
                  static void anim_set_offset_x(void *obj, int32_t v) {
                    lv_obj_t *o = (lv_obj_t *) obj;
                    int16_t y = get_offset_y(o);
                    lv_obj_align(o, LV_ALIGN_CENTER, (int16_t) v, y);
                  }
                  static void stop_wiggle(lv_obj_t *obj) {
                    if (obj == nullptr) return;
                    lv_anim_del(obj, (lv_anim_exec_xcb_t) anim_set_offset_x);
                  }
                  static void start_wiggle(lv_obj_t *obj, uint32_t delay_ms) {
                    if (obj == nullptr) return;
                    stop_wiggle(obj);
                    int16_t x = get_offset_x(obj);
                    lv_anim_t a;
                    lv_anim_init(&a);
                    lv_anim_set_var(&a, obj);
                    lv_anim_set_exec_cb(&a, (lv_anim_exec_xcb_t) anim_set_offset_x);
                    lv_anim_set_values(&a, x - 2, x + 2);
                lv_anim_set_time(&a, 140);
                lv_anim_set_playback_time(&a, 140);
                lv_anim_set_repeat_count(&a, LV_ANIM_REPEAT_INFINITE);
                lv_anim_set_delay(&a, delay_ms);
                lv_anim_start(&a);
              }
              static void start_all_wiggle(EditState *st) {
                if (st == nullptr) return;
                for (size_t i = 0; i < st->icon_count; i++) {
                  if (st->icons[i].obj == nullptr) continue;
                  start_wiggle(st->icons[i].obj, (uint32_t) (i * 40));
                }
              }
              static void stop_all_wiggle(EditState *st) {
                if (st == nullptr) return;
                for (size_t i = 0; i < st->icon_count; i++) {
                  if (st->icons[i].obj == nullptr) continue;
                  stop_wiggle(st->icons[i].obj);
                }
              }
                  static void snap_all(EditState *st) {
                    if (st == nullptr) return;
                    for (size_t i = 0; i < st->icon_count; i++) {
                      lv_obj_t *obj = st->icons[i].obj;
                      if (obj == nullptr) continue;
                      int16_t x = nearest(get_offset_x(obj), st->grid_x, st->grid_x_count);
                      int16_t y = nearest(get_offset_y(obj), st->grid_y, st->grid_y_count);
                      set_offset_pos(obj, x, y);
                    }
                  }
                  static void save_layout(EditState *st) {
                    if (st == nullptr) return;
                    JsonDocument doc;
                JsonArray arr = doc["icons"].to<JsonArray>();
                    for (size_t i = 0; i < st->icon_count; i++) {
                      lv_obj_t *obj = st->icons[i].obj;
                      if (obj == nullptr) continue;
                      JsonObject item = arr.add<JsonObject>();
                      item["id"] = st->icons[i].id;
                      item["x"] = get_offset_x(obj);
                      item["y"] = get_offset_y(obj);
                    }
                std::ofstream file("/data/app_layout.json");
                if (!file.is_open()) {
                  ESP_LOGW("Layout", "Failed to open /data/app_layout.json for write.");
                  return;
                }
                serializeJson(doc, file);
                file.close();
              }
              static void load_layout(EditState *st) {
                if (st == nullptr) return;
                std::ifstream file("/data/app_layout.json");
                if (!file.is_open()) return;
                JsonDocument doc;
                DeserializationError err = deserializeJson(doc, file);
                file.close();
                if (err) {
                  ESP_LOGW("Layout", "Failed to parse /data/app_layout.json");
                  return;
                }
                if (!doc["icons"].is<JsonArray>()) return;
                for (JsonObject item : doc["icons"].as<JsonArray>()) {
                  const char *id = item["id"] | "";
                  int16_t x = item["x"] | 0;
                  int16_t y = item["y"] | 0;
                  IconItem *icon = find_by_id(st, id);
                  if (icon == nullptr || icon->obj == nullptr) continue;
                  x = nearest(x, st->grid_x, st->grid_x_count);
                  y = nearest(y, st->grid_y, st->grid_y_count);
                  apply_pos(icon, x, y);
                }
              }
            };

            static const size_t MAX_ICONS = 32;
            static const size_t BASE_ICONS = 5;
            static IconItem icons[MAX_ICONS];
            static std::string icon_ids[MAX_ICONS];
            static std::string icon_titles[MAX_ICONS];
            static std::string icon_paths[MAX_ICONS];
            static std::string icon_page_ids[MAX_ICONS];
            static std::string icon_init_paths[MAX_ICONS];
            static bool icon_init_ran[MAX_ICONS];
            static std::string icon_main_paths[MAX_ICONS];
            static bool icon_main_ran[MAX_ICONS];
            static lv_obj_t *icon_pages[MAX_ICONS];
            static bool icon_event_bound[MAX_ICONS];
            static bool page_refresh_cb_bound = false;
            static RefreshContext refresh_ctx;
            static EditState st = {
              false,
              false,
              false,
              nullptr,
              0,
              0,
              0,
              0,
              {0},
              0,
              {0},
              0,
              nullptr,
              icons,
              BASE_ICONS
            };
            if (st.initialized) {
              ESP_LOGD("AppScan", "Init skipped (already initialized)");
              return;
            }
            st.tileview = id(tileview_main);
            lv_obj_t *btn_done = id(btn_edit_done);
            ESP_LOGD("AppScan", "Init start (tile_appcenter=%p)", tile_appcenter);

            if (tile_appcenter != nullptr) {
              lv_obj_set_scroll_dir(tile_appcenter, LV_DIR_VER);
              lv_obj_set_scrollbar_mode(tile_appcenter, LV_SCROLLBAR_MODE_OFF);
            }

            st.grid_x_count = 3;
            st.grid_x[0] = -96;
            st.grid_x[1] = 0;
            st.grid_x[2] = 96;
            size_t max_rows = (MAX_ICONS + st.grid_x_count - 1) / st.grid_x_count;
            if (max_rows > 16) max_rows = 16;
            st.grid_y_count = max_rows;
            for (size_t r = 0; r < max_rows; r++) {
              st.grid_y[r] = (int16_t) (-45 + (int16_t) r * 90);
            }

            icons[0] = {"settings", "设置", id(img_settings_app), nullptr, 0, 0};
            icons[1] = {"timer", "秒表", id(img_timer_app), nullptr, 0, 0};
            icons[2] = {"message", "信息", id(img_message_app), nullptr, 0, 0};
            icons[3] = {"weather", "天气", id(img_weather_app), nullptr, 0, 0};
            icons[4] = {"appstore", "应用商店", id(img_app_store_app), nullptr, 0, 0};
            if (id(img_message_app) != nullptr && id(message_unread_messages_amount_indicator) != nullptr) {
              lv_obj_set_parent(id(message_unread_messages_amount_indicator), id(img_message_app));
              lv_obj_align(id(message_unread_messages_amount_indicator), LV_ALIGN_TOP_RIGHT, -4, 4);
            }
            for (size_t i = 0; i < BASE_ICONS; i++) {
              icon_init_paths[i] = "";
              icon_init_ran[i] = false;
              icon_main_paths[i] = "";
              icon_main_ran[i] = false;
            }
            st.icon_count = BASE_ICONS;

            if (tile_appcenter != nullptr) {
              const char *base = "/sdcard/opt";
              ESP_LOGD("AppScan", "Scanning %s", base);
              DIR *dirp = opendir(base);
              if (dirp != nullptr) {
                struct dirent *ent;
                while ((ent = readdir(dirp)) != nullptr) {
                  const char *name = ent->d_name;
                  if (name == nullptr) continue;
                  if (strcmp(name, ".") == 0 || strcmp(name, "..") == 0) continue;
                  if (st.icon_count >= MAX_ICONS) break;

                  std::string pkg = name;
                  std::string app_dir = std::string(base) + "/" + pkg;
                  struct stat stbuf;
                  if (stat(app_dir.c_str(), &stbuf) != 0) {
                    ESP_LOGD("AppScan", "Skip %s (stat failed)", app_dir.c_str());
                    continue;
                  }
                  if (!S_ISDIR(stbuf.st_mode)) continue;

                  std::string manifest_path = app_dir + "/manifest.json";
                  std::ifstream file(manifest_path);
                  if (!file.is_open()) {
                    ESP_LOGD("AppScan", "No manifest: %s", manifest_path.c_str());
                    continue;
                  }
                  JsonDocument doc;
                  DeserializationError err = deserializeJson(doc, file);
                  file.close();
                  if (err) {
                    ESP_LOGD("AppScan", "Bad manifest: %s", manifest_path.c_str());
                    continue;
                  }

                  std::string current_platform = "${lemonade_app_platform}";
                  bool platform_ok = false;
                  if (doc["platform"].is<JsonArray>()) {
                    for (JsonVariant v : doc["platform"].as<JsonArray>()) {
                      const char *p = v.as<const char *>();
                      if (p != nullptr && Helper::str_eq(p, "${lemonade_app_platform}")) {
                        platform_ok = true;
                        break;
                      }
                    }
                  }
                  if (!platform_ok) {
                    ESP_LOGD("AppScan", "Skip %s (platform mismatch)", pkg.c_str());
                    continue;
                  }

                  const char *app_name = doc["name"] | pkg.c_str();
                  const char *icon_rel = doc["icon"] | "";
                  if (icon_rel[0] == '\0') {
                    ESP_LOGD("AppScan", "Skip %s (icon missing)", pkg.c_str());
                    continue;
                  }

                  size_t idx = st.icon_count;
                  icon_ids[idx] = pkg;
                  icon_titles[idx] = app_name;
                  icon_paths[idx] = std::string("A:") + app_dir + "/" + icon_rel;
                  icon_init_paths[idx] = app_dir + "/init.lua";
                  icon_init_ran[idx] = false;
                  icon_main_paths[idx] = app_dir + "/main.lua";
                  icon_main_ran[idx] = false;

                  lv_obj_t *img = lv_img_create(tile_appcenter);
                  lv_obj_set_size(img, 96, 96);
                  if (auto *runtime_icon = lemonade::runtime_icon::load_png_icon((app_dir + "/" + icon_rel).c_str(), 96, 96)) {
                    lv_img_set_src(img, runtime_icon);
                  } else {
                    lv_img_set_src(img, icon_paths[idx].c_str());
                  }

                  icon_page_ids[idx] = std::string("lv_page_") + pkg;
                  for (auto &ch : icon_page_ids[idx]) {
                    if (ch == '.') ch = '_';
                  }
                  lv_obj_t *page = lv_obj_create(NULL);
                  lv_obj_clear_flag(page, LV_OBJ_FLAG_SCROLLABLE);
                  lv_obj_set_size(page, 320, 240);
                  lv_obj_set_style_bg_color(page, lv_color_hex(0xffffff), 0);

                  lv_obj_set_user_data(page, (void *) icon_page_ids[idx].c_str());
                  esphome::lua_runtime::register_app_page(app_dir, page);

                  icons[idx] = {icon_ids[idx].c_str(), icon_titles[idx].c_str(), img, page, 0, 0};
                  icon_pages[idx] = page;
                  st.icon_count++;
                  ESP_LOGD("AppScan", "Added %s (%s)", pkg.c_str(), icon_paths[idx].c_str());
                }
                closedir(dirp);
              } else {
                ESP_LOGD("AppScan", "Failed to open %s", base);
              }
            } else {
              ESP_LOGD("AppScan", "Skip scan (tile_appcenter is null)");
            }

            st.initialized = true;

            for (size_t i = 0; i < st.icon_count; i++) {
              if (st.icons[i].obj == nullptr) continue;
              lv_obj_add_flag(st.icons[i].obj, LV_OBJ_FLAG_CLICKABLE);
              int16_t off_x = st.grid_x[i % st.grid_x_count];
              size_t row = i / st.grid_x_count;
              int16_t off_y = st.grid_y[row < st.grid_y_count ? row : (st.grid_y_count - 1)];
              Helper::set_offset_pos(st.icons[i].obj, off_x, off_y);
              st.icons[i].default_x = off_x;
              st.icons[i].default_y = off_y;
            }

            Helper::load_layout(&st);

            static auto icon_event_cb = [](lv_event_t *e) {
              EditState *st = (EditState *) lv_event_get_user_data(e);
              if (st == nullptr) return;
              lv_obj_t *obj = static_cast<lv_obj_t *>(lv_event_get_target(e));
              lv_event_code_t code = lv_event_get_code(e);

              if (code == LV_EVENT_DELETE) {
                Helper::stop_wiggle(obj);
                return;
              }

              if (code == LV_EVENT_LONG_PRESSED) {
                if (st->edit_mode) {
                  return;
                }
                st->edit_mode = true;
                st->suppress_click = true;
                id(app_edit_mode) = true;
                if (st->tileview) {
                  lv_obj_clear_flag(st->tileview, LV_OBJ_FLAG_SCROLLABLE);
                }
                Helper::start_all_wiggle(st);
                lv_obj_clear_flag(id(btn_edit_done), LV_OBJ_FLAG_HIDDEN);
                lv_event_stop_bubbling(e);
                lv_event_stop_processing(e);
                return;
              }

              if (code == LV_EVENT_CLICKED || code == LV_EVENT_SHORT_CLICKED) {
                if (st->suppress_click) {
                  st->suppress_click = false;
                  lv_event_stop_bubbling(e);
                  lv_event_stop_processing(e);
                  return;
                }
                if (st->edit_mode) {
                  lv_event_stop_bubbling(e);
                  lv_event_stop_processing(e);
                  return;
                }
                IconItem *icon = Helper::find_by_obj(st, obj);
                if (icon != nullptr && icon->page != nullptr) {
                  int idx = Helper::find_index_by_obj(st, obj);
                  if (idx >= 0 && idx < (int) st->icon_count) {
                    if (!icon_init_paths[idx].empty() && !icon_init_ran[idx]) {
                      ESP_LOGD("AppLua", "Run %s", icon_init_paths[idx].c_str());
                      bool started = id(lua).run_file_async(icon_init_paths[idx].c_str());
                      icon_init_ran[idx] = started;
                      if (!started) {
                        ESP_LOGW("AppLua", "Failed to start init.lua for %s", icon_init_paths[idx].c_str());
                      }
                    }
                    if (!icon_main_paths[idx].empty() && !icon_main_ran[idx]) {
                      ESP_LOGD("AppLua", "Run %s", icon_main_paths[idx].c_str());
                      id(lua).run_file_async(icon_main_paths[idx].c_str());
                      icon_main_ran[idx] = false;
                    }
                  }
                  lv_obj_clear_flag(id(lbl_topbar_title), LV_OBJ_FLAG_HIDDEN);
                  lv_obj_clear_flag(id(lbl_topbar_date), LV_OBJ_FLAG_HIDDEN);
                  lv_obj_clear_flag(id(lbl_topbar_time), LV_OBJ_FLAG_HIDDEN);
                  if (icon->title != nullptr) {
                    lv_label_set_text(id(lbl_topbar_title), icon->title);
                  }
                  lv_scr_load_anim(icon->page, LV_SCR_LOAD_ANIM_FADE_IN, 200, 0, false);
                  lv_event_stop_bubbling(e);
                  lv_event_stop_processing(e);
                }
                return;
              }

              if (!st->edit_mode) return;

              if (code == LV_EVENT_PRESSED) {
                st->dragging = obj;
                st->drag_start_x = Helper::get_offset_x(obj);
                st->drag_start_y = Helper::get_offset_y(obj);
                    Helper::stop_wiggle(obj);
                    lv_indev_t *indev = lv_indev_get_act();
                    if (indev) {
                  lv_point_t p;
                  lv_indev_get_point(indev, &p);
                      lv_area_t a;
                      lv_obj_get_coords(obj, &a);
                      st->drag_offset_x = (int16_t) (p.x - a.x1);
                      st->drag_offset_y = (int16_t) (p.y - a.y1);
                      lv_obj_t *parent = lv_obj_get_parent(obj);
                      if (parent) {
                        lv_obj_clear_flag(parent, LV_OBJ_FLAG_SCROLLABLE);
                      }
                      lv_obj_move_foreground(obj);
                }
                lv_event_stop_bubbling(e);
                lv_event_stop_processing(e);
                return;
              }

                  if (code == LV_EVENT_PRESSING) {
                    if (st->dragging != obj) return;
                    lv_indev_t *indev = lv_indev_get_act();
                    if (!indev) return;
                    lv_point_t p;
                    lv_indev_get_point(indev, &p);
                    lv_obj_t *parent = lv_obj_get_parent(obj);
                    lv_area_t pa;
                    lv_obj_get_coords(parent, &pa);
                    int16_t scroll_x = (int16_t) lv_obj_get_scroll_x(parent);
                    int16_t scroll_y = (int16_t) lv_obj_get_scroll_y(parent);
                    int16_t new_x = (int16_t) (p.x - st->drag_offset_x - pa.x1 + scroll_x);
                    int16_t new_y = (int16_t) (p.y - st->drag_offset_y - pa.y1 + scroll_y);
                    int16_t pw = (int16_t) lv_obj_get_width(parent);
                    int16_t ph = (int16_t) lv_obj_get_height(parent);
                    int16_t ow = (int16_t) lv_obj_get_width(obj);
                    int16_t oh = (int16_t) lv_obj_get_height(obj);
                    int16_t center_left = (int16_t) ((pw - ow) / 2);
                    int16_t center_top = (int16_t) ((ph - oh) / 2);
                    int16_t off_x = (int16_t) (new_x - center_left);
                    int16_t off_y = (int16_t) (new_y - center_top);
                    Helper::set_offset_pos(obj, off_x, off_y);
                    lv_event_stop_bubbling(e);
                    lv_event_stop_processing(e);
                    return;
                  }

              if (code == LV_EVENT_RELEASED) {
                if (st->dragging != obj) return;
                    int16_t snap_x = Helper::nearest(Helper::get_offset_x(obj), st->grid_x, st->grid_x_count);
                    int16_t snap_y = Helper::nearest(Helper::get_offset_y(obj), st->grid_y, st->grid_y_count);
                    IconItem *other = Helper::find_by_pos(st, snap_x, snap_y, obj);
                    if (other && other->obj) {
                      Helper::set_offset_pos(other->obj, st->drag_start_x, st->drag_start_y);
                    }
                    Helper::set_offset_pos(obj, snap_x, snap_y);
                st->dragging = nullptr;
                lv_obj_t *parent = lv_obj_get_parent(obj);
                if (parent) {
                  lv_obj_add_flag(parent, LV_OBJ_FLAG_SCROLLABLE);
                }
                Helper::save_layout(st);
                if (st->edit_mode) {
                  Helper::start_wiggle(obj, 0);
                }
                lv_event_stop_bubbling(e);
                lv_event_stop_processing(e);
                return;
              }
            };

            for (size_t i = 0; i < st.icon_count; i++) {
              if (st.icons[i].obj == nullptr) continue;
              if (!icon_event_bound[i]) {
                lv_obj_add_event_cb(st.icons[i].obj, icon_event_cb, LV_EVENT_ALL, &st);
                icon_event_bound[i] = true;
              }
            }

            if (btn_done != nullptr) {
              lv_obj_add_event_cb(btn_done, [](lv_event_t *e) {
                EditState *st = (EditState *) lv_event_get_user_data(e);
                if (st == nullptr) return;
                if (lv_event_get_code(e) != LV_EVENT_CLICKED) return;
                st->edit_mode = false;
                st->suppress_click = true;
                id(app_edit_mode) = false;
                if (st->tileview) {
                  lv_obj_add_flag(st->tileview, LV_OBJ_FLAG_SCROLLABLE);
                }
                Helper::stop_all_wiggle(st);
                Helper::snap_all(st);
                Helper::save_layout(st);
                lv_obj_add_flag(id(btn_edit_done), LV_OBJ_FLAG_HIDDEN);
              }, LV_EVENT_CLICKED, &st);
            }

            refresh_ctx.state = &st;
            refresh_ctx.tile_appcenter = tile_appcenter;
            if (!page_refresh_cb_bound) {
              page_refresh_cb_bound = true;
              lv_obj_add_event_cb(id(page_main)->obj, [](lv_event_t *e) {
                if (lv_event_get_code(e) != LV_EVENT_REFRESH) return;
                auto *ctx = (RefreshContext *) lv_event_get_user_data(e);
                if (ctx == nullptr || ctx->state == nullptr) return;
                EditState *st = ctx->state;
                lv_obj_t *tile_appcenter = ctx->tile_appcenter;
                if (tile_appcenter == nullptr) {
                  ESP_LOGD("AppScan", "Refresh skipped (tile_appcenter is null)");
                  return;
                }

                if (st->edit_mode) {
                  st->edit_mode = false;
                  st->suppress_click = true;
                  id(app_edit_mode) = false;
                  if (st->tileview) {
                    lv_obj_add_flag(st->tileview, LV_OBJ_FLAG_SCROLLABLE);
                  }
                  Helper::stop_all_wiggle(st);
                  lv_obj_add_flag(id(btn_edit_done), LV_OBJ_FLAG_HIDDEN);
                }

                id(lua).abort_all();

                size_t previous_count = st->icon_count;
                for (size_t i = BASE_ICONS; i < previous_count; i++) {
                  std::string app_dir = icon_main_paths[i].empty() ? std::string() : icon_main_paths[i].substr(0, icon_main_paths[i].find_last_of('/'));
                  if (!app_dir.empty()) {
                    esphome::lua_runtime::unregister_app_page(app_dir);
                  }
                  if (icon_pages[i] != nullptr) {
                    lv_obj_del_async(icon_pages[i]);
                    icon_pages[i] = nullptr;
                  }
                  if (icons[i].obj != nullptr) {
                    Helper::stop_wiggle(icons[i].obj);
                    lv_obj_del_async(icons[i].obj);
                  }
                  icons[i] = {nullptr, nullptr, nullptr, nullptr, 0, 0};
                  icon_ids[i].clear();
                  icon_titles[i].clear();
                  icon_paths[i].clear();
                  icon_page_ids[i].clear();
                  icon_init_paths[i].clear();
                  icon_init_ran[i] = false;
                  icon_main_paths[i].clear();
                  icon_main_ran[i] = false;
                  icon_event_bound[i] = false;
                }
                st->icon_count = BASE_ICONS;

                const char *base = "/sdcard/opt";
                ESP_LOGD("AppScan", "Refresh scanning %s", base);
                DIR *dirp = opendir(base);
                if (dirp != nullptr) {
                  struct dirent *ent;
                  while ((ent = readdir(dirp)) != nullptr) {
                    const char *name = ent->d_name;
                    if (name == nullptr) continue;
                    if (strcmp(name, ".") == 0 || strcmp(name, "..") == 0) continue;
                    if (st->icon_count >= MAX_ICONS) break;

                    std::string pkg = name;
                    std::string app_dir = std::string(base) + "/" + pkg;
                    struct stat stbuf;
                    if (stat(app_dir.c_str(), &stbuf) != 0 || !S_ISDIR(stbuf.st_mode)) {
                      continue;
                    }

                    std::string manifest_path = app_dir + "/manifest.json";
                    std::ifstream file(manifest_path);
                    if (!file.is_open()) {
                      continue;
                    }
                    JsonDocument doc;
                    DeserializationError err = deserializeJson(doc, file);
                    file.close();
                    if (err) {
                      continue;
                    }

                    std::string current_platform = "${lemonade_app_platform}";
                    bool platform_ok = false;
                    if (doc["platform"].is<JsonArray>()) {
                      for (JsonVariant v : doc["platform"].as<JsonArray>()) {
                        const char *p = v.as<const char *>();
                        if (p != nullptr && Helper::str_eq(p, "${lemonade_app_platform}")) {
                          platform_ok = true;
                          break;
                        }
                      }
                    }
                    if (!platform_ok) {
                      continue;
                    }

                    const char *app_name = doc["name"] | pkg.c_str();
                    const char *icon_rel = doc["icon"] | "";
                    if (icon_rel[0] == '\0') {
                      continue;
                    }

                    size_t idx = st->icon_count;
                    icon_ids[idx] = pkg;
                    icon_titles[idx] = app_name;
                    icon_paths[idx] = std::string("A:") + app_dir + "/" + icon_rel;
                    icon_init_paths[idx] = app_dir + "/init.lua";
                    icon_init_ran[idx] = false;
                    icon_main_paths[idx] = app_dir + "/main.lua";
                    icon_main_ran[idx] = false;

                    lv_obj_t *img = lv_img_create(tile_appcenter);
                    lv_obj_set_size(img, 96, 96);
                    if (auto *runtime_icon = lemonade::runtime_icon::load_png_icon((app_dir + "/" + icon_rel).c_str(), 96, 96)) {
                      lv_img_set_src(img, runtime_icon);
                    } else {
                      lv_img_set_src(img, icon_paths[idx].c_str());
                    }

                    icon_page_ids[idx] = std::string("lv_page_") + pkg;
                    for (auto &ch : icon_page_ids[idx]) {
                      if (ch == '.') ch = '_';
                    }

                    lv_obj_t *page = lv_obj_create(NULL);
                    lv_obj_clear_flag(page, LV_OBJ_FLAG_SCROLLABLE);
                    lv_obj_set_size(page, 320, 240);
                    lv_obj_set_style_bg_color(page, lv_color_hex(0xffffff), 0);
                    lv_obj_set_user_data(page, (void *) icon_page_ids[idx].c_str());
                    esphome::lua_runtime::register_app_page(app_dir, page);

                    icons[idx] = {icon_ids[idx].c_str(), icon_titles[idx].c_str(), img, page, 0, 0};
                    icon_pages[idx] = page;
                    st->icon_count++;
                  }
                  closedir(dirp);
                }

                for (size_t i = 0; i < st->icon_count; i++) {
                  if (st->icons[i].obj == nullptr) continue;
                  lv_obj_add_flag(st->icons[i].obj, LV_OBJ_FLAG_CLICKABLE);
                  int16_t off_x = st->grid_x[i % st->grid_x_count];
                  size_t row = i / st->grid_x_count;
                  int16_t off_y = st->grid_y[row < st->grid_y_count ? row : (st->grid_y_count - 1)];
                  Helper::set_offset_pos(st->icons[i].obj, off_x, off_y);
                  st->icons[i].default_x = off_x;
                  st->icons[i].default_y = off_y;
                  if (!icon_event_bound[i]) {
                    lv_obj_add_event_cb(st->icons[i].obj, icon_event_cb, LV_EVENT_ALL, st);
                    icon_event_bound[i] = true;
                  }
                }
                Helper::load_layout(st);
              }, LV_EVENT_ALL, &refresh_ctx);
            }