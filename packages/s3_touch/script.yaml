  - id: show_previous_crash_report
    parameters:
      force: bool
    mode: single
    then:
      - if:
          condition:
            lambda: 'return force || id(previous_crash_detected) || !id(previous_crash_log).empty();'
          then:
            - lvgl.resume:
                lvgl_id: lvgl_1
            - lambda: |
                std::string log;
                static bool first_time = true;
                if (!first_time) return;
                first_time = false;
                #ifdef USE_ESP32_CRASH_HANDLER
                if (esphome::esp32::crash_handler_has_data()) {
                  log += "检测到系统非正常退出。\n"
                          "请联系 Lemonade OS 开发者并提供此日志以协助诊断问题。\n"
                          "此信息存储于硬件暂存区，需彻底断电（关闭设备再打开设备）后方可清除。\n";
                }
                #endif
                if (log.empty()) {
                  log = "检测到上次运行时崩溃，但未记录下崩溃日志。\n请联系 Lemonade OS 开发者以获取更多信息。";
                }
                if (!id(previous_crash_log).empty()) {
                  log += "\n\n";
                  log += id(previous_crash_log);
