script:
  - id: halt
    then:
      - lvgl.widget.show: boot_screen
      - lambda: |
          // umount filesystems to prevent corruption
          esp_vfs_littlefs_unregister("littlefs");
          id(sd)->umount();
      - lambda: global_preferences->sync();
      - delay: 500ms
      - switch.turn_off: acc

  - id: wakeup_button
    then:
      - if:
          condition:
            lambda: 'return id(is_sleeping);'
          then:
            # display on
            - lambda: id(watchface)->set_command(0x29);
            - light.turn_on:
                id: backlight
                transition_length: 0.5s
            - lambda: id(is_sleeping)=false;
            - lvgl.resume:
                lvgl_id: lvgl_1
            - switch.turn_on: switch_powermanage_lock_apb

  - id: sleep_button
    then:
      - light.toggle:
          id: backlight
          transition_length: 0.5s
      - lambda: id(is_sleeping)=!id(is_sleeping);
      - lvgl.resume:
          lvgl_id: lvgl_1
      - if:
          condition:
            - lambda: 'return id(is_sleeping);'
          then:
            # display off
            - lambda: id(watchface)->set_command(0x28);
            - lvgl.pause:
                show_snow: false
                lvgl_id: lvgl_1
          else:
            # display on
            - lambda: id(watchface)->set_command(0x29);
      - switch.toggle: switch_powermanage_lock_apb

  - id: sdcard_init
    mode: single
    then:
      - lambda: |
          for (auto const & file : id(sd)->list_directory("/", 3))
            ESP_LOGI("SD", "File: %s\n", file.c_str());

  - id: littlefs_init
    mode: single
    then:
      - lambda: |
          esp_vfs_littlefs_conf_t conf = {
            .base_path = "/data",
            .partition_label = "littlefs",
            .format_if_mount_failed = true,
            .dont_mount = false,
          };
          esp_err_t ret = esp_vfs_littlefs_register(&conf);
          if (ret != ESP_OK)
          {
            if (ret == ESP_FAIL){
              ESP_LOGE("LittleFS", "Failed to mount or format filesystem");
            }
            else if (ret == ESP_ERR_NOT_FOUND){
              ESP_LOGE("LittleFS", "Failed to find LittleFS partition");
            }
            else{
              ESP_LOGE("LittleFS", "Failed to initialize LittleFS (%s)", esp_err_to_name(ret));
            }
            return;
          }

          size_t total = 0, used = 0;
          ret = esp_littlefs_info(conf.partition_label, &total, &used);
          if (ret != ESP_OK){
            ESP_LOGE("LittleFS", "Failed to get LittleFS partition information (%s)", esp_err_to_name(ret));
          }
          else{
            ESP_LOGI("LittleFS", "Mounted LittleFS. Partition size: total: %d, used: %d", total, used);
          }

  - id: set_background_img
    mode: single
    then:
      - lambda: |
          ESP_LOGI("CookieIoT", "Selected Cookie IoT background image.");
          struct stat st;
          const char *LVGL_FILE_PATH = "A:/data/custom_bg.jpg";
          ESP_LOGI("CookieIoT", "Have custom background image.");
          if (id(background_image) == nullptr) {
              ESP_LOGW("CookieIoT", "LVGL image object (background_image) not initialized.");
              return;
          }
          lv_img_set_src(id(background_image), LVGL_FILE_PATH);
          ESP_LOGI("CookieIoT", "Background image source updated form LittleFS.");

  - id: get_background_img
    mode: single
    then:
      - lambda: |
          std::string mac = id(text_sensor_mac_address).state;
          id(mqtt_client).publish_json(
            "server/" + mac + "/request/background",
            [=](JsonObject root) {},
            1); // QoS 1
          ESP_LOGD("CookieIoT", "Requested background image...");

  - id: update_date
    then:
      - if:
          condition:
            lambda: 'return !id(is_sleeping);'
          then:
            - lvgl.label.update:
                id: lbl_topbar_time
                text: !lambda |-
                  int x = id(rssi).state;
                  std::string icon;
                  auto ssid_val = id(ssid).state;
                  if (x >= -50) {
                    icon = "\U000F0928"; // mdi-wifi-strength-4
                  } else if (x >= -65) {
                    icon = "\U000F0925"; // mdi-wifi-strength-3
                  } else if (x >= -80) {
                    icon = "\U000F0922"; // mdi-wifi-strength-2
                  } else if (x >= -95) {
                    icon = "\U000F091F"; // mdi-wifi-strength-1
                  } else {
                    icon = "\U000F092E"; // mdi-wifi-strength-off-outline
                  }
                  if (!id(wifi_switch).state) {
                    icon = "\U000F092E"; // mdi-wifi-strength-off-outline
                  }
                  if (ssid_val == "") {
                    icon = "\U000F092F"; // mdi-wifi-strength-outline
                  }
                  float v = id(battery_voltage).state;
                  // 保留两位小数（四舍五入）
                  float rounded = (int)(v * 100 + 0.5f) / 100.0f;
                  // 电压映射到百分比
                  // 4.15V = 100%，3.55V = 0%
                  float percent = (rounded - 3.55f) / (4.15f - 3.55f) * 100.0f;
                  if (percent > 100.0f) percent = 100.0f;
                  if (percent < 0.0f) percent = 0.0f;
                  // 根据电量百分比选择 MDI 图标
                  std::string iconbat;
                  iconbat = "mdi-battery";
                  if (id(charge).state) {
                      iconbat = "mdi-battery-charging";
                  }
                  if (percent == 100.0f)
                      iconbat += "";
                  else if (percent > 90)
                      iconbat += "-90";
                  else if (percent > 80)
                      iconbat += "-80";
                  else if (percent > 70)
                      iconbat += "-70";
                  else if (percent > 60)
                      iconbat += "-60";
                  else if (percent > 50)
                      iconbat += "-50";
                  else if (percent > 40)
                      iconbat += "-40";
                  else if (percent > 30)
                      iconbat += "-30";
                  else if (percent > 20)
                      iconbat += "-20";
                  else if (percent > 10)
                      iconbat += "-10";
                  else if (percent >= 0)
                      iconbat += "-outline";
                  else
                      iconbat += "-unknow" ; // mdi-battery-unknown
                  iconbat = id(mdi_icon_map)[iconbat];
                  // 格式化电压字符串
                  char bufbat[8];
                  sprintf(bufbat, "%.2f", rounded);
                  // 低电量红色警告（<3.4V）
                  std::string batstr;
                  if (v < 3.55f or percent < 20.0f)
                      batstr = "#FF0000 " + iconbat + " " + bufbat + "V#";
                  else
                      batstr = iconbat + " " + bufbat + "V";
                  return icon + " " + batstr;
            - lvgl.label.update:
                id: lbl_battery_status
                text: !lambda |-
                  float v = id(battery_voltage).state;
                  // 保留两位小数（四舍五入）
                  float rounded = (int)(v * 100 + 0.5f) / 100.0f;
                  // 电压映射到百分比
                  // 4.15V = 100%，3.55V = 0%
                  float percent = (rounded - 3.55f) / (4.15f - 3.55f) * 100.0f;
                  if (percent > 100.0f) percent = 100.0f;
                  if (percent < 0.0f) percent = 0.0f;
                  // 根据电量百分比选择 MDI 图标
                  std::string iconbat;
                  iconbat = "mdi-battery";
                  if (id(charge).state) {
                      iconbat = "mdi-battery-charging";
                  }
                  if (percent == 100.0f)
                      iconbat += "";
                  else if (percent > 90)
                      iconbat += "-90";
                  else if (percent > 80)
                      iconbat += "-80";
                  else if (percent > 70)
                      iconbat += "-70";
                  else if (percent > 60)
                      iconbat += "-60";
                  else if (percent > 50)
                      iconbat += "-50";
                  else if (percent > 40)
                      iconbat += "-40";
                  else if (percent > 30)
                      iconbat += "-30";
                  else if (percent > 20)
                      iconbat += "-20";
                  else if (percent > 10)
                      iconbat += "-10";
                  else if (percent >= 0)
                      iconbat += "-outline";
                  else
                      iconbat += "-unknow" ; // mdi-battery-unknown
                  iconbat = id(mdi_icon_map)[iconbat];
                  // 格式化电压字符串
                  char buf[8];
                  sprintf(buf, "%.2f", rounded);
                  // 低电量红色警告（<3.4V）
                  if (v < 3.55f || percent < 20.0f)
                      return "#FF0000 " + iconbat + " " + buf + "V#";
                  else
                      return iconbat + " " + buf + "V";
            - lambda: |
                // 更新日期显示
                auto t = id(ntp_time).now();
                char date_buf[30];
                char weekday_buf[10];
                // ESPHome中day_of_week: 1=Sunday, 2=Monday, ..., 7=Saturday
                switch(t.day_of_week) {
                  case 1: strcpy(weekday_buf, "星期日"); break;
                  case 2: strcpy(weekday_buf, "星期一"); break;
                  case 3: strcpy(weekday_buf, "星期二"); break;
                  case 4: strcpy(weekday_buf, "星期三"); break;
                  case 5: strcpy(weekday_buf, "星期四"); break;
                  case 6: strcpy(weekday_buf, "星期五"); break;
                  case 7: strcpy(weekday_buf, "星期六"); break;
                  default: strcpy(weekday_buf, "未知"); break;
                }
                snprintf(date_buf, sizeof(date_buf), "%04d-%02d-%02d %s",
                        t.year, t.month, t.day_of_month, weekday_buf);
                lv_label_set_text(id(date_label), date_buf);
            - lvgl.label.update:
                id: lbl_topbar_date
                text: !lambda |-
                  // 00:00 格式
                  auto t = id(ntp_time).now();
                  char buf1[6];
                  snprintf(buf1, sizeof(buf1), "%02d:%02d", t.hour, t.minute);
                  static const char * const day_names[] = {"Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"};
                  char buf[20];
                  auto a = day_names[id(ntp_time).now().day_of_week - 1]; // Adjust for 0-based index
                  snprintf(buf, sizeof(buf), "%02d.%02d %s", t.month, t.day_of_month, a);
                  return std::string(buf1) + " " + std::string(buf);

  - id: update_time
    then:
      - if:
          condition:
            lambda: 'return !id(is_sleeping);'
          then:
            - lambda: |
                // 更新时间显示
                auto t = id(ntp_time).now();
                char buf[9];
                snprintf(buf, sizeof(buf), "%02d:%02d:%02d", t.hour, t.minute, t.second);
                lv_label_set_text(id(time_label), buf);

  - id: keepalive
    then:
      - lambda: |
          std::string mac = id(text_sensor_mac_address).state;
          id(mqtt_client).publish_json((std::string("server/") +
                                            mac +
                                            std::string("/request/keepalive")).c_str(),
                                            [=](JsonObject root) {
                root["version"] = "${lemonade_version}";
              });

  - id: statusbar_update
    then:
      - if:
          condition:
            lambda: 'return !id(is_sleeping);'
          then:
            - script.execute: update_date
            - lvgl.label.update:
                id: lbl_wifi_status
                text: !lambda |-
                  // 检查是否处于AP模式
                  // Check if ESP32 WiFi access point is enabled
                  // auto captive_portal = captive_portal::global_captive_portal;
                  // bool in_ap_mode = captive_portal->is_active();
                  if (!id(wifi_switch).state) {
                    return "\U000F092E OFF";
                  }
                  // if (in_ap_mode) {
                  //   return "\U000F0003 AP";
                  // }
                  auto x = id(rssi).state;
                  auto ssid_val = id(ssid).state;
                  if (isnan(x) || x >= 2147483647.0f) {
                      return "\U000F092E -∞dBm";
                  }
                  char buf[10];
                  if (x <= -100) {
                    sprintf(buf, "--dBm");
                  } else {
                    sprintf(buf, "%ddBm", (int)x);
                  }
                  const char* icon;
                  if (x == 0){
                    return "\U000F092E -∞dBm"; // mdi-wifi-strength-off-outline
                  }
                  if (x >= -50) {
                    icon = "\U000F0928"; // mdi-wifi-strength-4
                  } else if (x >= -65) {
                    icon = "\U000F0925"; // mdi-wifi-strength-3
                  } else if (x >= -80) {
                    icon = "\U000F0922"; // mdi-wifi-strength-2
                  } else if (x >= -95) {
                    icon = "\U000F091F"; // mdi-wifi-strength-1
                  } else {
                    icon = "\U000F092E"; // mdi-wifi-strength-off-outline
                  }
                  if (ssid_val == "") {
                    return "\U000F092F -∞dBm"; // mdi-wifi-strength-outline
                  }
                  return std::string(icon) + " " + std::string(buf);

  - id: get_iot_info
    then:
      - lambda: |
          std::string mac = id(text_sensor_mac_address).state;
          id(mqtt_client).publish_json(
            "server/" + mac + "/request/config",
            [=](JsonObject root) {},
            1); // QoS 1
          ESP_LOGD("CookieIoT", "Requested config...");
      - lambda: |
          // 获取时间日期
          auto t = id(ntp_time).now();
          id(iot_last_status) = t.strftime("%Y-%m-%d %H:%M:%S");

  - id: prase_iot_info
    then:
      - lambda: |
          std::string config_json;
          // 读取文件
          ESP_LOGD("CookieIoT", "Started parsing cfg.json");
          std::ifstream file("/data/cfg.json");
          if (!file.is_open()) {
              ESP_LOGW("CookieIoT", "Config file not found.");
              return;
          }
          std::string line;
          while (std::getline(file, line)) {
              config_json += line + "\n";
          }
          file.close();
          int wifi_sum = 0;
          std::string desc;
          ESP_LOGD("CookieIoT", "JSON: '%s'", config_json.c_str());
          json::parse_json(config_json, [&](JsonVariant root) -> bool {
              if (!root["uid"]) {
                ESP_LOGE("CookieIoT", "JSON missing 'uid' key!");
                return false;
              }
              if (root["wifis"]) {
                JsonArray morewifi = root["wifis"];
                wifi_sum += morewifi.size();
              }
              if (root["desc"]) {
                desc = root["desc"].as<std::string>();
              }
              id(uid)= root["uid"].as<std::string>();
              return true;
          });
          // 更新标签
          std::string info_text = "${lemonade_version}\n";
          info_text += "用户名：" + id(uid) + "\n";
          info_text += "API版本：2\n";
          info_text += "WiFi数量：" + std::to_string(wifi_sum) + "\n";
          info_text += "设备描述：" + desc + "\n";
          info_text += "获取时间：" + id(iot_last_status);
          ESP_LOGD("987IoT", "Info text: '%s'", info_text.c_str());
          lv_label_set_text(id(lbl_iot_info), info_text.c_str());
      - lambda: global_preferences->sync();

  - id: refresh_info_page
    then:
      - lambda: |
          using namespace esphome;

          // 获取 WiFi 全局对象
          auto wifi = wifi::global_wifi_component;
          if (wifi == nullptr) return;

          std::string ip = "N/A";
          auto ip_list = wifi->get_ip_addresses();
          if (!ip_list.empty()) {
            char buf[64]; // 源码中 IP_ADDRESS_BUFFER_SIZE 通常为 64
            ip = ip_list[0].str_to(buf);
          }

          std::string mac = "none";
          std::string commit = "fffffff";

          auto cpu_freq1 = id(cpu_freq).state / 1000000;
          std::string cpu_freq = std::to_string((int)cpu_freq1) + "MHz";
          std::string cpu_temp = std::to_string((int)id(internal_temp).state) + "°C";

          mac = id(text_sensor_mac_address).state;
          commit = id(lemonade_git_commit_sha).state.substr(0, 7);

          auto esphome_ver = id(esphome_version).state;
          auto ssid_val = id(ssid).state;
          auto rssi_val = id(rssi).state;
          std::string rssi_str = std::to_string((int)rssi_val);
          if (!id(wifi_switch).state) {
            ssid_val = "(已关闭)";
            rssi_str = "-∞";
          }

          if (ssid_val == "") {
            ssid_val = "(未连接)";
            rssi_str = "-∞";
          }
          // 拼接文字
          char buf[512];
          snprintf(buf, sizeof(buf),
                  "运行时间: %s "
                  "CPU: 40~%s "
                  "%s \n"
                  "型号：${lemonade_device_model} MAC: %s\n\nLemonade OS ${lemonade_version}"
                  " %s\n"
                  "ESPHome %s\nOS by Cookie987, HW by ZSVStudio.\n©2025 RedCookieStudios.",
                  id(uptime_text).state.c_str(),
                  cpu_freq.c_str(),
                  cpu_temp.c_str(),
                  mac.c_str(),
                  commit.c_str(),
                  esphome_ver.c_str()
                  );

          char buf_wifi_info[256];
          snprintf(buf_wifi_info, sizeof(buf_wifi_info),
                  "SSID: %s   "
                  "RSSI: %s dBm\n"
                  "IP: %s  "
                  "MAC: %s\n",
                  ssid_val.c_str(),
                  rssi_str.c_str(),
                  ip.c_str(),
                  mac.c_str()
                  );
          lv_label_set_text(id(lbl_wifi_info), buf_wifi_info);
          lv_label_set_text(id(lbl_sysinfo), buf);

  - id: wifi_list_update
    mode: single
    then:
      - lambda: |
          std::string mac = id(text_sensor_mac_address).state;
          id(mqtt_client).publish_json(
            "server/" + mac + "/request/wifilist",
            [=](JsonObject root) {},
            1); // QoS 1
          ESP_LOGD("CookieIoT", "Requested WiFi list...");

  # 创建或修改通知
  # para1: 新的通知内容
  # para2: （若非空）要修改的通知消息的后缀
  - id: show_notification
    parameters:
      notification_message: string
      suffix: string
    mode: queued
    then:
      - lambda: |
          lv_obj_t * screen = lv_disp_get_layer_top(lvgl_1->get_disp());
          lv_obj_t * target_bar = nullptr;
          const int32_t BAR_Y_HIDE = -45; // 隐藏时的 Y 坐标
          const int32_t BAR_Y_SHOW = 10;  // 显示时的 Y 坐标

          if(suffix != "") {
            // --- 1. 查找是否已有符合条件的通知条 ---
            uint32_t child_cnt = lv_obj_get_child_cnt(screen);
            for(uint32_t i = 0; i < child_cnt; i++) {
              lv_obj_t * child = lv_obj_get_child(screen, i);
              // 检查标记是否为我们定义的通知条 (0xDEAD)
              if(lv_obj_get_user_data(child) == (void*)0xDEAD) {
                lv_obj_t * lbl = lv_obj_get_child(child, 0); // 找到里面的 Label
                if(lbl) {
                  std::string current_text = lv_label_get_text(lbl);
                  // 检查字符串是否以指定后缀结尾
                  if(current_text.size() >= suffix.size() &&
                    current_text.compare(current_text.size() - suffix.size(), suffix.size(), suffix) == 0) {
                      target_bar = child;
                      break;
                  }
                }
              }
            }
          }

          if(target_bar) {
            // 找到了旧通知，直接更新文字
            lv_obj_t * lbl = lv_obj_get_child(target_bar, 0);
            lv_obj_move_foreground(target_bar);
            lv_label_set_text(lbl, notification_message.c_str());
            // 视觉反馈：让它“弹跳”一下，提醒用户内容更新了
            lv_anim_t a_shake;
            lv_anim_init(&a_shake);
            lv_anim_set_var(&a_shake, target_bar);
            lv_anim_set_values(&a_shake, BAR_Y_SHOW, BAR_Y_SHOW + 8);
            lv_anim_set_exec_cb(&a_shake, (lv_anim_exec_xcb_t)lv_obj_set_y);
            lv_anim_set_time(&a_shake, 100);
            lv_anim_set_playback_time(&a_shake, 100); // 弹下去再缩回来
            lv_anim_start(&a_shake);
            // 旧通知已经加过callback
            return;
          }

          // 1. 创建背景框 (Parent)
          lv_obj_t * obj_notification_bar = lv_obj_create(screen);
          lv_obj_set_size(obj_notification_bar, 240, 25);
          lv_obj_align(obj_notification_bar, LV_ALIGN_TOP_MID, 0, BAR_Y_HIDE); // 初始位置在屏幕上方 -40，完全藏住
          lv_obj_set_scrollbar_mode(obj_notification_bar, LV_SCROLLBAR_MODE_OFF);
          lv_obj_set_style_bg_opa(obj_notification_bar, 175, 0); // 45% 透明度 (255 * 0.7 ≈ 175)
          lv_obj_set_style_pad_all(obj_notification_bar, 0, 0);
          lv_obj_set_user_data(obj_notification_bar, (void*)0xDEAD);

          // 2. 创建标签 (Child) - 注意第一个参数传入 obj_notification_bar
          lv_obj_t * lbl_notification = lv_label_create(obj_notification_bar);
          lv_label_set_text(lbl_notification, notification_message.c_str());
          lv_obj_set_width(lbl_notification, 220);
          lv_label_set_long_mode(lbl_notification, LV_LABEL_LONG_DOT);
          lv_obj_set_style_text_align(lbl_notification, LV_TEXT_ALIGN_CENTER, 0);
          lv_obj_align(lbl_notification, LV_ALIGN_CENTER, 0, 0); // 在父框内居中
          if (id(notification_amount) > 15) {
            ESP_LOGW("Notification", "Reached the maximum number of notifications. No more notifications will be displayed.");
            lv_obj_del(obj_notification_bar);
            return;
          } //最多显示15条
          id(notification_amount) += 1;

          // 播放动画
          lv_anim_t a_in;
          lv_anim_init(&a_in);
          lv_anim_set_var(&a_in, obj_notification_bar);
          lv_anim_set_values(&a_in, BAR_Y_HIDE, BAR_Y_SHOW); // 从屏幕外滑入
          lv_anim_set_exec_cb(&a_in, (lv_anim_exec_xcb_t)lv_obj_set_y);
          lv_anim_set_time(&a_in, 500);

          // 使用 overshoot 路径，会有一个帅气的回弹效果
          lv_anim_set_path_cb(&a_in, lv_anim_path_overshoot);

          lv_anim_start(&a_in);

          // --- 动画收回逻辑 ---

          // 3. 给背景框添加点击事件
          lv_obj_add_event_cb(obj_notification_bar, [](lv_event_t * e) {
            lv_obj_t * bar = lv_event_get_target(e);

            // 创建收回动画
            static lv_anim_t a;
            lv_anim_init(&a);
            lv_anim_set_var(&a, bar);

            lv_anim_set_values(&a, lv_obj_get_y(bar), BAR_Y_HIDE);
            lv_anim_set_exec_cb(&a, (lv_anim_exec_xcb_t)lv_obj_set_y);
            lv_anim_set_time(&a, 300);
            lv_anim_set_path_cb(&a, lv_anim_path_ease_in);

            // 动画结束后的清理工作
            lv_anim_set_ready_cb(&a, [](lv_anim_t * anim) {
              // 删除父对象 bar，其子对象 lbl_notification 会被自动释放
              lv_obj_del((lv_obj_t *)anim->var);
              if (id(notification_amount) > 0) {
                id(notification_amount) -= 1;
              }
            });
            lv_anim_start(&a);
          }, LV_EVENT_CLICKED, NULL);

  # 关闭通知
  # para1: 要关闭的通知消息的后缀
  - id: close_notification
    parameters:
      # 匹配通知消息的后缀
      notification_message: string
    mode: queued
    then:
      - lambda: |
          lv_obj_t * screen = lv_disp_get_layer_top(lvgl_1->get_disp());
          lv_obj_t * target_bar = nullptr;
          std::string suffix = notification_message;
          const int32_t BAR_Y_HIDE = -45; // 隐藏时的 Y 坐标
          const int32_t BAR_Y_SHOW = 10;  // 显示时的 Y 坐标

          // --- 1. 查找是否已有符合条件的通知条 ---
          uint32_t child_cnt = lv_obj_get_child_cnt(screen);
          for(uint32_t i = 0; i < child_cnt; i++) {
            lv_obj_t * child = lv_obj_get_child(screen, i);
            // 检查标记是否为我们定义的通知条 (0xDEAD)
            if(lv_obj_get_user_data(child) == (void*)0xDEAD) {
              lv_obj_t * lbl = lv_obj_get_child(child, 0); // 找到里面的 Label
              if(lbl) {
                std::string current_text = lv_label_get_text(lbl);
                // 检查字符串是否以指定后缀结尾
                if(current_text.size() >= suffix.size() &&
                  current_text.compare(current_text.size() - suffix.size(), suffix.size(), suffix) == 0) {
                    target_bar = child;
                    break;
                }
              }
            }
          }
          if(target_bar) {
            // 创建收回动画
            static lv_anim_t a;
            lv_anim_init(&a);
            lv_anim_set_var(&a, target_bar);

            lv_anim_set_values(&a, lv_obj_get_y(target_bar), BAR_Y_HIDE);
            lv_anim_set_exec_cb(&a, (lv_anim_exec_xcb_t)lv_obj_set_y);
            lv_anim_set_time(&a, 300);
            lv_anim_set_path_cb(&a, lv_anim_path_ease_in);

            // 动画结束后的清理工作
            lv_anim_set_ready_cb(&a, [](lv_anim_t * anim) {
              // 删除父对象 target_bar，其子对象会被自动释放
              lv_obj_del((lv_obj_t *)anim->var);
              if (id(notification_amount) > 0) {
                id(notification_amount) -= 1;
              }
            });
            lv_anim_start(&a);
          }
          else{
            ESP_LOGW("Notification", "No matching notification found.");
          }
