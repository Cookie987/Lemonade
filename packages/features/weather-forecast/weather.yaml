lvgl: !include weather-lvgl.yaml
                                  
# 天气图标资源定义
image: !include weather-image.yaml

interval:
  - interval: 10min
    id: interval_weather
    then:
      - script.execute: weather_update

time:
  - id: !extend ntp_time
    on_time_sync: 
      - script.execute: weather_update

mapping:
  - id: weather_icon_2x
    from: int
    to: image
    entries:
      # 晴天
      100: c100_2x_black
      150: c150_2x_black

      # 多云/少云/晴间多云/阴
      101: c101_2x_black
      151: c151_2x_black
      102: c102_2x_black
      152: c152_2x_black
      103: c103_2x_black
      153: c153_2x_black
      104: c104_2x_black

      # 雨（阵雨、小雨、中雨、大雨）
      300: c300_2x_black
      301: c301_2x_black # 强阵雨
      350: c350_2x_black
      351: c351_2x_black # 强阵雨 (夜)
      399: c399_2x_black # 雨 (映射到中雨 14)
      305: c305_2x_black # 小雨
      309: c309_2x_black # 毛毛雨/细雨 (映射到小雨 13)
      306: c306_2x_black # 中雨
      307: c307_2x_black # 大雨
      314: c314_2x_black # 小到中雨 (映射到中雨 14)
      315: c315_2x_black # 中到大雨 (映射到大雨 15)

      # 暴雨、极端降雨
      310: c310_2x_black # 暴雨
      316: c316_2x_black # 大到暴雨 (映射到暴雨 16)
      311: c311_2x_black # 大暴雨
      317: c317_2x_black # 暴雨到大暴雨 (映射到大暴雨 17)
      312: c312_2x_black # 特大暴雨
      308: c308_2x_black # 极端降雨 (映射到特大暴雨 18)
      318: c318_2x_black # 大暴雨到特大暴雨 (映射到特大暴雨 18)

      # 雷雨、冻雨
      302: c302_2x_black # 雷阵雨
      303: c303_2x_black # 强雷阵雨 (映射到雷阵雨 11)
      304: c304_2x_black # 雷阵雨伴有冰雹
      313: c313_2x_black # 冻雨

      # 雪
      499: c499_2x_black # 雪 (映射到中雪 23)
      400: c400_2x_black # 小雪
      401: c401_2x_black # 中雪
      408: c408_2x_black # 小到中雪 (映射到中雪 23)
      402: c402_2x_black # 大雪
      409: c409_2x_black # 中到大雪 (映射到大雪 24)
      403: c403_2x_black # 暴雪
      410: c410_2x_black # 大到暴雪 (映射到暴雪 25)

      # 混合和阵雪
      404: c404_2x_black # 雨夹雪
      405: c405_2x_black # 雨雪天气 (映射到雨夹雪 20)
      406: c406_2x_black # 阵雨夹雪 (映射到雨夹雪 20)
      456: c456_2x_black # 阵雨夹雪 (夜) (映射到雨夹雪 20)
      407: c407_2x_black # 阵雪
      457: c457_2x_black # 阵雪 (夜)

      # 沙尘天气
      504: c504_2x_black # 浮尘
      503: c503_2x_black # 扬沙
      507: c507_2x_black # 沙尘暴
      508: c508_2x_black # 强沙尘暴

      # 雾霾
      500: c500_2x_black # 薄雾 (映射到雾 30)
      501: c501_2x_black # 雾
      509: c509_2x_black # 浓雾 (映射到雾 30)
      510: c510_2x_black # 强浓雾 (映射到雾 30)
      514: c514_2x_black # 大雾 (映射到雾 30)
      515: c515_2x_black # 特强浓雾 (映射到雾 30)
      502: c502_2x_black # 霾
      511: c511_2x_black # 中度霾 (映射到霾 31)
      512: c512_2x_black # 重度霾 (映射到霾 31)
      513: c513_2x_black # 严重霾 (映射到霾 31)

      # 温度/未知
      900: c900_2x_black # 热
      901: c901_2x_black # 冷
      999: c999_2x_black # 未知

script:
  - id: weather_update
    then:
      if:
        condition:
          wifi.connected:
        then:
          - mqtt.publish_json:
              topic: !lambda |-
                return "weather/request";
              payload: |-
                root["mac"] = id(text_sensor_mac_address).state;
          - lambda: |-
              ESP_LOGD("weather", "update weather");
              std::string mac = id(text_sensor_mac_address).state;
              id(mqtt_client).subscribe_json("weather/response/" + mac, [=](const std::string &topic, JsonObject root) {
                if (root["now"]) {
                  std::string text = root["now"]["text"].as<std::string>();
                  text += " " + root["now"]["temp"].as<std::string>() + "℃";
                  int icon = root["now"]["icon"].as<int>();
                  lv_img_set_src(id(img_current_weather_icon), id(weather_icon_2x)[icon]);
                  lv_label_set_text(id(lbl_current_weather_text), text.c_str());
                }
                if (root["forecast"]) {
                  std::string tempMax = root["forecast"]["daily"][0]["tempMax"].as<std::string>();
                  std::string tempMin = root["forecast"]["daily"][0]["tempMin"].as<std::string>();
                  std::string temp_text = tempMax + "℃/" + tempMin + "℃";
                  lv_label_set_text(id(lbl_current_weather_max_min_temp), temp_text.c_str());
                }
              });
              return;
