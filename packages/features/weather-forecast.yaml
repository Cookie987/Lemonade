lvgl:
  pages:
    - id: page_weather_forecast
      on_load:
        - lvgl.widget.show: tabview_weather
        - lvgl.label.update:
            id: lbl_topbar_title
            text: "天气"
      on_unload:
        - delay: 250ms
        - lvgl.widget.hide: tabview_weather
      widgets:
        - tabview:
            id: tabview_weather
            anim_time: 0.5s
            x: 0
            y: 18
            width: 320
            height: 198
            hidden: true
            size: 20%
            state:
              disabled: true
            tabs:
              # 当前天气标签页
              - name: 当前天气
                state:
                  disabled: true
                text_font: chinese_font14
                widgets:
                  - image:
                      id: img_current_weather
                      src: sunny_2x_black
                      y: 33
                      x: 28
                      width: 128
                      height: 128
              - name: 7日预报
                state:
                  disabled: true
                text_font: chinese_font14
                widgets:
                  # 168小时预报容器
                  - obj:
                      id: forecast_container
                      width: 300
                      height: 180
                      align: TOP_MID
                      y: 20
                      scrollbar_mode: "OFF"
                      widgets:
                        # 168小时预报列表项 (7天)
                        # 第1天
                        - obj:
                            id: forecast_day_1
                            width: 40
                            height: 70
                            align: LEFT_MID
                            x: 0
                            widgets:
                              - label:
                                  id: forecast_day_1_text
                                  align: TOP_MID
                                  text: "今天"
                                  text_font: chinese_font14
                              - image:
                                  id: forecast_day_1_icon
                                  src: sunny_1x_black
                                  align: CENTER
                                  y: 5
                                  width: 25
                                  height: 25
                              - label:
                                  id: forecast_day_1_high
                                  align: BOTTOM_MID
                                  y: -10
                                  text: "28°"
                                  text_font: chinese_font14
                              - label:
                                  id: forecast_day_1_low
                                  align: BOTTOM_MID
                                  y: 5
                                  text: "22°"
                                  text_font: chinese_font14
                                  
                        # 第2天
