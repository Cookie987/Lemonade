script:
  - id: wakeup_button
    then:
      - if:
          condition:
            lambda: 'return id(is_sleeping);'
          then:
            - light.turn_on:
                id: backlight
                transition_length: 0.5s
            - lambda: id(is_sleeping)=false;
            - lvgl.animimg.start: ani_battery_charging
  
  - id: sleep_button
    then:
      - light.toggle:
          id: backlight
          transition_length: 0.5s
      - delay: 100ms
      - lambda: id(is_sleeping)=!id(is_sleeping);
      - lvgl.resume: 
          lvgl_id: lvgl_1
      - lvgl.animimg.start: ani_battery_charging
      - if:
          condition:
            lambda: 'return id(is_sleeping);'
          then:
            - lvgl.pause:
                show_snow: false
                lvgl_id: lvgl_1
            - lvgl.animimg.stop: ani_battery_charging

  - id: update_date
    then:
      - if:
          condition:
            lambda: 'return !id(is_sleeping);'
          then:
            - lambda: |-
                // 更新日期显示
                auto t = id(ntp_time).now();
                char date_buf[30];
                char weekday_buf[10];
                // ESPHome中day_of_week: 1=Sunday, 2=Monday, ..., 7=Saturday
                switch(t.day_of_week) {
                  case 1: strcpy(weekday_buf, "星期日"); break;
                  case 2: strcpy(weekday_buf, "星期一"); break;
                  case 3: strcpy(weekday_buf, "星期二"); break;
                  case 4: strcpy(weekday_buf, "星期三"); break;
                  case 5: strcpy(weekday_buf, "星期四"); break;
                  case 6: strcpy(weekday_buf, "星期五"); break;
                  case 7: strcpy(weekday_buf, "星期六"); break;
                  default: strcpy(weekday_buf, "未知"); break;
                }
                snprintf(date_buf, sizeof(date_buf), "%04d-%02d-%02d %s",
                        t.year, t.month, t.day_of_month, weekday_buf);
                lv_label_set_text(id(date_label), date_buf);
            - lvgl.label.update:
                id: lbl_topbar_date
                text: !lambda |-
                  static const char * const day_names[] = {"Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"};
                  auto t = id(ntp_time).now();
                  char buf[20];
                  auto a = day_names[id(ntp_time).now().day_of_week - 1]; // Adjust for 0-based index
                  snprintf(buf, sizeof(buf), "%02d.%02d %s", t.month, t.day_of_month, a);
                  return std::string(buf);

  - id: update_time
    then:
      - if:
          condition:
            lambda: 'return !id(is_sleeping);'
          then:
            - lambda: |-
                // 更新时间显示
                auto t = id(ntp_time).now();
                char buf[9];
                // 00:00 格式
                char buf1[6];
                snprintf(buf1, sizeof(buf), "%02d:%02d", t.hour, t.minute);
                snprintf(buf, sizeof(buf), "%02d:%02d:%02d", t.hour, t.minute, t.second);
                lv_label_set_text(id(time_label), buf);
                lv_label_set_text(id(lbl_topbar_time), buf1);
  
  - id: refresh_info_page
    then:
      - if:
            condition:
              lambda: 'return !id(is_sleeping);'
            then:
              - if:
                  condition:
                    or:
                      - lvgl.page.is_showing: system_setting_network_page
                      - lvgl.page.is_showing: system_setting_system_page
                  then:
                    - lambda: |-
                        using namespace esphome;

                        // 获取 WiFi 全局对象
                        auto wifi = wifi::global_wifi_component;
                        if (wifi == nullptr) return;
            
                        std::string ip = "N/A";
                        auto ip_list = wifi->get_ip_addresses();
                        if (!ip_list.empty()) {
                          ip = ip_list[0].str();
                        }

                        std::string mac = "none";
                        std::string commit = "fffffff";

                        auto cpu_freq1 = id(cpu_freq).state / 1000000;
                        std::string cpu_freq = std::to_string((int)cpu_freq1) + "MHz";  
                        std::string cpu_temp = std::to_string((int)id(internal_temp).state) + "°C";

                        mac = id(text_sensor_mac_address).state;
                        commit = id(lemonade_git_commit_sha).state.substr(0, 7);
                        
                        auto esphome_ver = id(esphome_version).state;
                        auto ssid_val = id(ssid).state;
                        auto rssi_val = id(rssi).state;
                        auto captive_portal = captive_portal::global_captive_portal;
                        bool in_ap_mode = captive_portal->is_active();
                        if (in_ap_mode) {
                          ssid_val = "(AP模式)";
                          rssi_val = 0;
                        }
                        std::string rssi_str = std::to_string((int)rssi_val);
                        if (!id(wifi_switch).state) {
                          ssid_val = "(已关闭)";
                          rssi_str = "-∞";
                        }

                        
                        if (ssid_val == "") {
                          ssid_val = "(未连接)";
                          rssi_str = "-∞";
                        }
                        // 拼接文字
                        char buf[256];
                        snprintf(buf, sizeof(buf),
                                "运行时间: %s  "
                                "CPU: %s  "
                                "%s \n"
                                "MAC: %s\n\nLemonade OS ${lemonade_version}"
                                " %s\n"
                                "ESPHome %s\nOS by Cookie987, HW by ZSVStudio.\n©2025 RedCookieStudios.",
                                id(uptime_text).state.c_str(),
                                cpu_freq.c_str(),
                                cpu_temp.c_str(),
                                mac.c_str(),
                                commit.c_str(),
                                esphome_ver.c_str()
                                );

                        char buf_wifi_info[256];
                        snprintf(buf_wifi_info, sizeof(buf_wifi_info),
                                "SSID: %s   "
                                "RSSI: %s dBm\n"
                                "IP: %s  "
                                "MAC: %s\n",
                                ssid_val.c_str(),
                                rssi_str.c_str(),
                                ip.c_str(),
                                mac.c_str()
                                );
                        lv_label_set_text(id(lbl_wifi_info), buf_wifi_info);
                        lv_label_set_text(id(lbl_sysinfo), buf);

  - id: zsv_iot_update
    mode: single
    then:
      - http_request.get:
          # url: http://iot.zsvstudio.top/cfg?id=94:A9:90:30:4C:A0
          url: !lambda |-
            std::string url, mac, acturl;
            url = "${zsv_iot_url}cfg?id=";
            mac = id(text_sensor_mac_address).state;
            
            // 检查MAC地址是否为空或无效
            if (mac.empty() || mac == "" || mac.length() < 10) {
              ESP_LOGE("main", "MAC address is invalid or empty: '%s'", mac.c_str());
              return "${zsv_iot_url}cfg?id=000000000000";
            }
            
            acturl = url + mac;
            ESP_LOGD("zsv_iot", " %s", acturl.c_str());
            return acturl.c_str();
          capture_response: true
          on_response:
            then:
              - lambda: |- 
                  ESP_LOGD("zsv_iot", "BODY: '%s'", body.c_str());
              - if:
                  condition:
                      lambda: return response->status_code == 200;
                  then:
                      - lambda: |-
                          json::parse_json(body, [](JsonObject root) -> bool {
                              if (root["producetime"]) {
                                  id(zsv_iot_last_status) =(root["producetime"]).as<std::string>();
                                  if (root["morewifi"]) {
                                    auto wifi = wifi::global_wifi_component;
                                    if (wifi == nullptr) return false;
                                    JsonArray morewifi = root["morewifi"];
                                    int i = 0;
                                    wifi->clear_sta();
                                    ESP_LOGI("zsv_iot", "Cleared user saved WiFi STA");
                                    for (JsonObject item : morewifi) {
                                      i++;
                                      wifi->save_wifi_sta(item["ssid"].as<std::string>(), item["password"].as<std::string>());
                                      ESP_LOGI("zsv_iot", "Saved WiFi STA: %s", item["ssid"].as<std::string>().c_str());
                                    }
                                  }
                                  if (root["desc"]) {
                                    ESP_LOGI("zsv_iot", "Got description: %s", root["desc"].as<std::string>());
                                  }
                                  auto t = id(ntp_time).now();
                                  std::string msg = "200 成功。 于 " + t.strftime("%H:%M:%S") + "\n" + root["desc"].as<std::string>();
                                  lv_label_set_text(id(lbl_zsv_iot_info), msg.c_str());

                                  return true;
                              }
                              else {
                                return false;
                              }
                          });
                      - logger.log:
                          format: "Response status: %d, message %s"
                          args: [ 'response->status_code', 'body.c_str()' ]
                  else:
                      - logger.log:
                          format: "Error: Response status: %d, message %s"
                          args: [ 'response->status_code', 'body.c_str()' ]
                      - lambda: |-
                          auto t = id(ntp_time).now();
                          std::string msg = std::to_string(response->status_code) + " 失败。 于" + t.strftime("%H:%M:%S");
                          lv_label_set_text(id(lbl_zsv_iot_info), msg.c_str());