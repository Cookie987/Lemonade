    size: 36
    bpp: 4
    glyphs: [-0123456789CN%A ℃/雨雾冰雪多少阴云晴间阵强雷伴有雹小大到夹薄霾扬沙浮尘暴浓中严重热冷未知度]

  - file: "fonts/MiSans-Medium.ttf"
    id: "chinese_font18"
    size: 18
    bpp: 4
    glyphs: [设置确认绘制解案图密数九点连线字码星期一二三四五六日东南西北风雨雾冰雪转已锁定多少阴云晴间阵强雷伴有雹小大到夹薄霾扬沙浮尘暴浓中严重热冷未知温度 ~℃N%.km/shA-|0123456789]
