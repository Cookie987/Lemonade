interval:
  - interval: 1s
    id: interval_time
    then:
      - if:
          condition:
            lambda: 'return !id(is_sleeping);'
          then:
              - if:
                  condition:
                    lvgl.page.is_showing: page_main
                  then:
                    - lambda: |-
                        auto t = id(ntp_time).now();
                        char buf[9];
                        snprintf(buf, sizeof(buf), "%02d:%02d:%02d", t.hour, t.minute, t.second);
                        lv_label_set_text(id(time_label), buf);
                        
                        // 更新日期显示
                        char date_buf[30];
                        char weekday_buf[10];
                        // ESPHome中day_of_week: 1=Sunday, 2=Monday, ..., 7=Saturday
                        switch(t.day_of_week) {
                          case 1: strcpy(weekday_buf, "星期日"); break;
                          case 2: strcpy(weekday_buf, "星期一"); break;
                          case 3: strcpy(weekday_buf, "星期二"); break;
                          case 4: strcpy(weekday_buf, "星期三"); break;
                          case 5: strcpy(weekday_buf, "星期四"); break;
                          case 6: strcpy(weekday_buf, "星期五"); break;
                          case 7: strcpy(weekday_buf, "星期六"); break;
                          default: strcpy(weekday_buf, "未知"); break;
                        }
                        snprintf(date_buf, sizeof(date_buf), "%04d-%02d-%02d %s",
                                t.year, t.month, t.day_of_month, weekday_buf);
                        lv_label_set_text(id(date_label), date_buf);


  - interval: 1s
    id: interval_infopage
    then:
      - if:
          condition:
            lambda: 'return !id(is_sleeping);'
          then:
            - if:
                condition:
                  lvgl.page.is_showing: system_setting_system_page
                then:
                  - lambda: |-
                      using namespace esphome;

                      // 获取 WiFi 全局对象
                      auto wifi = wifi::global_wifi_component;
                      if (wifi == nullptr) return;

                      std::string ip = "N/A";
                      auto ip_list = wifi->get_ip_addresses();
                      if (!ip_list.empty()) {
                        ip = ip_list[0].str();
                      }

                      std::string mac = "none";
                      std::string commit = "fffffff";

                      mac = id(text_sensor_mac_address).state;
                      commit = id(lemonade_git_commit_sha).state.substr(0, 7);
                      
                      auto esphome_ver = id(esphome_version).state;
                      auto ssid_val = id(ssid).state;
                      auto rssi_val = id(rssi).state;

                      // 拼接文字
                      char buf[256];
                      snprintf(buf, sizeof(buf),
                              "SSID: %s   "
                              "RSSI: %s dBm\n"
                              "IP: %s    "
                              "MAC: %s\n\nLemonade OS ${lemonade_version}"
                              " %s\n"
                              "ESPHome %s\nOS by Cookie987, HW by ZSVStudio.\n©2025 RedCookieStudios.",
                              ssid_val.c_str(),
                              std::to_string(rssi_val).c_str(),
                              ip.c_str(),
                              mac.c_str(),
                              commit.c_str(),
                              esphome_ver.c_str()
                              );

                      lv_label_set_text(id(lbl_sysinfo), buf);

  - interval: 10ms
    then:
        - if:
            condition:
              lambda: 'return !id(is_sleeping);'
            then:
              - if:
                  condition:
                    lvgl.page.is_showing: page_timer
                  then:
                  - lambda: |-
                      // 秒表更新逻辑，精确到0.01秒
                      if (id(is_timer_running)) {
                        unsigned long elapsed = millis() - id(stopwatch_start_time);
                        int hours = (elapsed / 1000) / 3600;
                        int minutes = ((elapsed / 1000) / 60) % 60;
                        int seconds = (elapsed / 1000) % 60;
                        int hundredths = (elapsed % 1000) / 10;  // 精确到0.01秒
                        char buf[16];
                        sprintf(buf, "%02d:%02d:%02d.%02d", hours, minutes, seconds, hundredths);
                        lv_label_set_text(id(lbl_stopwatch), buf);
                      }
  - interval: 1s
    then:
        - if:
            condition:
              lambda: 'return !id(is_sleeping);'
            then:
              - if:
                  condition:
                    lvgl.page.is_showing: page_timer
                  then:
                  - lambda: |-
                      // 倒计时更新逻辑
                      if (id(is_countdown_running)) {
                        unsigned long current_time = millis();
                        if (current_time < id(countdown_end_time)) {
                          // 计算剩余时间
                          unsigned long remaining = (id(countdown_end_time) - current_time) / 1000;
                          
                          // 计算小时、分钟、秒
                          int hours = remaining / 3600;
                          int minutes = (remaining % 3600) / 60;
                          int seconds = remaining % 60;
                          
                          // 更新roller显示
                          lv_roller_set_selected(id(roller_countdown_hours_tens).obj, hours / 10, LV_ANIM_ON);
                          lv_roller_set_selected(id(roller_countdown_hours_ones).obj, hours % 10, LV_ANIM_ON);
                          lv_roller_set_selected(id(roller_countdown_minutes_tens).obj, minutes / 10, LV_ANIM_ON);
                          lv_roller_set_selected(id(roller_countdown_minutes_ones).obj, minutes % 10, LV_ANIM_ON);
                          lv_roller_set_selected(id(roller_countdown_seconds_tens).obj, seconds / 10, LV_ANIM_ON);
                          lv_roller_set_selected(id(roller_countdown_seconds_ones).obj, seconds % 10, LV_ANIM_ON);
                        } else {
                          // 倒计时结束
                          id(is_countdown_running) = false;
                          id(countdown_end_time) = 0;
                          lv_label_set_text(id(lbl_countdown_button), "开始");
                          // 重置为00:00:00
                          lv_roller_set_selected(id(roller_countdown_hours_tens).obj, 0, LV_ANIM_ON);
                          lv_roller_set_selected(id(roller_countdown_hours_ones).obj, 0, LV_ANIM_ON);
                          lv_roller_set_selected(id(roller_countdown_minutes_tens).obj, 0, LV_ANIM_ON);
                          lv_roller_set_selected(id(roller_countdown_minutes_ones).obj, 0, LV_ANIM_ON);
                          lv_roller_set_selected(id(roller_countdown_seconds_tens).obj, 0, LV_ANIM_ON);
                          lv_roller_set_selected(id(roller_countdown_seconds_ones).obj, 0, LV_ANIM_ON);
                        }
                      }