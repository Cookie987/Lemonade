- platform: gpio
  pin: GPIO11
  id: a
  on_press: 
    then:
    - light.turn_on:
        id: backlight
        transition_length: 0.5s
    - lambda: id(sleeping)=false;
    - lvgl.animimg.start: ani_battery_charging
    
- platform: gpio
  pin: GPIO12
  id: b
  on_press: 
    then:
    - light.turn_on:
        id: backlight
        transition_length: 0.5s
    - lambda: id(sleeping)=false;
    - lvgl.animimg.start: ani_battery_charging
- platform: gpio
  pin: GPIO38
  id: x
  on_press: 
    then:
    - light.turn_on:
        id: backlight
        transition_length: 0.5s
    - lambda: id(sleeping)=false;
    - lvgl.animimg.start: ani_battery_charging
- platform: gpio
  pin: GPIO47
  id: o
  on_click: 
    - min_length: 10ms
      max_length: 500ms
      then:
        - light.toggle:
            id: backlight
            transition_length: 0.5s
        - delay: 100ms  
        - lambda: id(sleeping)=!id(sleeping);
        - lvgl.animimg.start: ani_battery_charging
        - if:
            condition:
              lambda: 'return id(sleeping);'
            then:
              - lvgl.pause:
                  show_snow: false
                  lvgl_id: lvgl1
              - lvgl.animimg.stop: ani_battery_charging
    - min_length: 500ms
      max_length: 2000ms
      then:
        - lvgl.page.show: 
            id: main_page
            animation: FADE_IN
            time: 500ms